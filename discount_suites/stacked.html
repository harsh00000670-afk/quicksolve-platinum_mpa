<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta http-equiv="Cache-Control" content="max-age=3600, must-revalidate">

    <title>Stacked Discounts | Deal Hacker | QuickSolve Platinum</title>
    <meta name="theme-color" content="#0d0a15">

    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="../assets/css/all.min.css">
    <link rel="stylesheet" href="../style.css">

    <style>
        /* =========================================
           STACKED DISCOUNT - PLATINUM ENGINE (SSJ4)
           ========================================= */
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800;900&display=swap');

        :root {
            --bg-deep: #0d0a15;
            --card-bg: #151322;
            --border-subtle: #31354A;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --text-dim: #475569;
            --accent-red: #ef4444;
            --accent-red-glow: rgba(239, 68, 68, 0.3);
            --accent-gold: #fbbd23;
            --accent-gold-glow: rgba(251, 189, 35, 0.3);
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
        }

        body { 
            margin: 0; background-color: var(--bg-deep); color: var(--text-main); 
            font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden; position: relative;
        }

        /* Glowing Orbs */
        .bg-glow { position: fixed; border-radius: 50%; filter: blur(70px); opacity: 0.25; z-index: -1; pointer-events: none;}
        .glow-1 { top: -5%; right: -5%; width: 250px; height: 250px; background: var(--accent-red); }
        .glow-2 { bottom: 10%; left: -10%; width: 250px; height: 250px; background: var(--accent-gold); }

        /* HEADER */
        .app-header {
            position: sticky; top: 0; z-index: 100; background: rgba(13, 10, 21, 0.85); backdrop-filter: blur(15px); 
            border-bottom: 1px solid rgba(255,255,255,0.05); padding: 12px 15px; display: flex; align-items: center; justify-content: space-between;
        }
        .qs-back-btn { 
            background: #1f1b2e; border: none; color: var(--text-sub); width: 36px; height: 36px; 
            border-radius: 10px; display: flex; align-items: center; justify-content: center; 
            font-size: 1.1rem; cursor: pointer; transition: 0.2s; 
        }
        .qs-back-btn:active { transform: scale(0.9); color: var(--text-main); }
        .brand { color: var(--accent-red); font-weight: 800; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px;}

        /* HERO */
        .hero { text-align: center; margin-bottom: 20px; padding-top: 10px;}
        .hero h1 { margin: 0; font-size: 2rem; background: linear-gradient(90deg, #ef4444, #fbbd23); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; letter-spacing: -0.5px;}
        .hero p { color: var(--accent-gold); font-size: 0.85rem; margin-top: 5px; font-family: 'JetBrains Mono', monospace; font-weight: 600; letter-spacing: 1px;}

        /* CARDS & INPUTS */
        .config-card {
            background: var(--card-bg); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 20px; 
            padding: 20px; margin-bottom: 25px; box-shadow: 0 10px 40px var(--accent-red-glow);
        }
        .inp-group { margin-bottom: 18px; position: relative; }
        .inp-lbl { display: block; font-size: 0.75rem; color: var(--text-sub); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        
        .inp-field {
            width: 100%; background: #1a1829; border: 1px solid rgba(255,255,255,0.1); color: var(--text-main);
            padding: 14px 15px; border-radius: 12px; font-size: 1.1rem; font-weight: 800; font-family: 'JetBrains Mono', monospace;
            outline: none; transition: 0.3s; box-sizing: border-box;
        }
        .inp-field:focus { border-color: var(--accent-red); box-shadow: 0 0 10px var(--accent-red-glow); }
        .inp-field::placeholder { color: var(--text-dim); font-weight: 500; }

        /* Input Grid for Side-by-Side Elements */
        .inp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        /* CUSTOM TOGGLE SWITCH (Replaces Dropdown) */
        .toggle-wrap { display: flex; align-items: center; gap: 10px; }
        .toggle-wrap .inp-field { flex: 1; }
        .custom-toggle {
            background: #1a1829; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
            display: flex; padding: 4px; position: relative; cursor: pointer; flex-shrink: 0; width: 90px; height: 50px; box-sizing: border-box;
        }
        .ts-slider {
            position: absolute; top: 4px; left: 4px; width: 40px; height: 40px;
            background: var(--accent-red); border-radius: 8px; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 10px var(--accent-red-glow); z-index: 1;
        }
        .ts-opt {
            flex: 1; display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; font-weight: 900; color: var(--text-sub); z-index: 2; transition: 0.3s; font-family: 'JetBrains Mono', monospace;
        }
        .ts-opt.active { color: #fff; }
        /* State for Flat Amount (₹) */
        .custom-toggle.state-flat .ts-slider { transform: translateX(40px); background: var(--accent-gold); box-shadow: 0 0 10px var(--accent-gold-glow);}

        .calc-btn {
            width: 100%; background: linear-gradient(90deg, #ef4444, #fbbd23);
            color: #000; border: none; padding: 16px; border-radius: 12px; font-size: 1rem; font-weight: 900;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s;
            box-shadow: 0 5px 20px var(--accent-red-glow); display: flex; justify-content: center; gap: 10px; align-items: center; margin-top: 10px;
        }
        .calc-btn:active { transform: scale(0.98); box-shadow: none; }

        /* RESULTS CARD */
        .res-card {
            background: linear-gradient(180deg, #1a1829, var(--card-bg)); border: 1px solid rgba(16, 185, 129, 0.4); border-radius: 20px; 
            padding: 25px 20px; margin-bottom: 30px; box-shadow: 0 10px 40px rgba(16, 185, 129, 0.2); display: none; text-align: center;
        }
        
        .res-lbl { font-size: 0.75rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800; margin-bottom: 5px; }
        .res-main-val { font-size: 2.8rem; color: var(--accent-green); font-weight: 900; font-family: 'JetBrains Mono', monospace; margin-bottom: 20px; line-height: 1; text-shadow: 0 0 20px rgba(16, 185, 129, 0.4);}
        .res-main-val small { font-size: 1.5rem; color: var(--text-sub); }
        
        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;}
        .res-box { background: rgba(2, 6, 23, 0.6); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 15px 10px; }
        .res-box-lbl { font-size: 0.65rem; color: var(--text-sub); text-transform: uppercase; font-weight: 800; margin-bottom: 5px; letter-spacing: 0.5px;}
        .res-box-val { font-size: 1.2rem; color: var(--text-main); font-weight: 900; font-family: 'JetBrains Mono', monospace; }

        /* TRAP ALERT BANNER */
        .trap-alert {
            background: rgba(239, 68, 68, 0.1); border: 1px solid var(--accent-red); border-radius: 12px;
            padding: 15px; text-align: left; display: none; align-items: flex-start; gap: 12px;
            box-shadow: 0 0 15px var(--accent-red-glow); animation: shake 0.5s ease-in-out;
        }
        .trap-icon { font-size: 1.5rem; color: var(--accent-red); margin-top: 2px;}
        .trap-text { font-size: 0.85rem; color: var(--text-main); line-height: 1.5; font-weight: 600;}
        .trap-text b { color: var(--accent-red); font-weight: 900; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem;}

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        /* CUSTOM TOAST */
        .toast {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            background: #ef4444; color: #fff; padding: 12px 24px; border-radius: 30px;
            font-size: 0.85rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            z-index: 9999; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px var(--accent-red-glow); display: flex; align-items: center; gap: 8px;
        }
        .toast.show { bottom: 30px; }

        /* ANIMATIONS */
        .anim-up { animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; opacity: 0; transform: translateY(25px); }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    
    <div class="toast" id="custom-toast"><i class="fas fa-exclamation-triangle"></i> <span id="toast-msg">Error</span></div>

    <header class="app-header">
        <button onclick="window.history.back()" class="qs-back-btn"><i class="fas fa-arrow-left"></i></button>
        <div class="brand"><i class="fas fa-layer-group"></i> STACKED DISCOUNT</div>
    </header>

    <main style="padding: 15px; max-width: 600px; margin: 0 auto; padding-bottom: 80px;">
        
        <div class="hero anim-up" style="animation-delay: 0.1s;">
            <h1>The Illusion Math</h1>
            <p>> decrypt_offer --no_bs</p>
        </div>

        <div class="config-card anim-up" style="animation-delay: 0.2s;">
            
            <div class="inp-group">
                <label class="inp-lbl">1. MRP / Base Price (₹)</label>
                <input type="number" id="inp-mrp" class="inp-field" placeholder="e.g. 50000" min="0">
            </div>

            <div class="inp-group">
                <label class="inp-lbl">2. Primary Discount (The Bait)</label>
                <div class="toggle-wrap">
                    <input type="number" id="inp-pri" class="inp-field" placeholder="e.g. 40" min="0">
                    <div class="custom-toggle" id="pri-toggle" onclick="SSJ4_Discount.togglePriType()">
                        <div class="ts-slider"></div>
                        <div class="ts-opt active" id="lbl-pct">%</div>
                        <div class="ts-opt" id="lbl-flat">₹</div>
                    </div>
                </div>
            </div>

            <div class="inp-group">
                <label class="inp-lbl">3. Wallet Balance / SuperCoins (₹) <span style="text-transform:none; color:var(--text-dim);">(Optional)</span></label>
                <input type="number" id="inp-coins" class="inp-field" placeholder="e.g. 500" min="0">
            </div>

            <div class="inp-grid">
                <div class="inp-group">
                    <label class="inp-lbl">4. Bank / Card Disc (%)</label>
                    <input type="number" id="inp-bank" class="inp-field" placeholder="e.g. 10" min="0">
                </div>
                <div class="inp-group">
                    <label class="inp-lbl">5. Max Capping (₹)</label>
                    <input type="number" id="inp-cap" class="inp-field" placeholder="e.g. 1500" min="0">
                </div>
            </div>

            <div class="inp-grid">
                <div class="inp-group">
                    <label class="inp-lbl">6. Platform Fee (₹)</label>
                    <input type="number" id="inp-plat" class="inp-field" placeholder="e.g. 49" min="0">
                </div>
                <div class="inp-group">
                    <label class="inp-lbl">7. Delivery / Shipping (₹)</label>
                    <input type="number" id="inp-del" class="inp-field" placeholder="e.g. 99" min="0">
                </div>
            </div>

            <button class="calc-btn" onclick="SSJ4_Discount.calculate()">
                <i class="fas fa-search-dollar"></i> Reveal True Price
            </button>
        </div>

        <div class="res-card" id="results-container">
            <div class="res-lbl" style="color: var(--accent-green);">Final Payable Amount</div>
            <div class="res-main-val" id="res-payable"><small>₹</small>--</div>
            
            <div class="res-grid">
                <div class="res-box">
                    <div class="res-box-lbl">Total Money Saved</div>
                    <div class="res-box-val" id="res-saved" style="color:var(--accent-gold);">₹--</div>
                </div>
                <div class="res-box">
                    <div class="res-box-lbl">Effective Discount</div>
                    <div class="res-box-val" id="res-eff" style="color:var(--accent-blue);">--%</div>
                </div>
            </div>

            <div class="trap-alert" id="trap-alert">
                <div class="trap-icon"><i class="fas fa-skull-crossbones"></i></div>
                <div class="trap-text">
                    <b>WARNING: CAPPING TRAP ACTIVATED!</b><br>
                    Your actual bank discount should have been <b id="trap-calc-val">₹0</b>, but the platform capped it at <b id="trap-cap-val">₹0</b>. You lost <b id="trap-loss-val">₹0</b> in this illusion.
                </div>
            </div>
        </div>

    </main>

    <script>
        /* QUICKSOLVE PLATINUM - STACKED DISCOUNT ENGINE */
        
        window.SSJ4_Discount = {
            isPriPct: true,

            haptic: function() { if(navigator.vibrate) navigator.vibrate(20); },

            showToast: function(msg) {
                const toast = document.getElementById('custom-toast');
                document.getElementById('toast-msg').innerText = msg;
                if(navigator.vibrate) navigator.vibrate([50, 50, 50]);
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            },

            // Custom Toggle Logic
            togglePriType: function() {
                this.haptic();
                const toggle = document.getElementById('pri-toggle');
                this.isPriPct = !this.isPriPct;
                
                if(this.isPriPct) {
                    toggle.classList.remove('state-flat');
                    document.getElementById('lbl-pct').classList.add('active');
                    document.getElementById('lbl-flat').classList.remove('active');
                } else {
                    toggle.classList.add('state-flat');
                    document.getElementById('lbl-pct').classList.remove('active');
                    document.getElementById('lbl-flat').classList.add('active');
                }
            },

            // The God-Level Math Engine
            calculate: function() {
                this.haptic();

                // Get Values
                const mrp = parseFloat(document.getElementById('inp-mrp').value);
                if(isNaN(mrp) || mrp <= 0) {
                    this.showToast("Please enter a valid MRP!"); return;
                }

                const priVal = parseFloat(document.getElementById('inp-pri').value) || 0;
                const coins = parseFloat(document.getElementById('inp-coins').value) || 0;
                const bankPct = parseFloat(document.getElementById('inp-bank').value) || 0;
                const maxCap = parseFloat(document.getElementById('inp-cap').value) || Infinity;
                const platFee = parseFloat(document.getElementById('inp-plat').value) || 0;
                const delFee = parseFloat(document.getElementById('inp-del').value) || 0;

                // Step 1: Base Price after Primary Discount
                let priDiscountAmt = this.isPriPct ? (mrp * (priVal / 100)) : priVal;
                // Don't let discount exceed MRP
                if(priDiscountAmt > mrp) priDiscountAmt = mrp; 
                let basePrice = mrp - priDiscountAmt;

                // Step 2: Wallet Deduction
                let actualCoinsUsed = Math.min(coins, basePrice);
                let priceAfterCoins = basePrice - actualCoinsUsed;

                // Step 3 & 4: Bank Calculation & The Capping Trap
                let calcBankDisc = priceAfterCoins * (bankPct / 100);
                let actualBankDisc = Math.min(calcBankDisc, maxCap);

                // Step 5: Final Item Price
                let finalItemPrice = priceAfterCoins - actualBankDisc;

                // Step 6: Add Hidden Extras
                let finalPayable = finalItemPrice + platFee + delFee;

                // Output Math
                let totalSaved = mrp - finalItemPrice; // True savings on the item
                let effectivePct = (totalSaved / mrp) * 100;

                // RENDER RESULTS
                document.getElementById('res-payable').innerHTML = `<small>₹</small>${finalPayable.toLocaleString('en-IN', {maximumFractionDigits: 2})}`;
                document.getElementById('res-saved').innerText = `₹${totalSaved.toLocaleString('en-IN', {maximumFractionDigits: 2})}`;
                document.getElementById('res-eff').innerText = `${effectivePct.toFixed(2)}%`;

                // Trap Alert Logic
                const trapAlert = document.getElementById('trap-alert');
                if(calcBankDisc > maxCap && maxCap > 0) {
                    const loss = calcBankDisc - maxCap;
                    document.getElementById('trap-calc-val').innerText = `₹${calcBankDisc.toLocaleString('en-IN', {maximumFractionDigits: 0})}`;
                    document.getElementById('trap-cap-val').innerText = `₹${maxCap.toLocaleString('en-IN', {maximumFractionDigits: 0})}`;
                    document.getElementById('trap-loss-val').innerText = `₹${loss.toLocaleString('en-IN', {maximumFractionDigits: 0})}`;
                    trapAlert.style.display = 'flex';
                } else {
                    trapAlert.style.display = 'none';
                }

                // Show Card with Animation
                const resCard = document.getElementById('results-container');
                resCard.style.display = 'block';
                resCard.classList.remove('anim-up');
                void resCard.offsetWidth; // trigger reflow
                resCard.classList.add('anim-up');
                
                setTimeout(() => { resCard.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
            }
        };
    </script>
</body>
</html>
