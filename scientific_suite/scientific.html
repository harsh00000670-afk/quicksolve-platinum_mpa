    <script>
        /* QUICKSOLVE PLATINUM - UNIVERSAL MATH CORE v18.2 */
        window.MathCore = {
            // --- 1. Internal Math Functions ---
            fact: function(n) {
                if (n < 0 || n > 170) return NaN;
                if (n % 1 !== 0) return NaN;
                if (n === 0 || n === 1) return 1;
                let r = 1;
                for (let i = 2; i <= n; i++) r *= i;
                return r;
            },

            nCr: function(n, r) {
                if (r < 0 || r > n) return NaN;
                return this.fact(n) / (this.fact(r) * this.fact(n - r));
            },

            nPr: function(n, r) {
                if (r < 0 || r > n) return NaN;
                return this.fact(n) / this.fact(n - r);
            },

            // y√x  →  x^(1/y)
            rt: function(y, x) {
                return Math.pow(x, 1 / y);
            },

            // --- 2. Solver ---
            solve: function(expr, isDeg) {
                try {
                    if (!expr) return "0";

                    // A. Auto-close brackets
                    let o = (expr.match(/\(/g) || []).length;
                    let c = (expr.match(/\)/g) || []).length;
                    while (o > c) { expr += ")"; c++; }

                    // B. Decimal safety
                    if (expr.startsWith('.')) expr = '0' + expr;
                    expr = expr.replace(/([+\-*/^(\[,])\./g, '$10.');

                    // C. EARLY bind ceil / floor / round
                    expr = expr.replace(/ceil\s*\(/g, "Math.ceil(");
                    expr = expr.replace(/floor\s*\(/g, "Math.floor(");
                    expr = expr.replace(/round\s*\(/g, "Math.round(");

                    // D. Symbol mapping (SAFE)
                    let s = expr
                        .replace(/×/g, "*")
                        .replace(/÷/g, "/")
                        .replace(/−/g, "-")
                        .replace(/π/g, "Math.PI")
                        .replace(/\be\b/g, "Math.E"); 

                    // E. mod → %
                    s = s.replace(/mod/g, "%");

                    // F. yrt(x) priority (before implicit multiplication)
                    s = s.replace(
                        /(\d+(\.\d+)?|\)|Math\.PI|Math\.E)\s*rt\s*\(/g,
                        "MathCore.rt($1,"
                    );

                    // G. Implicit multiplication
                    s = s.replace(
                        /(\d|\))(?=sin|cos|tan|asin|acos|atan|log|ln|sqrt|abs|Math\.PI|Math\.E|\()/g,
                        '$1*'
                    );

                    // H. Other math
                    s = s.replace(/(\d+(\.\d+)?|Math\.PI|Math\.E|\([^()]*\))!/g, "MathCore.fact($1)");
                    s = s.replace(/(\d+(\.\d+)?)nCr(\d+(\.\d+)?)/g, "MathCore.nCr($1,$3)");
                    s = s.replace(/(\d+(\.\d+)?)nPr(\d+(\.\d+)?)/g, "MathCore.nPr($1,$3)");

                    // I. Power (right-to-left)
                    while (s.includes('^')) {
                        s = s.replace(
                            /([0-9\.]+|Math\.[A-Z]+|MathCore\.[a-zA-Z]+\([^)]*\)|[a-z]+\([^)]*\)|\([^)]*\))\^/g,
                            "($1)**"
                        );
                        if (s.includes('^') && !s.includes(')**')) {
                            s = s.replace(/\^/g, "**");
                        }
                    }

                    // J. Context
                    const toRad = x => isDeg ? x * Math.PI / 180 : x;
                    const fromRad = x => isDeg ? x * 180 / Math.PI : x;

                    const context = {
                        sin: x => Math.sin(toRad(x)),
                        cos: x => Math.cos(toRad(x)),
                        tan: x => {
                            if (isDeg && Math.abs(x % 180) === 90) return Infinity;
                            return Math.tan(toRad(x));
                        },
                        asin: x => fromRad(Math.asin(x)),
                        acos: x => fromRad(Math.acos(x)),
                        atan: x => fromRad(Math.atan(x)),
                        log: x => Math.log10(x),
                        ln: x => Math.log(x),
                        sqrt: x => Math.sqrt(x),
                        abs: x => Math.abs(x),
                        MathCore: this
                    };

                    const fn = new Function(...Object.keys(context), `return ${s};`);
                    let res = fn(...Object.values(context));

                    if (isNaN(res)) return "Error";
                    if (!isFinite(res)) return "Overflow";

                    return parseFloat(res.toFixed(10));

                } catch (e) {
                    console.error(e);
                    return "Syntax Error";
                }
            }
        };
    </script>

            window.addEventListener('qs-tool-opened', function(e) {
                if (e.detail && (e.detail.tool === 'scientific.js' || e.detail.tool === 'scientific_suite/scientific.js')) {
                    console.log("Scientific Reset");
                    state.expr = "";
                    state.solved = false;
                    setScreen('sci-screen-result', "0");
                    setScreen('sci-screen-expr', "");
                }
            });

            // Standalone Boot (For Direct MPA Load)
            document.addEventListener('DOMContentLoaded', () => {
                setScreen('sci-screen-result', "0");
                setScreen('sci-screen-expr', "");
            });

            window.sciIn = function(v) {
                // Null Check (Zaroori hai)
                if (!document.getElementById('sci-screen-result')) return;
                
                if (state.solved && /[\d\.]/.test(v)) state.expr = "";
                state.solved = false;
                state.expr += v;
                render();
                if(window.doHaptic) window.doHaptic();
            };

            window.sciAC = function() {
                state.expr = "";
                setScreen('sci-screen-result', "0");
                state.solved = false;
                render();
                if(window.doHaptic) window.doHaptic();
            };

            window.sciDel = function() {
                state.expr = state.expr.slice(0, -1);
                render();
                if(window.doHaptic) window.doHaptic();
            };

            window.sciSolve = function() {
                if (!state.expr) return;
                const result = window.MathCore.solve(state.expr, state.isDeg);
                setScreen('sci-screen-result', result);
                
                // 🚀 HISTORY TAPE LOGIC
                if (typeof result === 'number' && !isNaN(result)) {
                    if(window.calcHistory.length === 0 || window.calcHistory[0].expr !== state.expr) {
                        window.calcHistory.unshift({ expr: state.expr, res: result });
                        if(window.calcHistory.length > 10) window.calcHistory.pop();
                        updateHistoryMenu();
                    }
                    state.ans = result;
                }
                state.solved = true;
                if(window.doHaptic) window.doHaptic();
            };

            window.sciM = function(a) {
                const el = document.getElementById('sci-screen-result');
                if(!el) return;
                let c = parseFloat(el.innerText) || 0;
                if(a==='MC') state.memory=0;
                if(a==='MR') window.sciIn(state.memory.toString());
                if(a==='M+') state.memory+=c;
                if(a==='M-') state.memory-=c;
                const ind = document.getElementById('sci-mem-ind');
                if(ind) ind.style.display = state.memory?'inline':'none';
                if(window.doHaptic) window.doHaptic();
            };

            window.sciToggleDR = function() {
                state.isDeg = !state.isDeg;
                setScreen('sci-screen-deg', state.isDeg?"DEG":"RAD");
                // Update ARIA label dynamically for screen readers
                const degBtn = document.getElementById('sci-screen-deg');
                if(degBtn) degBtn.setAttribute('aria-label', `Current Mode: ${state.isDeg ? 'Degrees' : 'Radians'}. Tap to toggle.`);
                
                const b = document.getElementById('btn-deg-rad');
                if(b) b.innerText = state.isDeg?"DEG":"RAD"; 
                if(window.doHaptic) window.doHaptic();
            };

            function render() { setScreen('sci-screen-expr', state.expr); }

            // 🚀 POPUP MENU LOGIC
            window.toggleSciMenu = function(menuId) {
                ['sci-const-menu', 'sci-history-menu'].forEach(id => {
                    if(id !== menuId) document.getElementById(id).classList.remove('active');
                });
                document.getElementById(menuId).classList.toggle('active');
                if(window.doHaptic) window.doHaptic();
            };

            window.insertConst = function(val) {
                window.sciIn(val);
                document.getElementById('sci-const-menu').classList.remove('active');
            };

            window.loadHistoryItem = function(expr) {
                window.sciAC();
                for(let char of expr) { window.sciIn(char); }
                document.getElementById('sci-history-menu').classList.remove('active');
            };

            function updateHistoryMenu() {
                const menu = document.getElementById('sci-history-menu');
                menu.innerHTML = window.calcHistory.map(item =>
                    `<button class="pop-item" onclick="loadHistoryItem('${item.expr.replace(/'/g, "\\'")}')">
                        ${item.expr} <br><span>= ${item.res}</span>
                    </button>`
                ).join('');
            }
        })();
    </script>
    
<script>
    /* QUICKSOLVE PLATINUM - ADVANCED VOICE ENGINE (WITH LIVE TYPING & CONSTANTS) */
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let voiceRecog;
    let isMicActive = false;
    let lastResultStr = "0"; 

    if (SpeechRecognition) {
        voiceRecog = new SpeechRecognition();
        voiceRecog.continuous = false; 
        voiceRecog.interimResults = true; // 🚀 LIVE TYPING ACTIVATED
        voiceRecog.lang = 'en-IN'; 

        voiceRecog.onstart = function() {
            isMicActive = true;
            let micBtn = document.getElementById('voice-calc-btn');
            micBtn.classList.add('listening');
            micBtn.setAttribute('aria-pressed', 'true'); 
            
            lastResultStr = document.getElementById('sci-screen-result').innerText;
            document.getElementById('sci-screen-result').style.color = "#94a3b8";
            setScreen('sci-screen-result', "Listening... ✍️");
            if(window.doHaptic) window.doHaptic();
        };

        voiceRecog.onresult = function(event) {
            let interimTranscript = '';
            let finalTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript.toLowerCase();
                } else {
                    interimTranscript += event.results[i][0].transcript.toLowerCase();
                }
            }

            // Show LIVE typing
            if (interimTranscript) {
                document.getElementById('sci-screen-result').innerText = interimTranscript + " ✍️";
            }

            // Process Final
            if (finalTranscript) {
                document.getElementById('sci-screen-result').style.color = "#fff";
                console.log("User said:", finalTranscript);
                processVoiceCommand(finalTranscript);
            }
        };

        voiceRecog.onerror = function(event) {
            document.getElementById('sci-screen-result').style.color = "#fff";
            setScreen('sci-screen-result', "Mic Error");
            stopVoiceCalc();
        };

        voiceRecog.onend = function() {
            stopVoiceCalc();
        };
    } else {
        console.warn("Speech Recognition browser mein support nahi karta bro.");
    }

    function toggleVoiceCalc() {
        if (!SpeechRecognition) return;
        if (isMicActive) voiceRecog.stop(); else voiceRecog.start();
    }

    function stopVoiceCalc() {
        isMicActive = false;
        let micBtn = document.getElementById('voice-calc-btn');
        micBtn.classList.remove('listening');
        micBtn.setAttribute('aria-pressed', 'false'); 
        
        const resScreen = document.getElementById('sci-screen-result');
        if(resScreen.innerText.includes("Listening...")) {
            resScreen.style.color = "#fff";
            resScreen.innerText = lastResultStr;
        }
    }
    
    function processVoiceCommand(text) {
        let processedText = text.toLowerCase();

        const numberDict = {
            '0': ['zero', 'shunya', 'shunye'], '1': ['one', 'ek'], '2': ['two', 'do', 'tu'],
            '3': ['three', 'teen'], '4': ['four', 'chaar', 'char'], '5': ['five', 'paanch', 'panch'],
            '6': ['six', 'che', 'chah'], '7': ['seven', 'saat', 'sat'], '8': ['eight', 'aath', 'ath'],
            '9': ['nine', 'nau', 'no'], '10': ['ten', 'das']
        };

        for (let [digit, words] of Object.entries(numberDict)) {
            words.forEach(word => {
                let regex = new RegExp('\\b' + word + '\\b', 'gi');
                processedText = processedText.replace(regex, digit);
            });
        }

        const mathDict = {
            // 🚀 NEW: 20 OP PHYSICS & CHEMISTRY CONSTANTS
            '299792458': ['speed of light', 'light speed', 'c value'],
            '6.626×10^(-34)': ['planck constant', 'planck', 'h value', 'plancks constant'],
            '6.022×10^(23)': ['avogadro number', 'avogadro', 'avogadros number', 'avogadro constant'],
            '6.674×10^(-11)': ['gravitational constant', 'gravity constant', 'capital g'],
            '1.602×10^(-19)': ['elementary charge', 'charge of electron', 'e value physics', 'electron charge'],
            '9.109×10^(-31)': ['electron mass', 'mass of electron', 'm e'],
            '1.672×10^(-27)': ['proton mass', 'mass of proton', 'm p'],
            '1.674×10^(-27)': ['neutron mass', 'mass of neutron', 'm n'],
            '96485': ['faraday constant', 'faraday', 'f value'],
            '8.314': ['gas constant', 'universal gas constant', 'r value', 'capital r'],
            '1.380×10^(-23)': ['boltzmann constant', 'boltzmann', 'k value'],
            '5.670×10^(-8)': ['stefan boltzmann constant', 'stefan constant', 'sigma value'],
            '1.097×10^(7)': ['rydberg constant', 'rydberg', 'r infinity'],
            '8.854×10^(-12)': ['vacuum permittivity', 'permittivity of free space', 'epsilon not'],
            '1.256×10^(-6)': ['vacuum permeability', 'permeability of free space', 'mu not'],
            '5.291×10^(-11)': ['bohr radius', 'bohr', 'a not'],
            '2.897×10^(-3)': ['wien displacement constant', 'wien constant', 'b value wien'],
            '1.660×10^(-27)': ['atomic mass unit', 'a m u', 'amu'],
            '9.80665': ['standard gravity', 'small g', 'acceleration due to gravity'],
            '101325': ['atmospheric pressure', 'one a t m', 'standard pressure', 'atm pressure'],

            // Normal Operators & Functions
            'asin(': ['sin inverse', 'inverse sine', 'arc sine', 'a sin'],
            'acos(': ['cos inverse', 'inverse cos', 'arc cos', 'a cos'],
            'atan(': ['tan inverse', 'inverse tan', 'arc tan', 'a tan'],
            'sin(': ['sine', 'sign', 'sin', 'seen'],
            'cos(': ['cos', 'cosine', 'cause'],
            'tan(': ['tan', 'tangent', 'ten'],
            'log(': ['log', 'logarithm', 'base ten log'],
            'ln(': ['natural log', 'l n', 'el en'],
            '10^(': ['ten to the power', 'ten power', 'ten raise to'],
            'e^(': ['e to the power', 'e power', 'exponential of'],
            '^2': ['square', 'squared', 'ka square'],
            '^3': ['cube', 'cubed', 'ka cube'],
            '^': ['raise to the power', 'to the power', 'power', 'raise to', 'ki power'],
            'sqrt(': ['square root', 'root', 'under root'],
            'rt(': ['y root', 'any root', 'nth root'],
            '!': ['factorial'],
            'nCr': ['combination', 'ncr', 'n c r'],
            'nPr': ['permutation', 'npr', 'n p r'],
            'abs(': ['absolute', 'magnitude', 'modulus of'], 
            'mod': ['modulo', 'remainder', 'mod'],
            'floor(': ['floor', 'round down', 'lowest integer'],
            'ceil(': ['ceil', 'ceiling', 'round up'],
            '(': ['open bracket', 'bracket open', 'start bracket'],
            ')': ['close bracket', 'bracket close', 'end bracket'],
            'AC': ['clear', 'all clear', 'reset', 'delete all'],
            'DEL': ['delete', 'backspace', 'remove', 'piche'],
            '%': ['percent', 'percentage'],
            'π': ['pi', 'pie', 'pai'],
            'e': ['eular', 'euler', 'constant e','exponential'],
            '.': ['point', 'dot', 'decimal'],
            '+': ['plus', 'add', 'and', 'jod', 'plus'],
            '−': ['minus', 'subtract', 'sub', 'ghata'],
            '×': ['multiply', 'into', 'times', 'x', 'guna', 'gunna', 'multiplied by'],
            '÷': ['divide', 'by', 'over', 'upon', 'bhag', 'bhaag', 'divided by'],
            '=': ['equal', 'equals', 'solve', 'result', 'answer', 'is', 'gives', 'batao']
        };

        for (let [symbol, words] of Object.entries(mathDict)) {
            words.forEach(word => {
                let regex = new RegExp('\\b' + word + '\\b', 'gi');
                processedText = processedText.replace(regex, ' ' + symbol + ' '); 
            });
        }

        processedText = processedText.replace(/\s+/g, '');

        let validationString = processedText
            .replace(/[0-9\+\-\×\÷\^\.\(\)\=\!\%]/g, '') 
            .replace(/asin|acos|atan|sin|cos|tan|log|ln|sqrt|rt|abs|mod|floor|ceil|nCr|nPr|π|e|AC|DEL/g, '');

        if (validationString.length > 0) {
            const resScreen = document.getElementById('sci-screen-result');
            resScreen.innerText = "Invalid Input";
            resScreen.style.color = "#ef4444"; 
            setTimeout(() => { resScreen.style.color = "#fff"; }, 1500); 
            stopVoiceCalc();
            return;
        }

        processedText = processedText.replace(/(asin\(|acos\(|atan\(|sin\(|cos\(|tan\(|log\(|ln\(|sqrt\(|abs\(|floor\(|ceil\()(\d+(\.\d+)?)([\+\-\×\÷\^\%])/g, '$1$2)$4');

        let i = 0;
        const funcsToType = [
            'asin(', 'acos(', 'atan(', 'sin(', 'cos(', 'tan(', 
            '10^(', 'e^(', 'log(', 'ln(', 'sqrt(', 'rt(', 
            'abs(', 'floor(', 'ceil(', 'nCr', 'nPr', 'mod', 'AC', 'DEL'
        ];

        while (i < processedText.length) {
            let matchedMultiChar = false;
            
            for (let f of funcsToType) {
                if (processedText.substring(i).startsWith(f)) {
                    if (f === 'AC') window.sciAC();
                    else if (f === 'DEL') window.sciDel();
                    else window.sciIn(f); 
                    
                    i += f.length; matchedMultiChar = true; break;
                }
            }

            if (!matchedMultiChar) {
                let char = processedText[i];
                if (char === '=') { window.sciSolve(); } 
                else if (char === '^') {
                    if (processedText[i+1] === '2') { window.sciIn('^2'); i+=2; continue; }
                    else if (processedText[i+1] === '3') { window.sciIn('^3'); i+=2; continue; }
                    else { window.sciIn('^'); }
                } else { window.sciIn(char); }
                i++;
            }
        }
        
        if (!processedText.includes('=')) {
            setTimeout(() => { window.sciSolve(); }, 300);
        }
    }
</script>
