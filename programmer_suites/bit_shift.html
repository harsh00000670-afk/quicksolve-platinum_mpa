<script>
    /* QUICKSOLVE PLATINUM - BIT SHIFTER & ROTATOR (MPA STANDALONE)
       Features: 64-bit JS engine bypass, Circular Shifts (ROL/ROR), Arithmetic vs Logical
    */
    const QS_Shift = {
        
        currentBits: 32,
        currentOp: 'LSH', // LSH, RSHA, RSHL, ROL, ROR
        
        // Caching for visualizer
        lastVal: 0n,
        lastDist: 0,
        lastRes: 0n,
        isValid: false,

        init: function() {
            console.log("Bit Shifter Engine Ready 🚀");
            this.resetUI();
        },

        setBits: function(bits) {
            this.currentBits = bits;
            
            // Update ARIA and Active States
            const opts = document.querySelectorAll('#sh-bit-selector .bit-opt');
            opts.forEach(opt => {
                opt.classList.remove('active');
                opt.setAttribute('aria-checked', 'false');
            });
            const activeOpt = document.querySelector(`#sh-bit-selector .bit-opt[data-bits="${bits}"]`);
            if(activeOpt) {
                activeOpt.classList.add('active');
                activeOpt.setAttribute('aria-checked', 'true');
            }
            
            this.calc();
            this.triggerHaptic();
        },

        setOp: function(op) {
            this.currentOp = op;
            
            // Update ARIA and Active States
            const btns = document.querySelectorAll('#mod-shift-overlay .op-btn');
            btns.forEach(btn => {
                btn.classList.remove('active');
                btn.setAttribute('aria-pressed', 'false');
            });
            const activeBtn = document.querySelector(`#mod-shift-overlay .op-btn[data-op="${op}"]`);
            if(activeBtn) {
                activeBtn.classList.add('active');
                activeBtn.setAttribute('aria-pressed', 'true');
            }

            this.calc();
            this.triggerHaptic();
        },

        parseInput: function(valStr) {
            let val = valStr.trim().toLowerCase();
            if(!val) return null;
            try {
                if (val.startsWith('0x')) return BigInt(val);
                if (val.startsWith('0b')) return BigInt(val);
                if (val.startsWith('0o')) return BigInt(val);
                if (!/^-?\d+$/.test(val)) return null;
                return BigInt(val);
            } catch(e) { return null; }
        },

        getMask: function() {
            if (this.currentBits === 64) return BigInt("18446744073709551615");
            return (1n << BigInt(this.currentBits)) - 1n;
        },

        calc: function() {
            const rawVal = document.getElementById('sh-inp-val').value;
            const rawDist = document.getElementById('sh-inp-dist').value;
            
            const grpVal = document.getElementById('grp-val');
            grpVal.classList.remove('error');
            this.isValid = false;

            if (!rawVal || !rawDist) {
                this.clearResults();
                return;
            }

            let val = this.parseInput(rawVal);
            let dist = parseInt(rawDist);

            if (val === null || isNaN(dist) || dist < 0) {
                grpVal.classList.add('error');
                this.clearResults();
                return;
            }

            const mask = this.getMask();
            val = val & mask; // Clean input to bit width
            
            // For shifts larger than bit width, languages usually modulo the distance
            let effectiveDist = BigInt(dist % this.currentBits);
            let result = 0n;

            // BIGINT CUSTOM SHIFT ENGINE (Bypasses JS 32-bit limit)
            const twoPowDist = 2n ** effectiveDist;
            const bitsBig = BigInt(this.currentBits);

            switch (this.currentOp) {
                case 'LSH': 
                    // Left Shift: val * (2^dist)
                    result = (val * twoPowDist) & mask;
                    break;
                case 'RSHL': 
                    // Logical Right Shift: Zero fill
                    result = val / twoPowDist;
                    break;
                case 'RSHA': 
                    // Arithmetic Right Shift: Preserve Sign Bit
                    const signBit = (val >> (bitsBig - 1n)) & 1n;
                    result = val / twoPowDist;
                    if (signBit === 1n && effectiveDist > 0n) {
                        // Create a mask of 1s for the shifted distance
                        const signFillMask = ((1n << effectiveDist) - 1n) << (bitsBig - effectiveDist);
                        result = result | signFillMask;
                    }
                    break;
                case 'ROL': 
                    // Rotate Left
                    const rolLeft = (val * twoPowDist) & mask;
                    const rolRight = val / (2n ** (bitsBig - effectiveDist));
                    result = (rolLeft | rolRight) & mask;
                    break;
                case 'ROR': 
                    // Rotate Right
                    const rorRight = val / twoPowDist;
                    const rorLeft = (val * (2n ** (bitsBig - effectiveDist))) & mask;
                    result = (rorRight | rorLeft) & mask;
                    break;
            }

            this.lastVal = val;
            this.lastDist = dist;
            this.lastRes = result;
            this.isValid = true;

            // Update UI
            document.getElementById('sh-res-dec').innerText = result.toString(10);
            document.getElementById('sh-res-hex').innerText = "0x" + result.toString(16).toUpperCase();
            
            let binStr = result.toString(2).padStart(this.currentBits, '0');
            let formattedBin = binStr.match(/.{1,4}/g).join(' '); // Group by 4 for hex readability
            document.getElementById('sh-res-bin').innerText = formattedBin;
        },

        triggerHaptic: function() {
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(5);
            }
        },

        // --- PLATINUM FEATURE: BIT MOVEMENT VISUALIZER ---
        showSteps: function() {
            const contentBox = document.getElementById('sh-steps-content');
            
            if (!this.isValid) {
                contentBox.innerHTML = `<div style="text-align:center; padding:20px; color:#ef4444;"><i class="fas fa-exclamation-triangle fa-2x" aria-hidden="true"></i><br><br>Enter valid inputs and distance to visualize!</div>`;
            } else {
                contentBox.innerHTML = this.generateShiftMatrix();
            }

            const modal = document.getElementById('sh-steps-modal');
            const box = document.getElementById('sh-steps-box');
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.style.opacity = '1';
                box.style.transform = 'translateY(0)';
            }, 10);
            
            this.triggerHaptic();
        },

        hideSteps: function() {
            const modal = document.getElementById('sh-steps-modal');
            const box = document.getElementById('sh-steps-box');
            modal.style.opacity = '0';
            box.style.transform = 'translateY(20px)';
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
            this.triggerHaptic();
        },

        generateShiftMatrix: function() {
            const effDist = this.lastDist % this.currentBits;
            if (effDist === 0) {
                return `<div style="text-align:center; padding:20px; color:#a855f7;">Shift distance is 0 (or multiple of bit width). No movement occurs.</div>`;
            }

            const strA = this.lastVal.toString(2).padStart(this.currentBits, '0');
            const strRes = this.lastRes.toString(2).padStart(this.currentBits, '0');

            let explain = "";
            let html = `<div class="shift-board">`;

            // Visual Logic Builder
            html += `<div class="shift-row"><span class="sh-label">Original ${this.currentBits}-bit Value:</span>${this.fmtBin(strA)}</div>`;

            if (this.currentOp === 'LSH') {
                explain = `Bits are shifted LEFT by ${effDist}. Right side is filled with <span class="new-bits">Zeros</span>. Leftmost bits are <span class="drop-bits">dropped</span>.`;
                const dropped = strA.substring(0, effDist);
                const kept = strA.substring(effDist);
                html += `<div class="shift-row"><span class="sh-label">Movement:</span><span class="drop-bits">${dropped}</span> <i class="fas fa-arrow-left" style="color:#f59e0b; margin:0 10px;" aria-hidden="true"></i> ${this.fmtBin(kept)} <span class="new-bits">${'0'.repeat(effDist)}</span></div>`;
            } 
            else if (this.currentOp === 'RSHL') {
                explain = `LOGICAL RIGHT SHIFT: Bits shifted RIGHT by ${effDist}. Left side is ALWAYS filled with <span class="new-bits">Zeros</span>.`;
                const kept = strA.substring(0, this.currentBits - effDist);
                const dropped = strA.substring(this.currentBits - effDist);
                html += `<div class="shift-row"><span class="sh-label">Movement:</span><span class="new-bits">${'0'.repeat(effDist)}</span> ${this.fmtBin(kept)} <i class="fas fa-arrow-right" style="color:#f59e0b; margin:0 10px;" aria-hidden="true"></i> <span class="drop-bits">${dropped}</span></div>`;
            }
            else if (this.currentOp === 'RSHA') {
                const signBit = strA[0];
                explain = `ARITHMETIC RIGHT SHIFT: Bits shifted RIGHT by ${effDist}. Left side is filled with the <span class="new-bits">Sign Bit (${signBit})</span> to preserve negative/positive state.`;
                const kept = strA.substring(0, this.currentBits - effDist);
                const dropped = strA.substring(this.currentBits - effDist);
                html += `<div class="shift-row"><span class="sh-label">Movement:</span><span class="new-bits">${signBit.repeat(effDist)}</span> ${this.fmtBin(kept)} <i class="fas fa-arrow-right" style="color:#f59e0b; margin:0 10px;" aria-hidden="true"></i> <span class="drop-bits">${dropped}</span></div>`;
            }
            else if (this.currentOp === 'ROL') {
                explain = `ROTATE LEFT (Circular): Bits shifted LEFT by ${effDist}. The bits that fall off the left are <span class="wrap-bits">wrapped around</span> to the right!`;
                const wrapped = strA.substring(0, effDist);
                const kept = strA.substring(effDist);
                html += `<div class="shift-row"><span class="sh-label">Movement:</span><i class="fas fa-undo" style="color:#a855f7; margin-right:10px;" aria-hidden="true"></i> ${this.fmtBin(kept)} <span class="wrap-bits">${wrapped}</span></div>`;
            }
            else if (this.currentOp === 'ROR') {
                explain = `ROTATE RIGHT (Circular): Bits shifted RIGHT by ${effDist}. The bits that fall off the right are <span class="wrap-bits">wrapped around</span> to the left!`;
                const kept = strA.substring(0, this.currentBits - effDist);
                const wrapped = strA.substring(this.currentBits - effDist);
                html += `<div class="shift-row"><span class="sh-label">Movement:</span><span class="wrap-bits">${wrapped}</span> ${this.fmtBin(kept)} <i class="fas fa-redo" style="color:#a855f7; margin-left:10px;" aria-hidden="true"></i></div>`;
            }

            html += `<hr style="border:0; border-bottom:1px solid #334155; margin:15px 0;">`;
            html += `<div class="shift-row"><span class="sh-label">Final Result:</span>${this.fmtBin(strRes)}</div>`;
            html += `</div>`;

            html += `<div style="margin-top:15px; font-size:0.8rem; color:var(--text-muted); padding:10px; background:rgba(2,6,23,0.5); border-radius:8px; border-left:3px solid #f59e0b;">${explain}</div>`;

            return html;
        },

        fmtBin: function(binStr) {
            // Group by 4 just for the visualizer output string
            let res = "";
            for(let i=0; i<binStr.length; i++) {
                if(i > 0 && i % 4 === 0) res += " ";
                res += binStr[i];
            }
            return res;
        },

        clearResults: function() {
            document.getElementById('sh-res-dec').innerText = "0";
            document.getElementById('sh-res-hex').innerText = "0x0";
            document.getElementById('sh-res-bin').innerText = "00000000 00000000";
            this.isValid = false;
        },

        resetUI: function() {
            document.getElementById('sh-inp-val').value = '';
            document.getElementById('sh-inp-dist').value = '';
            this.setBits(32);
            this.setOp('LSH');
            this.clearResults();
        }
    };

    // Auto-Init on Load
    window.onload = function() {
        QS_Shift.init();
    };
</script>
</body>
</html>
