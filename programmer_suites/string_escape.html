<script>
    /* QUICKSOLVE PLATINUM - STRING ESCAPE SUITE (MPA STANDALONE)
       Features: Multi-Context Live Escaping (HTML, JS, SQL, Regex, URL), Bidirectional Unescape, Security Map.
    */
    const QS_Escape = {
        
        currentMode: 'escape', // 'escape' or 'unescape'

        init: function() {
            console.log("String Escape Engine Ready 🚀");
            this.resetUI();
        },

        setMode: function(mode) {
            this.currentMode = mode;
            const btnEsc = document.getElementById('mode-esc');
            const btnUnesc = document.getElementById('mode-unesc');
            
            btnEsc.classList.remove('active');
            btnEsc.setAttribute('aria-selected', 'false');
            btnUnesc.classList.remove('active');
            btnUnesc.setAttribute('aria-selected', 'false');
            
            const activeBtn = document.getElementById(mode === 'escape' ? 'mode-esc' : 'mode-unesc');
            activeBtn.classList.add('active');
            activeBtn.setAttribute('aria-selected', 'true');
            
            document.getElementById('main-lbl').innerText = mode === 'escape' ? 'Raw String Input' : 'Escaped String Input';
            
            this.process();
            this.triggerHaptic();
        },

        clearInput: function() {
            document.getElementById('inp-str').value = '';
            this.process();
            this.triggerHaptic();
        },

        process: function() {
            const raw = document.getElementById('inp-str').value;
            
            if (!raw) {
                this.clearOutputs();
                return;
            }

            if (this.currentMode === 'escape') {
                this.doEscape(raw);
            } else {
                this.doUnescape(raw);
            }
            this.autoResize();
        },

        // --- PLATINUM FEATURE: God-Mode Escape Engine ---
        doEscape: function(str) {
            // 1. HTML / XML (Prevent XSS)
            const mapHTML = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
            const htmlEsc = str.replace(/[&<>"']/g, function(m) { return mapHTML[m]; });
            
            // 2. JS / JSON (Prevent String Breakout)
            const mapJS = { '\\': '\\\\', '\n': '\\n', '\r': '\\r', '\t': '\\t', '"': '\\"', "'": "\\'" };
            const jsEsc = str.replace(/[\\'"\n\r\t]/g, function(m) { return mapJS[m]; });

            // 3. SQL (Prevent SQL Injection)
            const sqlEsc = str.replace(/'/g, "''");

            // 4. Regex (Prevent pattern breaking)
            const regexEsc = str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

            // 5. URL Component
            const urlEsc = encodeURIComponent(str);

            this.setOutputs(htmlEsc, jsEsc, sqlEsc, regexEsc, urlEsc);
        },

        // --- PLATINUM FEATURE: Reverse Engineering (Unescape) ---
        doUnescape: function(str) {
            // 1. HTML / XML
            const mapHtmlUn = { '&amp;': '&', '&lt;': '<', '&gt;': '>', '&quot;': '"', '&#39;': "'" };
            const htmlUn = str.replace(/&amp;|&lt;|&gt;|&quot;|&#39;/g, function(m) { return mapHtmlUn[m]; });

            // 2. JS / JSON
            let jsUn = str;
            try { 
                jsUn = JSON.parse(`"${str.replace(/"/g, '\\"')}"`); 
            } catch(e) { 
                jsUn = str.replace(/\\n/g, '\n').replace(/\\r/g, '\r').replace(/\\t/g, '\t').replace(/\\'/g, "'").replace(/\\"/g, '"').replace(/\\\\/g, '\\');
            }

            // 3. SQL
            const sqlUn = str.replace(/''/g, "'");

            // 4. Regex
            const regexUn = str.replace(/\\([.*+?^${}()|[\]\\])/g, '$1');

            // 5. URL
            let urlUn = str;
            try { urlUn = decodeURIComponent(str); } catch(e) { urlUn = "Invalid URI encoding"; }

            this.setOutputs(htmlUn, jsUn, sqlUn, regexUn, urlUn);
        },

        setOutputs: function(h, j, s, r, u) {
            document.getElementById('res-html').value = h;
            document.getElementById('res-js').value = j;
            document.getElementById('res-sql').value = s;
            document.getElementById('res-regex').value = r;
            document.getElementById('res-url').value = u;
        },

        clearOutputs: function() {
            document.getElementById('res-html').value = '';
            document.getElementById('res-js').value = '';
            document.getElementById('res-sql').value = '';
            document.getElementById('res-regex').value = '';
            document.getElementById('res-url').value = '';
        },

        autoResize: function() {
            const ids = ['res-html', 'res-js', 'res-sql', 'res-regex', 'res-url'];
            ids.forEach(id => {
                const el = document.getElementById(id);
                el.style.height = 'auto';
                el.style.height = (el.scrollHeight) + 'px';
            });
        },

        // FIX: Modern Clipboard API implementation
        copy: async function(id) {
            const el = document.getElementById(id);
            if (!el.value) return;
            const textToCopy = el.value;
            
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(textToCopy);
                } else {
                    throw new Error("Fallback required");
                }
            } catch(e) {
                el.select();
                document.execCommand('copy');
            }
            this.triggerHaptic();
        },

        triggerHaptic: function() {
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(5);
            }
        },

        // --- THE "WHY" VISUALIZER: Security Matrix ---
        showSteps: function() {
            const contentBox = document.getElementById('es-steps-content');
            
            let html = `
                <div style="margin-bottom:15px; border-left:3px solid #f59e0b; padding-left:10px;">
                    <span style="color:#f59e0b; font-weight:bold;">Why Do We Escape?</span><br>
                    Hackers inject malicious code to break your system. Escaping turns dangerous code into harmless text!
                </div>
                
                <table class="sec-table" role="table" aria-label="Security Injection Defense Matrix">
                    <thead>
                        <tr>
                            <th scope="col">Bad Char</th>
                            <th scope="col">Escaped</th>
                            <th scope="col">Vulnerability Prevented</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="st-char">&lt; &gt;</td>
                            <td class="st-esc">&amp;lt; &amp;gt;</td>
                            <td class="st-rsn"><span style="color:#ef4444; font-weight:bold;">XSS (Cross-Site Scripting)</span>. Stops browsers from running injected JavaScript tags.</td>
                        </tr>
                        <tr>
                            <td class="st-char">' "</td>
                            <td class="st-esc">\\' \\"</td>
                            <td class="st-rsn"><span style="color:#38bdf8; font-weight:bold;">String Breakout</span>. Prevents hackers from ending your JS strings early.</td>
                        </tr>
                        <tr>
                            <td class="st-char">'</td>
                            <td class="st-esc">''</td>
                            <td class="st-rsn"><span style="color:#a855f7; font-weight:bold;">SQL Injection (SQLi)</span>. Database engines treat it as text, not as a query end.</td>
                        </tr>
                        <tr>
                            <td class="st-char">Space</td>
                            <td class="st-esc">%20</td>
                            <td class="st-rsn"><span style="color:#22c55e; font-weight:bold;">URL Parsing Errors</span>. URLs cannot contain spaces, so they are Hex encoded.</td>
                        </tr>
                    </tbody>
                </table>
                <div style="margin-top:15px; font-size:0.75rem; color:var(--text-muted); text-align:center;">
                    *Never trust user input. Always escape data before rendering!
                </div>
            `;
            
            contentBox.innerHTML = html;

            const modal = document.getElementById('es-steps-modal');
            const box = document.getElementById('es-steps-box');
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.style.opacity = '1';
                box.style.transform = 'translateY(0)';
            }, 10);
            this.triggerHaptic();
        },

        hideSteps: function() {
            const modal = document.getElementById('es-steps-modal');
            const box = document.getElementById('es-steps-box');
            modal.style.opacity = '0';
            box.style.transform = 'translateY(20px)';
            setTimeout(() => { modal.style.display = 'none'; }, 300);
            this.triggerHaptic();
        },

        resetUI: function() {
            this.clearInput();
            this.setMode('escape');
        }
    };

    // Auto-Init on Load
    window.onload = function() {
        QS_Escape.init();
    };
</script>
</body>
</html>
