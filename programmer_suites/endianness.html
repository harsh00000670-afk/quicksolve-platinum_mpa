<script>
    /* QUICKSOLVE PLATINUM - ENDIANNESS SWAPPER (MPA STANDALONE)
       Features: Multi-Type Input (Int/Hex, Float, ASCII Text), Live RAM Visualizer, Multi-interpretation Output.
    */
    const QS_Endian = {
        
        currentBits: 16,
        currentType: 'int', // int, float, text
        isValid: false,
        
        origBytes: [],
        swappedBytes: [],

        init: function() {
            console.log("Endianness Swapper Engine Ready 🚀");
            this.resetUI();
        },

        setBits: function(bits) {
            this.currentBits = bits;
            
            // Update ARIA and Active States
            const opts = document.querySelectorAll('#en-bit-selector .sel-opt');
            opts.forEach(opt => {
                opt.classList.remove('active-bit');
                opt.setAttribute('aria-checked', 'false');
            });
            const activeOpt = document.querySelector(`#en-bit-selector .sel-opt[data-bits="${bits}"]`);
            if(activeOpt) {
                activeOpt.classList.add('active-bit');
                activeOpt.setAttribute('aria-checked', 'true');
            }
            
            // Re-validate based on limits
            this.calc();
            this.triggerHaptic();
        },

        setType: function(type) {
            this.currentType = type;
            
            // Update ARIA and Active States
            const opts = document.querySelectorAll('#en-type-selector .sel-opt');
            opts.forEach(opt => {
                opt.classList.remove('active-type');
                opt.setAttribute('aria-checked', 'false');
            });
            const activeOpt = document.querySelector(`#en-type-selector .sel-opt[data-type="${type}"]`);
            if(activeOpt) {
                activeOpt.classList.add('active-type');
                activeOpt.setAttribute('aria-checked', 'true');
            }
            
            // Update UI Hints
            const tip = document.getElementById('en-tip-text');
            const inp = document.getElementById('en-inp-val');
            
            if (type === 'int') {
                tip.innerText = "Accepts Dec or 0x Hex";
                inp.placeholder = "e.g. 0xAABBCCDD or 255";
            } else if (type === 'float') {
                tip.innerText = "Accepts Decimals";
                inp.placeholder = "e.g. 3.14159";
                // Float requires at least 32-bit (Single precision)
                if (this.currentBits === 16) this.setBits(32); 
            } else if (type === 'text') {
                tip.innerText = `Max ${this.currentBits / 8} chars`;
                inp.placeholder = "e.g. ABCD";
            }

            document.getElementById('en-inp-val').value = '';
            this.clearResults();
            this.triggerHaptic();
        },

        // Parses input and ALWAYS returns a properly padded Hex String based on currentBits
        getBytesFromInput: function(rawVal) {
            const byteCount = this.currentBits / 8;

            if (this.currentType === 'int') {
                let val = rawVal.trim().toLowerCase();
                let bigNum;
                if (val.startsWith('0x') || val.startsWith('0b')) {
                    bigNum = BigInt(val);
                } else if (/^-?\d+$/.test(val)) {
                    bigNum = BigInt(val);
                } else {
                    return null;
                }
                // Bounds check
                if (bigNum < 0n || bigNum > ((1n << BigInt(this.currentBits)) - 1n)) return null;
                return bigNum.toString(16).toUpperCase().padStart(byteCount * 2, '0');
            } 
            else if (this.currentType === 'float') {
                let val = parseFloat(rawVal);
                if (isNaN(val)) return null;
                
                if (this.currentBits === 32) {
                    const buf = new ArrayBuffer(4);
                    new DataView(buf).setFloat32(0, val, false);
                    return new DataView(buf).getUint32(0, false).toString(16).toUpperCase().padStart(8, '0');
                } else if (this.currentBits === 64) {
                    const buf = new ArrayBuffer(8);
                    new DataView(buf).setFloat64(0, val, false);
                    const high = new DataView(buf).getUint32(0, false).toString(16).toUpperCase().padStart(8, '0');
                    const low = new DataView(buf).getUint32(4, false).toString(16).toUpperCase().padStart(8, '0');
                    return high + low;
                } else {
                    return null; // 16-bit float not standard in JS, skip
                }
            }
            else if (this.currentType === 'text') {
                // String to Hex
                if (rawVal.length > byteCount) return null; // Overflow
                // Pad string with null chars (0x00) if it's shorter than required bytes
                let paddedStr = rawVal.padEnd(byteCount, '\0'); 
                let hexStr = "";
                for(let i=0; i<paddedStr.length; i++) {
                    hexStr += paddedStr.charCodeAt(i).toString(16).toUpperCase().padStart(2, '0');
                }
                return hexStr;
            }
            return null;
        },

        calc: function() {
            const rawVal = document.getElementById('en-inp-val').value;
            const grpVal = document.getElementById('grp-val');
            const errLbl = document.getElementById('en-err');
            
            grpVal.classList.remove('error');
            errLbl.style.display = 'none';
            this.isValid = false;

            if (!rawVal) {
                this.clearResults();
                return;
            }

            // 1. Get standardized Hex string
            let hexStr = this.getBytesFromInput(rawVal);
            
            if (hexStr === null) {
                this.showError(grpVal, errLbl);
                return;
            }

            this.isValid = true;

            // 2. Split into bytes
            this.origBytes = hexStr.match(/.{1,2}/g);
            
            // 3. Swap Endianness
            this.swappedBytes = [...this.origBytes].reverse();
            let swappedHexStr = this.swappedBytes.join('');

            // 4. INTERPRET THE SWAPPED DATA (The God Mode feature)
            
            // As Integer
            let swappedInt = BigInt("0x" + swappedHexStr).toString(10);
            
            // As Float
            let swappedFloat = "N/A (Needs 32/64b)";
            if (this.currentBits === 32) {
                const buf = new ArrayBuffer(4);
                new DataView(buf).setUint32(0, parseInt(swappedHexStr, 16), false);
                swappedFloat = new DataView(buf).getFloat32(0, false).toPrecision(7);
            } else if (this.currentBits === 64) {
                const buf = new ArrayBuffer(8);
                // BigInt needed for 64-bit hex parsing
                const bigH = BigInt("0x" + swappedHexStr);
                const high = Number(bigH >> 32n);
                const low = Number(bigH & 0xFFFFFFFFn);
                new DataView(buf).setUint32(0, high, false);
                new DataView(buf).setUint32(4, low, false);
                swappedFloat = new DataView(buf).getFloat64(0, false).toPrecision(15);
            }

            // As Text (ASCII)
            let swappedText = "";
            for(let i=0; i<this.swappedBytes.length; i++) {
                let charCode = parseInt(this.swappedBytes[i], 16);
                // Only show printable ASCII characters, else show a dot (.)
                if (charCode >= 32 && charCode <= 126) {
                    swappedText += String.fromCharCode(charCode);
                } else {
                    swappedText += "."; 
                }
            }

            // 5. Update UI
            document.getElementById('res-hex').innerText = "0x" + swappedHexStr;
            document.getElementById('res-int').innerText = swappedInt;
            document.getElementById('res-float').innerText = swappedFloat;
            document.getElementById('res-text').innerText = swappedText;

            this.renderByteBlocks();
        },

        showError: function(grp, err) {
            grp.classList.add('error');
            err.style.display = 'block';
            this.clearResults();
        },

        renderByteBlocks: function() {
            const arena = document.getElementById('byte-arena');
            const rowOrig = document.getElementById('row-orig');
            const rowSwap = document.getElementById('row-swap');
            
            arena.style.display = 'flex';
            rowOrig.innerHTML = '';
            rowSwap.innerHTML = '';

            // Map characters for text mode display hint
            const textCharsOrig = [];
            const textCharsSwap = [];
            if (this.currentType === 'text') {
                const rawVal = document.getElementById('en-inp-val').value;
                const paddedStr = rawVal.padEnd(this.currentBits / 8, '\0');
                for(let i=0; i<paddedStr.length; i++) textCharsOrig.push(paddedStr[i]);
                for(let i=paddedStr.length-1; i>=0; i--) textCharsSwap.push(paddedStr[i]);
            }

            this.origBytes.forEach((byte, idx) => {
                let extra = this.currentType === 'text' ? ` <span style="color:#f59e0b; font-size:0.6rem;" aria-hidden="true">('${textCharsOrig[idx]}')</span>` : "";
                rowOrig.innerHTML += `<div class="byte-box"><span class="byte-idx">B${idx}</span>${byte}${extra}</div>`;
            });

            this.swappedBytes.forEach((byte, idx) => {
                let extra = this.currentType === 'text' ? ` <span style="color:#f59e0b; font-size:0.6rem;" aria-hidden="true">('${textCharsSwap[idx]}')</span>` : "";
                rowSwap.innerHTML += `<div class="byte-box swapped"><span class="byte-idx">B${this.origBytes.length - 1 - idx}</span>${byte}${extra}</div>`;
            });
        },

        triggerHaptic: function() {
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(5);
            }
        },

        showSteps: function() {
            const contentBox = document.getElementById('en-steps-content');
            if (!this.isValid) {
                contentBox.innerHTML = `<div style="text-align:center; padding:20px; color:#ef4444;"><i class="fas fa-exclamation-triangle fa-2x" aria-hidden="true"></i><br><br>Enter valid data to view RAM layout!</div>`;
            } else {
                contentBox.innerHTML = this.generateRAMTable();
            }

            const modal = document.getElementById('en-steps-modal');
            const box = document.getElementById('en-steps-box');
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.style.opacity = '1';
                box.style.transform = 'translateY(0)';
            }, 10);
            this.triggerHaptic();
        },

        hideSteps: function() {
            const modal = document.getElementById('en-steps-modal');
            const box = document.getElementById('en-steps-box');
            modal.style.opacity = '0';
            box.style.transform = 'translateY(20px)';
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
            this.triggerHaptic();
        },

        generateRAMTable: function() {
            let html = `
                <div style="margin-bottom:15px; border-left:3px solid #8b5cf6; padding-left:10px;">
                    <span style="color:#a78bfa; font-weight:bold;">Endianness Architecture:</span><br>
                    How your data is stored across sequential memory addresses in RAM.
                </div>
                
                <div class="mem-grid" role="table" aria-label="Memory Address Table">
                    <div class="mem-cell mem-head" role="columnheader">Address</div>
                    <div class="mem-cell mem-head" role="columnheader">Big-Endian</div>
                    <div class="mem-cell mem-head" role="columnheader">Little-Endian</div>
            `;

            for (let i = 0; i < this.origBytes.length; i++) {
                let hexAddr = "0x" + (0x1000 + i).toString(16).toUpperCase(); 
                html += `
                    <div class="mem-cell mem-addr" role="cell">${hexAddr}</div>
                    <div class="mem-cell mem-val-big" role="cell">${this.origBytes[i]}</div>
                    <div class="mem-cell mem-val-lit" role="cell">${this.swappedBytes[i]}</div>
                `;
            }

            html += `</div>
                <div style="margin-top:15px; font-size:0.75rem; color:var(--text-muted); text-align:center;">
                    *Intel CPUs use Little-Endian. Internet Protocols use Big-Endian!
                </div>
            `;
            return html;
        },

        clearResults: function() {
            document.getElementById('byte-arena').style.display = 'none';
            document.getElementById('res-hex').innerText = "0x00";
            document.getElementById('res-int').innerText = "0";
            document.getElementById('res-float').innerText = "0.0";
            document.getElementById('res-text').innerText = "--";
            this.isValid = false;
        },

        resetUI: function() {
            document.getElementById('en-inp-val').value = '';
            document.getElementById('grp-val').classList.remove('error');
            document.getElementById('en-err').style.display = 'none';
            this.setBits(32);
            this.setType('text'); // start with text because it's the coolest feature
            this.clearResults();
        }
    };

    // Auto-Init on Load
    window.onload = function() {
        QS_Endian.init();
    };
</script>
</body>
</html>
