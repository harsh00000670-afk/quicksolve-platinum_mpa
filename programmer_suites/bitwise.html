<body>

<h1 class="bw-tit" style="position: absolute; left: 50%; transform: translateX(-50%); margin: 0; color: #38bdf8; font-family: 'JetBrains Mono', monospace; font-weight: 900; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);">

    <div class="bw-body">

<script>
    /* QUICKSOLVE PLATINUM - BITWISE LOGIC LAB (MPA STANDALONE)
       Features: Auto-detect base, BigInt bitwise math, Unsigned Masking, Visual Truth Table
    */
    const QS_Bitwise = {
        
        currentBits: 16,
        currentOp: 'AND',
        
        // Caching for visualizer
        lastA: 0n,
        lastB: 0n,
        lastRes: 0n,
        isValid: false,

        init: function() {
            console.log("Bitwise Lab Engine Ready 🚀");
            this.resetUI();
        },

        setBits: function(bits) {
            this.currentBits = bits;
            
            // Update ARIA and Active States
            const opts = document.querySelectorAll('#bw-bit-selector .bit-opt');
            opts.forEach(opt => {
                opt.classList.remove('active');
                opt.setAttribute('aria-checked', 'false');
            });
            const activeOpt = document.querySelector(`#bw-bit-selector .bit-opt[data-bits="${bits}"]`);
            if(activeOpt) {
                activeOpt.classList.add('active');
                activeOpt.setAttribute('aria-checked', 'true');
            }
            
            this.calc();
            if(window.doHaptic) window.doHaptic();
        },

        setOp: function(op) {
            this.currentOp = op;
            
            // Update ARIA and Active States
            const btns = document.querySelectorAll('.op-btn');
            btns.forEach(btn => {
                btn.classList.remove('active');
                btn.setAttribute('aria-pressed', 'false');
            });
            const activeBtn = document.querySelector(`.op-btn[data-op="${op}"]`);
            if(activeBtn) {
                activeBtn.classList.add('active');
                activeBtn.setAttribute('aria-pressed', 'true');
            }

            // Hide Input B if NOT operator is selected (unary operator)
            const grpB = document.getElementById('grp-b');
            if(op === 'NOT') {
                grpB.style.display = 'none';
                document.getElementById('inp-b').value = ''; // clear it
            } else {
                grpB.style.display = 'block';
            }

            this.calc();
            if(window.doHaptic) window.doHaptic();
        },

        // Auto parse Decimal, 0x Hex, or 0b Binary
        parseInput: function(valStr) {
            let val = valStr.trim().toLowerCase();
            if(!val) return null;
            
            try {
                if (val.startsWith('0x')) return BigInt(val);
                if (val.startsWith('0b')) return BigInt(val);
                if (val.startsWith('0o')) return BigInt(val);
                // Assume decimal if no prefix
                if (!/^-?\d+$/.test(val)) return null;
                return BigInt(val);
            } catch(e) {
                return null;
            }
        },

        // Creates a mask to simulate fixed-width registers (e.g. 8-bit, 16-bit)
        // Without this, JavaScript handles negatives infinitely
        getMask: function() {
            if (this.currentBits === 64) {
                // Special handling for 64 bit to avoid shift overflow standard limits
                return BigInt("18446744073709551615"); // 0xFFFFFFFFFFFFFFFF
            }
            return (1n << BigInt(this.currentBits)) - 1n;
        },

        calc: function() {
            const rawA = document.getElementById('inp-a').value;
            const rawB = document.getElementById('inp-b').value;
            
            const grpA = document.getElementById('grp-a');
            const grpB = document.getElementById('grp-b');
            
            grpA.classList.remove('error');
            grpB.classList.remove('error');
            this.isValid = false;

            // If empty
            if (!rawA) {
                this.clearResults();
                return;
            }

            let valA = this.parseInput(rawA);
            let valB = 0n;

            if (valA === null) {
                grpA.classList.add('error');
                this.clearResults();
                return;
            }

            if (this.currentOp !== 'NOT') {
                if (!rawB) {
                    this.clearResults();
                    return;
                }
                valB = this.parseInput(rawB);
                if (valB === null) {
                    grpB.classList.add('error');
                    this.clearResults();
                    return;
                }
            }

            // Apply Mask to inputs to enforce bit limits
            const mask = this.getMask();
            valA = valA & mask;
            valB = valB & mask;

            let result = 0n;

            // BigInt Logic Gates
            switch (this.currentOp) {
                case 'AND': result = valA & valB; break;
                case 'OR':  result = valA | valB; break;
                case 'XOR': result = valA ^ valB; break;
                case 'NOT': result = (~valA) & mask; break; // Mask ensures we don't get infinite 1s
                case 'NAND': result = ~(valA & valB) & mask; break;
                case 'NOR':  result = ~(valA | valB) & mask; break;
                case 'XNOR': result = ~(valA ^ valB) & mask; break;
            }

            // Final safety mask
            result = result & mask;

            // Save for visualizer
            this.lastA = valA;
            this.lastB = valB;
            this.lastRes = result;
            this.isValid = true;

            // Update UI
            document.getElementById('res-dec').innerText = result.toString(10);
            document.getElementById('res-hex').innerText = "0x" + result.toString(16).toUpperCase();
            
            // Format binary with padding and spaces
            let binStr = result.toString(2).padStart(this.currentBits, '0');
            // Add space every 8 bits for readability
            let formattedBin = binStr.match(/.{1,8}/g).join(' ');
            document.getElementById('res-bin').innerText = formattedBin;
        },

        // --- PLATINUM VISUALIZER (THE WHY BUTTON) ---
        showSteps: function() {
            const contentBox = document.getElementById('bw-steps-content');
            
            if (!this.isValid) {
                contentBox.innerHTML = `<div style="text-align:center; padding:20px; color:#ef4444;"><i class="fas fa-exclamation-triangle fa-2x" aria-hidden="true"></i><br><br>Enter valid inputs to see the matrix!</div>`;
            } else {
                contentBox.innerHTML = this.generateVisualMatrix();
            }

            const modal = document.getElementById('bw-steps-modal');
            const box = document.getElementById('bw-steps-box');
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.style.opacity = '1';
                box.style.transform = 'translateY(0)';
            }, 10);
            
            if(window.doHaptic) window.doHaptic();
        },

        hideSteps: function() {
            const modal = document.getElementById('bw-steps-modal');
            const box = document.getElementById('bw-steps-box');
            modal.style.opacity = '0';
            box.style.transform = 'translateY(20px)';
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
            if(window.doHaptic) window.doHaptic();
        },

        generateVisualMatrix: function() {
            // Get padded binary strings
            const strA = this.lastA.toString(2).padStart(this.currentBits, '0');
            const strB = this.lastB.toString(2).padStart(this.currentBits, '0');
            const strRes = this.lastRes.toString(2).padStart(this.currentBits, '0');

            // Find symbol for operator
            let opSymbol = '';
            switch(this.currentOp) {
                case 'AND': opSymbol = '&'; break;
                case 'OR': opSymbol = '|'; break;
                case 'XOR': opSymbol = '^'; break;
                case 'NOT': opSymbol = '~'; break;
                case 'NAND': opSymbol = '⊼'; break;
                case 'NOR': opSymbol = '⊽'; break;
                case 'XNOR': opSymbol = '⊙'; break;
            }

            let html = `
                <div style="margin-bottom:15px; border-left:3px solid #a855f7; padding-left:10px;">
                    <span style="color:#a855f7; font-weight:bold;">${this.currentBits}-bit ${this.currentOp} Operation:</span><br>
                    Each bit column is evaluated independently based on Truth Tables.
                </div>
                
                <div class="logic-board">
            `;

            // If it's NOT (Unary)
            if (this.currentOp === 'NOT') {
                html += `
                    <div class="logic-row">
                        <span class="logic-op">~</span>
                        <span class="logic-bits">${this.formatBinMatrix(strA)}</span>
                    </div>
                    <div class="logic-line"></div>
                    <div class="logic-row">
                        <span class="logic-op">=</span>
                        <span class="logic-res-bits">${this.formatBinMatrix(strRes)}</span>
                    </div>
                </div>
                <div style="margin-top:15px; font-size:0.75rem; color:var(--text-muted); text-align:center;">
                    *NOT flips every bit. 0 becomes 1, and 1 becomes 0.
                </div>`;
                return html;
            }

            // Normal Binary Operations
            html += `
                <div class="logic-row">
                    <span class="logic-op"> </span>
                    <span class="logic-bits">${this.formatBinMatrix(strA)}</span>
                </div>
                <div class="logic-row">
                    <span class="logic-op">${opSymbol}</span>
                    <span class="logic-bits">${this.formatBinMatrix(strB)}</span>
                </div>
                <div class="logic-line"></div>
                <div class="logic-row">
                    <span class="logic-op">=</span>
                    <span class="logic-res-bits">${this.formatBinMatrix(strRes)}</span>
                </div>
            </div>`;

            // Add simple truth table logic text
            let explain = "";
            if(this.currentOp === 'AND') explain = "Both top and bottom bits must be 1 to output 1.";
            if(this.currentOp === 'OR') explain = "Outputs 1 if AT LEAST ONE of the bits is 1.";
            if(this.currentOp === 'XOR') explain = "Outputs 1 only if the bits are DIFFERENT.";
            if(this.currentOp === 'NAND') explain = "Inverse of AND. Outputs 0 ONLY if both bits are 1.";
            if(this.currentOp === 'NOR') explain = "Inverse of OR. Outputs 1 ONLY if both bits are 0.";
            if(this.currentOp === 'XNOR') explain = "Outputs 1 only if both bits are EXACTLY THE SAME.";

            html += `
                <div style="margin-top:15px; font-size:0.75rem; color:var(--text-muted); text-align:center;">
                    *${explain}
                </div>`;

            return html;
        },

        // Helper to add spaces for visualizer matrix alignment
        formatBinMatrix: function(binStr) {
            return binStr.match(/.{1,4}/g).join(' '); // split by 4 for matrix
        },

        clearResults: function() {
            document.getElementById('res-dec').innerText = "0";
            document.getElementById('res-hex').innerText = "0x0";
            document.getElementById('res-bin').innerText = "00000000 00000000";
            this.isValid = false;
        },

        resetUI: function() {
            document.getElementById('inp-a').value = '';
            document.getElementById('inp-b').value = '';
            this.setBits(16);
            this.setOp('AND');
            this.clearResults();
        }
    };

    // Auto-Start
    window.onload = function() {
        QS_Bitwise.init();
    };
</script>
