        /* MANTRA: NO PADDING/MARGIN CHANGES - EXACT DESIGN PRESERVED */

<body>

<main id="mod-epoch-overlay" role="main">
    <header class="ep-head" role="banner">
        <a href="../programmer.html" class="qs-back-btn" aria-label="Go back to Programmer Suite">
            <i class="fas fa-arrow-left" aria-hidden="true"></i>
        </a>
<h1 class="ep-tit" style="position: absolute; left: 50%; transform: translateX(-50%); margin: 0; color: #38bdf8; font-family: 'JetBrains Mono', monospace; font-weight: 900; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);">
    <i class="fas fa-clock" aria-hidden="true"></i> UNIX TIME ENGINE
</h1>

    </header>

    <div class="ep-body">
        
        <section class="live-clock-card" aria-label="Live System Clock">
            <span class="lc-lbl"><i class="fas fa-satellite-dish fa-spin" style="margin-right:5px;" aria-hidden="true"></i> Current Epoch Time</span>
            <span class="lc-val" id="lc-sec" aria-live="polite">0000000000</span><span class="lc-ms" id="lc-ms" aria-hidden="true">.000</span>
            <i class="fas fa-copy lc-copy" aria-label="Copy current epoch time" role="button" tabindex="0" onclick="QS_Epoch.copyLive()" onkeydown="if(event.key==='Enter') QS_Epoch.copyLive()"></i>
        </section>

        <section class="ep-grp" id="grp-val" aria-labelledby="input-heading">
            <h2 id="input-heading" class="sr-only" style="display:none;">Enter Timestamp or Date</h2>
            <div class="ep-lbl">
                <label for="ep-inp-val">Timestamp Input</label>
                <span class="ep-badge" id="inp-badge" aria-live="polite">Auto-Detect</span>
            </div>
            <div class="ep-inp-wrap">
                <input type="text" id="ep-inp-val" class="ep-inp" placeholder="e.g. 1678883300" aria-describedby="ep-err" oninput="QS_Epoch.calc()" autocomplete="off">
                <button class="btn-now" aria-label="Set to Current Time" onclick="QS_Epoch.setNow()">NOW</button>
            </div>

        </section>

        <section class="res-grid" aria-label="Converted Time Formats">
            <div class="res-card" style="border-color:#10b981; background:rgba(16, 185, 129, 0.05); cursor:default;">
                <span class="r-tit" style="color:#10b981;" id="lbl-relative">Relative Time (Time Travel)</span>
                <span class="r-val r-val-lg" id="res-relative" aria-labelledby="lbl-relative" aria-live="polite">--</span>
            </div>

            <div class="fmt-grid">
                <div class="res-card" role="button" tabindex="0" aria-label="Copy Local Time" onclick="QS_Epoch.copy('res-local')" onkeydown="if(event.key==='Enter') QS_Epoch.copy('res-local')">
                    <span class="r-tit" id="lbl-local">Local Time (Your Device)</span>
                    <i class="fas fa-copy r-copy" aria-hidden="true"></i>
                    <span class="r-val" id="res-local" aria-labelledby="lbl-local" aria-live="polite">--</span>
                </div>
                <div class="res-card" role="button" tabindex="0" aria-label="Copy UTC Time" onclick="QS_Epoch.copy('res-utc')" onkeydown="if(event.key==='Enter') QS_Epoch.copy('res-utc')">
                    <span class="r-tit" id="lbl-utc">GMT / UTC (Server Time)</span>
                    <i class="fas fa-copy r-copy" aria-hidden="true"></i>
                    <span class="r-val" id="res-utc" style="color:#f59e0b;" aria-labelledby="lbl-utc" aria-live="polite">--</span>
                </div>
            </div>

            <div class="res-card" role="button" tabindex="0" aria-label="Copy ISO 8601 Format" onclick="QS_Epoch.copy('res-iso')" onkeydown="if(event.key==='Enter') QS_Epoch.copy('res-iso')">
                <span class="r-tit" id="lbl-iso">ISO 8601 Format (Standard)</span>
                <i class="fas fa-copy r-copy" aria-hidden="true"></i>
                <span class="r-val" id="res-iso" aria-labelledby="lbl-iso" aria-live="polite">--</span>
            </div>

            <div class="res-card" role="button" tabindex="0" aria-label="Copy RFC 2822 Format" onclick="QS_Epoch.copy('res-rfc')" onkeydown="if(event.key==='Enter') QS_Epoch.copy('res-rfc')">
                <span class="r-tit" id="lbl-rfc">RFC 2822 (Email / HTTP Headers)</span>
                <i class="fas fa-copy r-copy" aria-hidden="true"></i>
                <span class="r-val" id="res-rfc" aria-labelledby="lbl-rfc" aria-live="polite">--</span>
            </div>
        </section>

        <button class="btn-why" aria-haspopup="dialog" aria-expanded="false" aria-label="Open Y2K38 Bug Visualizer" onclick="QS_Epoch.showSteps()">
            <i class="fas fa-skull-crossbones" aria-hidden="true"></i> The Year 2038 Problem (Y2K38)
        </button>

    </div>

    <div id="ep-steps-modal" role="dialog" aria-modal="true" aria-labelledby="modal-y2k-title">
        <div id="ep-steps-box">
            <header class="steps-head">
                <h2 id="modal-y2k-title" style="margin: 0; font-size: 1rem;"><i class="fas fa-radiation" aria-hidden="true"></i> THE Y2K38 BUG</h2>
                <button class="steps-close" aria-label="Close Bug Visualizer" onclick="QS_Epoch.hideSteps()"><i class="fas fa-times" aria-hidden="true"></i></button>
            </header>
            <div class="steps-content" id="ep-steps-content" aria-live="polite">
                </div>
        </div>

</main>

<script>
    /* QUICKSOLVE PLATINUM - UNIX EPOCH ENGINE (MPA STANDALONE)
       Features: Live tick, Auto-detect Sec/Ms/Us/Ns, Relative Time Formatting, Y2K38 Visualizer.
    */
    const QS_Epoch = {
        
        timerId: null,
        isValid: false,
        lastDateObj: null,

        init: function() {
            console.log("Unix Time Engine Ready 🚀");
            this.startClock();
            
            // Set current time on load if input is empty
            if(!document.getElementById('ep-inp-val').value) {
                this.setNow();
            }
        },

        // --- PLATINUM FEATURE: Live Matrix Clock ---
        startClock: function() {
            this.stopClock(); // Prevent multiple intervals
            const elSec = document.getElementById('lc-sec');
            const elMs = document.getElementById('lc-ms');
            
            this.timerId = setInterval(() => {
                const now = Date.now(); // Milliseconds
                const sec = Math.floor(now / 1000);
                const ms = now % 1000;
                
                elSec.innerText = sec;
                elMs.innerText = "." + ms.toString().padStart(3, '0');
            }, 47); // Updates smoothly (approx 21fps)
        },

        stopClock: function() {
            if (this.timerId) clearInterval(this.timerId);
        },

        copyLive: function() {
            const sec = document.getElementById('lc-sec').innerText;
            this.copyToClipboard(sec);
        },

        setNow: function() {
            document.getElementById('ep-inp-val').value = Math.floor(Date.now() / 1000);
            this.calc();
            this.triggerHaptic();
        },

        // --- PLATINUM FEATURE: Smart Auto-Detect Parser ---
        calc: function() {
            const raw = document.getElementById('ep-inp-val').value.trim();
            const grp = document.getElementById('grp-val');
            const err = document.getElementById('ep-err');
            const badge = document.getElementById('inp-badge');
            
            grp.classList.remove('error');
            err.style.display = 'none';
            this.isValid = false;

            if (!raw) {
                this.clearResults();
                badge.innerText = "Auto-Detect";
                badge.style.color = "#3b82f6";
                badge.style.borderColor = "#3b82f6";
                return;
            }

            let msTime = 0;

            // 1. Check if it's a number (Timestamp)
            if (/^-?\d+(\.\d+)?$/.test(raw)) {
                // Remove decimals if any
                let numStr = raw.split('.')[0].replace('-', ''); 
                let num = parseInt(raw, 10);
                
                if (numStr.length <= 10) {
                    msTime = num * 1000;
                    badge.innerText = "Seconds";
                } else if (numStr.length <= 13) {
                    msTime = num;
                    badge.innerText = "Milliseconds";
                } else if (numStr.length <= 16) {
                    msTime = Math.floor(num / 1000);
                    badge.innerText = "Microseconds";
                } else {
                    msTime = Math.floor(num / 1000000);
                    badge.innerText = "Nanoseconds";
                }
                badge.style.color = "#10b981"; // Green
                badge.style.borderColor = "#10b981";
            } 
            // 2. Check if it's a human readable date string (e.g. "2026-03-31T11:56:07Z")
            else {
                const parsedDate = Date.parse(raw);
                if (!isNaN(parsedDate)) {
                    msTime = parsedDate;
                    badge.innerText = "Date String";
                    badge.style.color = "#a855f7"; // Purple
                    badge.style.borderColor = "#a855f7";
                } else {
                    this.showError(grp, err);
                    badge.innerText = "Invalid";
                    badge.style.color = "#ef4444";
                    badge.style.borderColor = "#ef4444";
                    return;
                }
            }

            // Create Date Object
            const d = new Date(msTime);
            // Catch invalid dates (e.g. way too large numbers)
            if (isNaN(d.getTime())) {
                this.showError(grp, err);
                return;
            }

            this.isValid = true;
            this.lastDateObj = d;

            // 3. Format Strings
            
            // ISO 8601
            document.getElementById('res-iso').innerText = d.toISOString();
            
            // RFC 2822
            document.getElementById('res-rfc').innerText = d.toUTCString();
            
            // Local Time (Browser's timezone)
            const localOptions = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', timeZoneName: 'short' };
            document.getElementById('res-local').innerText = d.toLocaleString(undefined, localOptions);
            
            // UTC Time
            const utcOptions = { ...localOptions, timeZone: 'UTC' };
            document.getElementById('res-utc').innerText = d.toLocaleString('en-GB', utcOptions);

            // 4. Relative Time (Time Travel feature)
            document.getElementById('res-relative').innerText = this.getRelativeTime(d.getTime());
        },

        showError: function(grp, err) {
            grp.classList.add('error');
            err.style.display = 'block';
            this.clearResults();
        },

        getRelativeTime: function(targetMs) {
            const now = Date.now();
            const diffMs = targetMs - now;
            const diffSec = Math.round(diffMs / 1000);
            
            const rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });

            const absSec = Math.abs(diffSec);
            if (absSec < 60) return rtf.format(diffSec, 'second');
            
            const diffMin = Math.round(diffSec / 60);
            const absMin = Math.abs(diffMin);
            if (absMin < 60) return rtf.format(diffMin, 'minute');
            
            const diffHour = Math.round(diffMin / 60);
            const absHour = Math.abs(diffHour);
            if (absHour < 24) return rtf.format(diffHour, 'hour');
            
            const diffDay = Math.round(diffHour / 24);
            const absDay = Math.abs(diffDay);
            if (absDay < 30) return rtf.format(diffDay, 'day');
            
            const diffMonth = Math.round(diffDay / 30);
            const absMonth = Math.abs(diffMonth);
            if (absMonth < 12) return rtf.format(diffMonth, 'month');
            
            const diffYear = Math.round(diffDay / 365);
            return rtf.format(diffYear, 'year');
        },

        copy: function(id) {
            const text = document.getElementById(id).innerText;
            if (text === '--') return;
            this.copyToClipboard(text);
        },

        copyToClipboard: function(str) {
            const temp = document.createElement('textarea');
            temp.value = str;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            this.triggerHaptic();
        },

        triggerHaptic: function() {
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(5);
            }
        },

        // --- THE "WHY" FEATURE: Y2K38 Bug Visualizer ---
        showSteps: function() {
            const contentBox = document.getElementById('ep-steps-content');
            
            // The exact epoch for 2038-01-19 03:14:07 UTC
            const y2k38Epoch = 2147483647; 
            const y2k38Date = new Date(y2k38Epoch * 1000).toUTCString();

            let html = `
                <div style="margin-bottom:15px; border-left:3px solid #ef4444; padding-left:10px;">
                    <span style="color:#ef4444; font-weight:bold;">What is the Unix Epoch?</span><br>
                    Computers count time by measuring the exact number of seconds that have passed since <b>January 1, 1970 (00:00:00 UTC)</b>.
                </div>
                
                <div style="margin-bottom:5px; border-left:3px solid #f59e0b; padding-left:10px; margin-top:20px;">
                    <span style="color:#f59e0b; font-weight:bold;">The 2038 Doomsday Bug:</span><br>
                    Older systems store this timestamp as a 32-bit signed integer. The MAXIMUM value a 32-bit signed integer can hold is:
                </div>

                <div class="y2k-box">
                    <div class="y2k-num">2,147,483,647</div>
                    <div class="y2k-bin">Binary: 01111111 11111111 11111111 11111111</div>
                    <div class="y2k-date">Hits on: ${y2k38Date}</div>
                </div>

                <div style="margin-top:15px; font-size:0.8rem; color:var(--text-muted); text-align:center;">
                    One second later, the binary rolls over to <span style="color:#ef4444;">10000000...</span> which represents a <b>NEGATIVE</b> number. Computers will suddenly think the year is <b>1901</b>, causing software to crash globally!
                    <br><br><i>Solution: Modern systems are upgrading to 64-bit integers.</i>
                </div>
            `;
            
            contentBox.innerHTML = html;

            const modal = document.getElementById('ep-steps-modal');
            const box = document.getElementById('ep-steps-box');
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.style.opacity = '1';
                box.style.transform = 'translateY(0)';
            }, 10);
            this.triggerHaptic();
        },

        hideSteps: function() {
            const modal = document.getElementById('ep-steps-modal');
            const box = document.getElementById('ep-steps-box');
            modal.style.opacity = '0';
            box.style.transform = 'translateY(20px)';
            setTimeout(() => { modal.style.display = 'none'; }, 300);
            this.triggerHaptic();
        },

        clearResults: function() {
            document.getElementById('res-relative').innerText = "--";
            document.getElementById('res-local').innerText = "--";
            document.getElementById('res-utc').innerText = "--";
            document.getElementById('res-iso').innerText = "--";
            document.getElementById('res-rfc').innerText = "--";
            this.isValid = false;
        }
    };

    // Auto-Init on Load
    window.onload = function() {
        QS_Epoch.init();
    };
    
    // Stop clock if user navigates away (cleanup)
    window.onbeforeunload = function() {
        QS_Epoch.stopClock();
    };
</script>
</body>
