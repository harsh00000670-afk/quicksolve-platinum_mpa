<script>
    /* QUICKSOLVE PLATINUM - CRON EXPRESSION EXPLAINER (MPA STANDALONE)
       Features: Human Readable Translator, Next 5 Executions Prediction Engine (Pure JS), Syntax Breakdown.
    */
    const QS_Cron = {
        
        isValid: false,
        parts: [],
        
        init: function() {
            console.log("Cron Explainer Engine Ready 🚀");
            this.setPreset('*/5 9-17 * * 1-5'); // Set a cool default on load
        },

        setPreset: function(expr) {
            document.getElementById('cr-inp-val').value = expr;
            this.calc();
            this.triggerHaptic();
        },

        calc: function() {
            const raw = document.getElementById('cr-inp-val').value.trim();
            const grp = document.getElementById('grp-val');
            const err = document.getElementById('cr-err');
            
            grp.classList.remove('error');
            err.style.display = 'none';
            this.isValid = false;

            if (!raw) {
                this.clearResults();
                return;
            }

            // Split by space, handle multiple spaces
            this.parts = raw.split(/\s+/);

            if (this.parts.length !== 5) {
                grp.classList.add('error');
                err.style.display = 'block';
                this.clearResults();
                return;
            }

            this.isValid = true;

            // 1. Generate Human Readable Text
            const translation = this.translateToEnglish(this.parts);
            document.getElementById('res-trans').innerText = `“${translation}”`;

            // 2. Calculate Next 5 Runs (The Brains)
            this.calculateNextRuns(this.parts);
        },

        // --- PLATINUM FEATURE: Human Translation Engine ---
        translateToEnglish: function(p) {
            let [min, hr, dom, mon, dow] = p;
            let desc = "";

            // Minute
            if (min === '*') desc += "Every minute";
            else if (min.startsWith('*/')) desc += `Every ${min.replace('*/', '')} minutes`;
            else desc += `At minute ${min}`;

            // Hour
            if (hr === '*') {} // Do nothing, already implied
            else if (hr.startsWith('*/')) desc += `, every ${hr.replace('*/', '')} hours`;
            else if (hr.includes('-')) desc += `, between hour ${hr.replace('-', ' and ')}`;
            else {
                // If specific hour and minute
                if (min !== '*' && !min.includes('/') && !min.includes(',') && !min.includes('-')) {
                    let padMin = min.padStart(2, '0');
                    let padHr = hr.padStart(2, '0');
                    desc = `At ${padHr}:${padMin}`;
                } else {
                    desc += `, past hour ${hr}`;
                }
            }

            // Day of Month
            if (dom !== '*') {
                if (dom.startsWith('*/')) desc += `, every ${dom.replace('*/', '')} days`;
                else desc += `, on day ${dom} of the month`;
            }

            // Month
            const months = ["", "Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            if (mon !== '*') {
                if (mon.includes('-')) {
                    let [m1, m2] = mon.split('-');
                    desc += `, from ${months[parseInt(m1)]} through ${months[parseInt(m2)]}`;
                } else {
                    let mStr = mon.split(',').map(m => months[parseInt(m)] || m).join(', ');
                    desc += `, only in ${mStr}`;
                }
            }

            // Day of Week
            const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
            if (dow !== '*') {
                if (dow.includes('-')) {
                    let [d1, d2] = dow.split('-');
                    desc += `, Monday through Friday`; // Common simplification for 1-5
                    if(d1 !== '1' || d2 !== '5') desc += ` (${days[parseInt(d1)]} to ${days[parseInt(d2)]})`;
                } else {
                    let dStr = dow.split(',').map(d => days[parseInt(d)] || d).join(', ');
                    desc += `, and on ${dStr}`;
                }
            }

            return desc.charAt(0).toUpperCase() + desc.slice(1);
        },

        // --- PLATINUM FEATURE: Time Machine (Next 5 Runs) ---
        calculateNextRuns: function(p) {
            const listEl = document.getElementById('next-list');
            listEl.innerHTML = '';
            
            // Helper to check if a value matches a cron field rule
            const matchField = (val, rule) => {
                if (rule === '*') return true;
                if (rule.includes('/')) {
                    let step = parseInt(rule.split('/')[1]);
                    return val % step === 0;
                }
                if (rule.includes('-')) {
                    let [start, end] = rule.split('-').map(Number);
                    return val >= start && val <= end;
                }
                if (rule.includes(',')) {
                    let parts = rule.split(',').map(Number);
                    return parts.includes(val);
                }
                return val === parseInt(rule);
            };

            let matches = [];
            let safetyLimit = 0;
            let currentTestDate = new Date();
            
            // Drop seconds to simulate cron exact minute execution
            currentTestDate.setSeconds(0);
            currentTestDate.setMilliseconds(0);
            currentTestDate.setMinutes(currentTestDate.getMinutes() + 1); // Start checking from next minute

            // Fast Forward Search Engine
            while (matches.length < 5 && safetyLimit < 100000) { // ~70 days max search to prevent hang
                let cMin = currentTestDate.getMinutes();
                let cHr = currentTestDate.getHours();
                let cDom = currentTestDate.getDate();
                let cMon = currentTestDate.getMonth() + 1; // JS months are 0-11
                let cDow = currentTestDate.getDay();

                // Logic fix for Day of Week (0 and 7 are both Sunday in some cron systems)
                let cDowMatch = cDow;
                if (p[4].includes('7') && cDow === 0) cDowMatch = 7;

                if (
                    matchField(cMon, p[3]) &&
                    matchField(cDom, p[2]) &&
                    matchField(cDowMatch, p[4]) &&
                    matchField(cHr, p[1]) &&
                    matchField(cMin, p[0])
                ) {
                    matches.push(new Date(currentTestDate));
                }

                currentTestDate.setMinutes(currentTestDate.getMinutes() + 1);
                safetyLimit++;
            }

            if (matches.length === 0) {
                listEl.innerHTML = `<div style="text-align:center; color:#f59e0b; padding:10px;">Execution is too rare to predict within 70 days.</div>`;
                return;
            }

            matches.forEach(date => {
                const dateStr = date.toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
                const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                
                listEl.innerHTML += `
                    <div class="next-item">
                        <span>${dateStr}</span>
                        <span class="time">${timeStr}</span>
                    </div>
                `;
            });
        },

        triggerHaptic: function() {
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(5);
            }
        },

        // --- PLATINUM FEATURE: Map Visualizer ---
        showSteps: function() {
            const contentBox = document.getElementById('cr-steps-content');
            
            if (!this.isValid) {
                contentBox.innerHTML = `<div style="text-align:center; padding:20px; color:#ef4444;"><i class="fas fa-exclamation-triangle fa-2x" aria-hidden="true"></i><br><br>Enter a valid 5-part cron expression!</div>`;
            } else {
                const labels = [
                    { name: "Minute", range: "0 - 59" },
                    { name: "Hour", range: "0 - 23" },
                    { name: "Day of Month", range: "1 - 31" },
                    { name: "Month", range: "1 - 12 (Jan - Dec)" },
                    { name: "Day of Week", range: "0 - 6 (Sun - Sat)" }
                ];

                let html = `
                    <div style="margin-bottom:15px; border-left:3px solid #a855f7; padding-left:10px;">
                        <span style="color:#a855f7; font-weight:bold;">Cron Anatomy Explained:</span><br>
                        The server reads the expression from left to right to determine the exact schedule.
                    </div>
                    <div class="cron-map">
                `;

                for(let i=0; i<5; i++) {
                    html += `
                        <div class="c-map-sym">${this.parts[i]}</div>
                        <div class="c-map-desc">
                            <span class="cmd-tit">Position ${i+1}: ${labels[i].name}</span>
                            <span class="cmd-val">Range: ${labels[i].range}</span>
                        </div>
                    `;
                }

                html += `</div>
                    <div style="margin-top:15px; font-size:0.7rem; color:var(--text-muted); text-align:center;">
                        <b>Pro Tip:</b> <code>*</code> means "Every", <code>*/5</code> means "Step by 5", <code>1-5</code> means "Range".
                    </div>
                `;
                contentBox.innerHTML = html;
            }

            const modal = document.getElementById('cr-steps-modal');
            const box = document.getElementById('cr-steps-box');
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.style.opacity = '1';
                box.style.transform = 'translateY(0)';
            }, 10);
            this.triggerHaptic();
        },

        hideSteps: function() {
            const modal = document.getElementById('cr-steps-modal');
            const box = document.getElementById('cr-steps-box');
            modal.style.opacity = '0';
            box.style.transform = 'translateY(20px)';
            setTimeout(() => { modal.style.display = 'none'; }, 300);
            this.triggerHaptic();
        },

        clearResults: function() {
            document.getElementById('res-trans').innerText = "--";
            document.getElementById('next-list').innerHTML = `<div style="text-align:center; color:#475569; padding:10px;">Waiting for valid expression...</div>`;
            this.isValid = false;
        }
    };

    // Auto-Init on Load
    window.onload = function() {
        QS_Cron.init();
    };
</script>
