<script>
    /* QUICKSOLVE PLATINUM - CRYPTO HASH FACTORY (MPA STANDALONE)
       Features: Native WebCrypto API, Large File Checksums, HMAC (Secret Key), Checksum Verifier.
    */
    const QS_Hash = {
        
        currentMode: 'text',
        outputFormat: 'hex', // hex or base64
        
        currentHashes: {
            'SHA-1': '',
            'SHA-256': '',
            'SHA-384': '',
            'SHA-512': ''
        },
        fileBuffer: null,

        init: function() {
            console.log("Hash Factory Engine Ready 🚀");
            this.resetUI();
        },

        setMode: function(mode) {
            this.currentMode = mode;
            ['text', 'hmac', 'file'].forEach(m => {
                const el = document.getElementById(`btn-hm-${m}`);
                el.classList.remove('active');
                el.setAttribute('aria-selected', 'false');
            });
            const activeBtn = document.getElementById(`btn-hm-${mode}`);
            activeBtn.classList.add('active');
            activeBtn.setAttribute('aria-selected', 'true');

            const txtArea = document.getElementById('inp-data');
            const hmacKey = document.getElementById('inp-hmac-key');
            const dropZone = document.getElementById('drop-zone');
            const mainLbl = document.getElementById('hs-main-lbl');

            if (mode === 'text') {
                txtArea.style.display = 'block';
                hmacKey.style.display = 'none';
                dropZone.style.display = 'none';
                mainLbl.innerText = "String to Hash";
            } else if (mode === 'hmac') {
                txtArea.style.display = 'block';
                hmacKey.style.display = 'block';
                dropZone.style.display = 'none';
                mainLbl.innerText = "Payload String";
            } else {
                txtArea.style.display = 'none';
                hmacKey.style.display = 'none';
                dropZone.style.display = 'block';
                mainLbl.innerText = "File to Verify";
            }
            
            this.clearResults();
            this.triggerHaptic();
        },

        setFormat: function(fmt) {
            this.outputFormat = fmt;
            document.getElementById('fmt-hex').classList.remove('active');
            document.getElementById('fmt-b64').classList.remove('active');
            
            if(fmt === 'hex') document.getElementById('fmt-hex').classList.add('active');
            else document.getElementById('fmt-b64').classList.add('active');
            
            this.renderHashes();
            this.triggerHaptic();
        },

        handleFile: function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('file-info').innerText = `Loaded: ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`;
            const loader = document.getElementById('loader-msg');
            loader.style.display = 'block';
            
            const reader = new FileReader();
            reader.onload = async (evt) => {
                this.fileBuffer = evt.target.result;
                await this.calcHashesFromBuffer(this.fileBuffer);
                loader.style.display = 'none';
            };
            reader.onerror = () => {
                document.getElementById('file-info').innerText = "Error reading file!";
                loader.style.display = 'none';
            };
            reader.readAsArrayBuffer(file);
        },

        calc: async function() {
            if (this.currentMode === 'file') return;
            
            const rawData = document.getElementById('inp-data').value;
            if (!rawData) {
                this.clearResults();
                return;
            }

            const encoder = new TextEncoder();
            const dataBuffer = encoder.encode(rawData);

            if (this.currentMode === 'hmac') {
                const keyStr = document.getElementById('inp-hmac-key').value;
                const keyBuffer = encoder.encode(keyStr);
                await this.calcHMAC(keyBuffer, dataBuffer);
            } else {
                await this.calcHashesFromBuffer(dataBuffer);
            }
        },

        calcHashesFromBuffer: async function(buffer) {
            try {
                const algos = ['SHA-1', 'SHA-256', 'SHA-384', 'SHA-512'];
                for (let algo of algos) {
                    const hashBuffer = await crypto.subtle.digest(algo, buffer);
                    this.currentHashes[algo] = hashBuffer;
                }
                this.renderHashes();
            } catch (e) {
                console.error("Crypto API Error:", e);
            }
        },

        calcHMAC: async function(keyBuffer, dataBuffer) {
            try {
                const algos = ['SHA-1', 'SHA-256', 'SHA-384', 'SHA-512'];
                for (let algo of algos) {
                    const cryptoKey = await crypto.subtle.importKey(
                        "raw", keyBuffer, { name: "HMAC", hash: algo }, false, ["sign"]
                    );
                    const signature = await crypto.subtle.sign("HMAC", cryptoKey, dataBuffer);
                    this.currentHashes[algo] = signature;
                }
                this.renderHashes();
            } catch (e) {
                console.error("HMAC Error:", e);
            }
        },

        bufferToHex: function(buffer) {
            const hashArray = Array.from(new Uint8Array(buffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        },

        bufferToBase64: function(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);
        },

        renderHashes: function() {
            const algos = ['SHA-1', 'SHA-256', 'SHA-384', 'SHA-512'];
            for (let algo of algos) {
                let id = 'res-' + algo.toLowerCase().replace('-', '');
                let buffer = this.currentHashes[algo];
                if (buffer) {
                    let outStr = this.outputFormat === 'hex' ? this.bufferToHex(buffer) : this.bufferToBase64(buffer);
                    document.getElementById(id).value = outStr;
                } else {
                    document.getElementById(id).value = '--';
                }
            }
            this.verifyMatch();
        },

        verifyMatch: function() {
            const expected = document.getElementById('inp-matcher').value.trim().toLowerCase();
            const resBox = document.getElementById('match-result');
            if (!expected) {
                resBox.style.display = 'none';
                return;
            }
            let currentHexes = [];
            const algos = ['SHA-1', 'SHA-256', 'SHA-384', 'SHA-512'];
            for (let algo of algos) {
                if (this.currentHashes[algo]) {
                    currentHexes.push(this.bufferToHex(this.currentHashes[algo]).toLowerCase());
                }
            }
            if (currentHexes.length === 0) return;
            if (currentHexes.includes(expected)) {
                resBox.innerText = "✅ EXACT MATCH FOUND! (FILE IS SAFE)";
                resBox.className = "match-res m-success";
                resBox.style.display = 'block';
            } else {
                resBox.innerText = "❌ HASH MISMATCH! (DATA CORRUPTED/MODIFIED)";
                resBox.className = "match-res m-fail";
                resBox.style.display = 'block';
            }
        },

        // FIX: Replaced legacy execCommand with Modern Clipboard API and fallback
        copy: async function(id) {
            const el = document.getElementById(id);
            if(el.value === '--') return;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(el.value);
                } else {
                    throw new Error("Clipboard API not available");
                }
            } catch(e) {
                el.select();
                document.execCommand('copy');
            }
            this.triggerHaptic();
        },

        triggerHaptic: function() {
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(5);
            }
        },

        showSteps: async function() {
            const contentBox = document.getElementById('hs-steps-content');
            let text = this.currentMode === 'text' ? document.getElementById('inp-data').value : "Hello";
            if (!text) text = "Hello";
            let mutatedText = text + ".";

            contentBox.innerHTML = `<div style="text-align:center; padding:20px; color:#f59e0b;"><i class="fas fa-spinner fa-spin fa-2x" aria-hidden="true"></i><br><br>Simulating Crypto Avalanche...</div>`;

            const modal = document.getElementById('hs-steps-modal');
            const box = document.getElementById('hs-steps-box');
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.style.opacity = '1';
                box.style.transform = 'translateY(0)';
            }, 10);
            this.triggerHaptic();

            const enc = new TextEncoder();
            const hash1Buf = await crypto.subtle.digest('SHA-256', enc.encode(text));
            const hash2Buf = await crypto.subtle.digest('SHA-256', enc.encode(mutatedText));
            const hash1Hex = this.bufferToHex(hash1Buf);
            const hash2Hex = this.bufferToHex(hash2Buf);

            let visualHash2 = "";
            let changes = 0;
            for(let i=0; i<hash2Hex.length; i++) {
                if(hash2Hex[i] !== hash1Hex[i]) {
                    visualHash2 += `<span class="hl-diff">${hash2Hex[i]}</span>`;
                    changes++;
                } else {
                    visualHash2 += hash2Hex[i];
                }
            }
            let changePercent = Math.round((changes / 64) * 100);

            let html = `
                <div style="margin-bottom:15px; border-left:3px solid #ef4444; padding-left:10px;">
                    <span style="color:#ef4444; font-weight:bold;">The Avalanche Effect:</span><br>
                    In strong cryptography, changing just ONE bit of the input should completely scramble the output. This proves the hash cannot be reversed or predicted!
                </div>
                <div class="ava-box">
                    <div class="ava-lbl">Original Input (SHA-256)</div>
                    <div class="ava-inp">"${text}"</div>
                    <div class="ava-hash" style="color:#22c55e;">${hash1Hex}</div>
                </div>
                <div style="text-align:center; margin:10px 0; color:#ef4444; font-size:1.5rem;" aria-hidden="true">
                    <i class="fas fa-bolt"></i>
                </div>
                <div class="ava-box" style="border-color:#ef4444;">
                    <div class="ava-lbl">Mutated Input (Added ONE dot)</div>
                    <div class="ava-inp">"${mutatedText}"</div>
                    <div class="ava-hash">${visualHash2}</div>
                </div>
                <div style="margin-top:15px; font-size:0.8rem; color:var(--text-muted); text-align:center;">
                    *Adding just ONE dot changed <span style="color:#ef4444; font-weight:bold;">${changePercent}%</span> of the resulting Hash characters!
                </div>
            `;
            contentBox.innerHTML = html;
        },

        hideSteps: function() {
            const modal = document.getElementById('hs-steps-modal');
            const box = document.getElementById('hs-steps-box');
            modal.style.opacity = '0';
            box.style.transform = 'translateY(20px)';
            setTimeout(() => { modal.style.display = 'none'; }, 300);
            this.triggerHaptic();
        },

        clearResults: function() {
            this.currentHashes = { 'SHA-1': '', 'SHA-256': '', 'SHA-384': '', 'SHA-512': '' };
            this.fileBuffer = null;
            ['sha1', 'sha256', 'sha384', 'sha512'].forEach(a => {
                const el = document.getElementById('res-' + a);
                if(el) el.value = "--";
            });
            document.getElementById('inp-matcher').value = "";
            document.getElementById('match-result').style.display = "none";
            document.getElementById('file-info').innerText = "";
        },

        resetUI: function() {
            this.setMode('text');
            document.getElementById('inp-data').value = '';
            document.getElementById('inp-hmac-key').value = '';
            this.setFormat('hex');
            this.clearResults();
        }
    };

    window.onload = function() {
        QS_Hash.init();
    };
</script>
