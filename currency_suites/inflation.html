                    {c:"FJD", n:"Fijian Dollar", f:"🇫🇯"}, {c:"PGK", n:"PNG Kina", f:"🇵🇬"}, {c:"WST", n:"Samoan Tala", f:"🇼🇸"},
                    {c:"TOP", n:"Tongan Paʻanga", f:"🇹🇴"}, {c:"VUV", n:"Vanuatu Vatu", f:"🇻🇺"}, {c:"SBD", n:"Solomon Islands $", f:"🇸🇧"},
                    {c:"MOP", n:"Macanese Pataca", f:"🇲🇴"}, {c:"TWD", n:"Taiwan Dollar", f:"🇹🇼"}, {c:"MNT", n:"Mongolian Tögrög", f:"🇲🇳"},
                    {c:"SYP", n:"Syrian Pound", f:"🇸🇾"}, {c:"YER", n:"Yemeni Rial", f:"🇾🇪"}, {c:"SCR", n:"Seychellois Rupee", f:"🇸🇨"},
                    {c:"MUR", n:"Mauritian Rupee", f:"🇲🇺"}, {c:"MGA", n:"Malagasy Ariary", f:"🇲🇬"}, {c:"MWK", n:"Malawian Kwacha", f:"🇲🇼"},
                    {c:"NAD", n:"Namibian Dollar", f:"🇳🇦"}, {c:"BWP", n:"Botswana Pula", f:"🇧🇼"}, {c:"SZL", n:"Swazi Lilangeni", f:"🇸🇿"},
                    {c:"LSL", n:"Lesotho Loti", f:"🇱🇸"}, {c:"ANG", n:"Neth. Antillean Guilder", f:"🇨🇼"}, {c:"AWG", n:"Aruban Florin", f:"🇦🇼"},
                    {c:"BSD", n:"Bahamian Dollar", f:"🇧🇸"}, {c:"BMD", n:"Bermudian Dollar", f:"🇧🇲"}, {c:"BZD", n:"Belize Dollar", f:"🇧🇿"},
                    {c:"KYD", n:"Cayman Islands Dollar", f:"🇰🇾"}, {c:"CUP", n:"Cuban Peso", f:"🇨🇺"}, {c:"HTG", n:"Haitian Gourde", f:"🇭🇹"},
                    {c:"GYD", n:"Guyanese Dollar", f:"🇬🇾"}, {c:"SRD", n:"Surinamese Dollar", f:"🇸🇷"}, {c:"FKP", n:"Falkland Islands £", f:"🇫🇰"},
                    {c:"GIP", n:"Gibraltar Pound", f:"🇬🇮"}, {c:"SHP", n:"Saint Helena Pound", f:"🇸🇭"}, {c:"IMP", n:"Isle of Man Pound", f:"🇮🇲"},
                    {c:"JEP", n:"Jersey Pound", f:"🇯🇪"}, {c:"GGP", n:"Guernsey Pound", f:"🇬🇬"}, {c:"SOS", n:"Somali Shilling", f:"🇸🇴"},
                    {c:"DJF", n:"Djiboutian Franc", f:"🇩🇯"}, {c:"KMF", n:"Comorian Franc", f:"🇰🇲"}, {c:"ERN", n:"Eritrean Nakfa", f:"🇪🇷"},
                    {c:"SDG", n:"Sudanese Pound", f:"🇸🇩"}, {c:"SSP", n:"South Sudanese £", f:"🇸🇸"}, {c:"BIF", n:"Burundian Franc", f:"🇧🇮"},
                    {c:"CDF", n:"Congolese Franc", f:"🇨🇩"}, {c:"CVE", n:"Cape Verdean Escudo", f:"🇨🇻"}, {c:"GMD", n:"Gambian Dalasi", f:"🇬🇲"},
                    {c:"GNF", n:"Guinean Franc", f:"🇬🇳"}, {c:"LRD", n:"Liberian Dollar", f:"🇱🇷"}, {c:"SLL", n:"Sierra Leonean Leone", f:"🇸🇱"},
                    {c:"STN", n:"São Tomé and Príncipe", f:"🇸🇹"}, {c:"TJS", n:"Tajikistani Somoni", f:"🇹🇯"}, {c:"KGS", n:"Kyrgyzstani Som", f:"🇰🇬"}
                ],

                initListener: function() {
                    // Build the dynamic economies dictionary on load
                    this.fullList.forEach(c => {
                        let code = c.c.toLowerCase();
                        let data = this.exactData[code] || this.fallbackData;
                        this.economies[code] = {
                            id: code,
                            name: c.n,
                            sym: c.c, // Using code as symbol for consistency
                            flag: c.f,
                            avg: data.avg,
                            rates: data.rates
                        };
                    });

                    window.addEventListener('qs-tool-opened', (e) => {
                        if(e.detail && e.detail.tool === 'currency_suites/inflation.js') {
                            this.updateUI();
                        }
                    });

                    // Standalone Boot for direct load
                    if(document.readyState === 'complete' || document.readyState === 'interactive'){
                         setTimeout(() => this.updateUI(), 100);
                    } else {
                         document.addEventListener('DOMContentLoaded', () => this.updateUI());
                    }
                },

                filterModal: function() {
                    const searchInp = document.getElementById('inf-search-inp');
                    const q = searchInp ? searchInp.value.toLowerCase() : "";
                    const list = document.getElementById('list-economy');
                    if(!list) return;
                    list.innerHTML = '';

                    let filtered = Object.values(this.economies).filter(e => 
                        e.name.toLowerCase().includes(q) || e.id.toLowerCase().includes(q)
                    );

                    if(filtered.length === 0) {
                        list.innerHTML = `<div style="text-align:center; color:#64748b; padding:20px;">No country found.</div>`;
                        return;
                    }

                    filtered.forEach(e => {
                        let div = document.createElement('div');
                        div.className = 'bs-item';
                        div.onclick = () => { this.currentEcon = e.id; this.updateUI(); this.closeModal(); };
                        div.innerHTML = `
                            <div class="ics-flag">${e.flag}</div>
                            <div class="ics-details">
                                <span class="ics-title">${e.name} (${e.id.toUpperCase()})</span>
                                <span class="ics-sub">Historical Avg: ${e.avg}</span>
                            </div>
                        `;
                        list.appendChild(div);
                    });
                },

                openModal: function() {
                    let searchInp = document.getElementById('inf-search-inp');
                    if(searchInp) searchInp.value = "";
                    this.filterModal(); // Render full list
                    const modal = document.getElementById('inf-modal');
                    if(modal) {
                        modal.style.display = 'flex';
                        setTimeout(() => { modal.classList.add('bs-open'); }, 10);
                        setTimeout(() => { if(searchInp) searchInp.focus(); }, 300);
                    }
                    if(window.doHaptic) window.doHaptic();
                },

                closeModal: function() {
                    const modal = document.getElementById('inf-modal');
                    if(modal) {
                        modal.classList.remove('bs-open');
                        setTimeout(() => { modal.style.display = 'none'; }, 300);
                    }
                    if(window.doHaptic) window.doHaptic();
                },

                updateUI: function() {
                    const e = this.economies[this.currentEcon];
                    if(!e) return;
                    
                    if(document.getElementById('ui-flag')) document.getElementById('ui-flag').innerText = e.flag;
                    if(document.getElementById('ui-title')) document.getElementById('ui-title').innerText = `${e.name} (${e.id.toUpperCase()})`;
                    if(document.getElementById('ui-sub')) document.getElementById('ui-sub').innerText = `Avg Historical Inflation: ${e.avg}`;
                    if(document.getElementById('ui-sym')) document.getElementById('ui-sym').innerText = e.sym;
                    this.calc();
                },

                syncYears: function(type) {
                    const fromYrEl = document.getElementById('slide-from');
                    const toYrEl = document.getElementById('slide-to');
                    if(!fromYrEl || !toYrEl) return;

                    const fromYr = parseInt(fromYrEl.value);
                    const toYr = parseInt(toYrEl.value);
                    
                    if(document.getElementById('val-from')) document.getElementById('val-from').innerText = fromYr;
                    if(document.getElementById('val-to')) document.getElementById('val-to').innerText = toYr;
                    
                    this.calc();
                },

                getRateForYear: function(year, ratesObj) {
                    let decade = Math.floor(year / 10) * 10;
                    if (decade < 1960) decade = 1960;
                    if (decade > 2020) decade = 2020;
                    return ratesObj[decade];
                },

                calc: function() {
                    const amtEl = document.getElementById('inf-amt');
                    const fromYrEl = document.getElementById('slide-from');
                    const toYrEl = document.getElementById('slide-to');
                    if(!amtEl || !fromYrEl || !toYrEl) return;

                    const amt = parseFloat(amtEl.value) || 0;
                    const fromYr = parseInt(fromYrEl.value);
                    const toYr = parseInt(toYrEl.value);
                    const econ = this.economies[this.currentEcon];

                    if (amt === 0 || fromYr === toYr) {
                        if(document.getElementById('res-val')) document.getElementById('res-val').innerText = `${econ.sym} ${amt.toLocaleString('en-US')}`;
                        if(document.getElementById('res-cum')) document.getElementById('res-cum').innerText = "+0.00%";
                        if(document.getElementById('res-loss')) document.getElementById('res-loss').innerText = "0.00%";
                        if(document.getElementById('res-insight')) document.getElementById('res-insight').innerHTML = "Time travel canceled. You are in the same year.";
                        return;
                    }

                    let finalValue = amt;
                    let isForward = toYr > fromYr;
                    
                    let start = isForward ? fromYr : toYr;
                    let end = isForward ? toYr : fromYr;

                    for (let y = start; y < end; y++) {
                        let rate = this.getRateForYear(y, econ.rates) / 100;
                        finalValue = finalValue * (1 + rate);
                    }

                    if (!isForward) {
                        let multiplier = finalValue / amt;
                        finalValue = amt / multiplier;
                    }

                    let multiplierExact = isForward ? (finalValue / amt) : (amt / finalValue);
                    let cumInflation = (multiplierExact - 1) * 100;
                    let lossPct = (1 - (1 / multiplierExact)) * 100;

                    const fmt = (n) => n.toLocaleString('en-US', {maximumFractionDigits: 0});
                    if(document.getElementById('res-val')) document.getElementById('res-val').innerText = `${econ.sym} ${fmt(finalValue)}`;
                    
                    if (isForward) {
                        if(document.getElementById('res-sub')) document.getElementById('res-sub').innerText = `What you need in ${toYr} to match ${fromYr}'s lifestyle.`;
                    } else {
                        if(document.getElementById('res-sub')) document.getElementById('res-sub').innerText = `What ${econ.sym} ${fmt(amt)} in ${fromYr} was worth back in ${toYr}.`;
                    }

                    if(document.getElementById('res-cum')) document.getElementById('res-cum').innerText = `+${cumInflation.toFixed(1)}%`;
                    if(document.getElementById('res-loss')) document.getElementById('res-loss').innerText = `-${lossPct.toFixed(1)}%`;

                    const insightBox = document.getElementById('res-insight');
                    if(insightBox) {
                        if (isForward) {
                            insightBox.innerHTML = `
                                <i class="fas fa-fire-alt" style="color:#d946ef;"></i> <b>Value Destroyed:</b><br>
                                Because of inflation in ${econ.name}, the purchasing power of your money dropped by <span style="color:#ef4444;">${lossPct.toFixed(1)}%</span>. 
                                <br><br>What cost ${econ.sym} ${fmt(amt)} in ${fromYr}, now costs <span style="color:#06b6d4;">${econ.sym} ${fmt(finalValue)}</span> in ${toYr}. 
                            `;
                        } else {
                            insightBox.innerHTML = `
                                <i class="fas fa-history" style="color:#06b6d4;"></i> <b>The Golden Days:</b><br>
                                Back in ${toYr} (${econ.name}), everything was incredibly cheap! You only needed <span style="color:#06b6d4;">${econ.sym} ${fmt(finalValue)}</span> to buy what ${econ.sym} ${fmt(amt)} buys today in ${fromYr}.
                            `;
                        }
                    }
                },

                showSteps: function() {
                    const contentBox = document.getElementById('inf-steps-content');
                    if(!contentBox) return;

                    let html = `
                        <div style="margin-bottom:15px; border-left:3px solid #d946ef; padding-left:10px;">
                            <span style="color:#d946ef; font-weight:bold;">The Silent Tax:</span><br>
                            Governments constantly print new money. When supply increases, the value of each individual note drops. This is why prices "go up" (it's actually the currency going down).
                        </div>
                        
                        <div style="background:#020617; border:1px solid #334155; border-radius:8px; padding:15px; margin-top:10px;">
                            <span style="color:#06b6d4; font-weight:bold; font-size:0.8rem; text-transform:uppercase;"><i class="fas fa-coins"></i> Cash vs Assets</span>
                            
                            <ul style="margin-top:10px; padding-left:15px; color:#94a3b8; font-size:0.8rem; line-height:1.5;">
                                <li><span style="color:#ef4444; font-weight:bold;">Saving Cash:</span> A guaranteed loss. If inflation is 7% a year, your savings lose 50% of their purchasing power every 10 years!</li>
                                <li style="margin-top:8px;"><span style="color:#10b981; font-weight:bold;">Investing (Stocks/Real Estate/Gold):</span> These are limited assets. As money printing increases, the price of limited assets shoots up, protecting you from inflation.</li>
                            </ul>
                        </div>

                        <div style="margin-top:15px; font-size:0.75rem; color:#f8fafc; text-align:center; font-weight:bold; background:rgba(217, 70, 239, 0.1); padding:10px; border-radius:6px; border: 1px dashed #d946ef;">
                            "Inflation is taxation without legislation." - Milton Friedman
                        </div>
                    `;
                    contentBox.innerHTML = html;

                    const modal = document.getElementById('inf-steps-modal');
                    if(modal) {
                        modal.style.display = 'flex';
                        setTimeout(() => { modal.classList.add('bs-open'); }, 10);
                    }
                    if(window.doHaptic) window.doHaptic();
                },

                hideSteps: function() {
                    const modal = document.getElementById('inf-steps-modal');
                    if(modal) {
                        modal.classList.remove('bs-open');
                        setTimeout(() => { modal.style.display = 'none'; }, 300);
                    }
                    if(window.doHaptic) window.doHaptic();
                }
            };

            window.QS_Inflation.initListener();
        })();
    </script>
