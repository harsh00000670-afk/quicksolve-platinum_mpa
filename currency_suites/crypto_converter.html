                fetchLiveMarket: async function() {
                    const updTxt = document.getElementById('live-upd-text');
                    if(updTxt) updTxt.innerText = "Syncing live prices...";
                    
                    try {
                        // 1. Fetch Fiat Live
                        const fiatRes = await fetch('https://open.er-api.com/v6/latest/USD');
                        if (fiatRes.ok) {
                            const fiatData = await fiatRes.json();
                            this.fiatList.forEach(f => {
                                if (f.id !== 'usd' && fiatData.rates[f.symbol.toUpperCase()]) {
                                    f.current_price = 1 / fiatData.rates[f.symbol.toUpperCase()];
                                }
                            });
                        }

                        // 2. Fetch Crypto Live (Top 100)
                        const crpRes = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=false');
                        if (!crpRes.ok) throw new Error("Rate Limited");
                        const crpData = await crpRes.json();
                        
                        // If success, replace offline list entirely with Live Top 100
                        this.combinedList = [...this.fiatList, ...crpData];

                        let date = new Date();
                        if(updTxt) {
                            updTxt.innerText = `Live Sync Active • ${date.toLocaleTimeString()}`;
                            updTxt.style.color = "#10b981";
                        }

                        this.updateUIBoxes();
                        this.calc('from');

                    } catch (e) {
                        console.warn("CoinGecko API Error:", e);
                        if(updTxt) {
                            updTxt.innerText = "Offline Mode: Using cached base prices.";
                            updTxt.style.color = "#ef4444";
                        }
                        
                        // We don't crash the app! We just re-combine the lists in case Fiat updated but Crypto failed
                        this.combinedList = [...this.fiatList, ...this.offlineCryptoList];
                        this.updateUIBoxes();
                        this.calc('from');
                    }
                },

                getCoinData: function(id) {
                    return this.combinedList.find(c => c.id === id) || this.combinedList[0];
                },

                updateUIBoxes: function() {
                    let fromObj = this.getCoinData(this.fromId);
                    let toObj = this.getCoinData(this.toId);

                    // Safety check
                    if(!fromObj || !toObj) return;

                    const updateCard = (obj, prefix) => {
                        let iconEl = document.getElementById(`icon-${prefix}`);
                        if(iconEl) iconEl.src = obj.image;
                        
                        let codeEl = document.getElementById(`code-${prefix}`);
                        if(codeEl) codeEl.innerText = obj.symbol;
                        
                        let nameEl = document.getElementById(`name-${prefix}`);
                        if(nameEl) nameEl.innerText = obj.name;
                        
                        let rankTxt = obj.market_cap_rank === 'Fiat' ? 'FIAT' : `Rank #${obj.market_cap_rank}`;
                        let rankEl = document.getElementById(`rank-${prefix}`);
                        if(rankEl) rankEl.innerText = rankTxt;

                        let changeEl = document.getElementById(`change-${prefix}`);
                        if(changeEl) {
                            // Ensure we don't crash if price_change_percentage_24h is null/undefined
                            let change = obj.price_change_percentage_24h || 0;
                            
                            if (change >= 0) {
                                changeEl.innerText = `+${change.toFixed(2)}% (24h)`;
                                changeEl.className = "crp-change c-up";
                            } else {
                                changeEl.innerText = `${change.toFixed(2)}% (24h)`;
                                changeEl.className = "crp-change c-down";
                            }
                        }
                    };

                    updateCard(fromObj, 'from');
                    updateCard(toObj, 'to');
                },

                calc: function(source) {
                    let fromObj = this.getCoinData(this.fromId);
                    let toObj = this.getCoinData(this.toId);

                    if (!fromObj || !toObj) return;

                    const inpFrom = document.getElementById('inp-from');
                    const inpTo = document.getElementById('inp-to');
                    const rateText = document.getElementById('live-rate-text');

                    let rate = fromObj.current_price / toObj.current_price;
                    
                    let dispRate = rate < 1 ? rate.toPrecision(4) : rate.toLocaleString('en-US', {maximumFractionDigits: 6});
                    if(rateText) rateText.innerHTML = `1 ${fromObj.symbol.toUpperCase()} = <span class="rate-hl">${dispRate} ${toObj.symbol.toUpperCase()}</span>`;

                    if(source === 'from') {
                        let val = parseFloat(inpFrom.value) || 0;
                        let converted = val * rate;
                        inpTo.value = converted === 0 ? "" : this.formatCrypto(converted);
                    } else {
                        let val = parseFloat(inpTo.value) || 0;
                        let converted = val / rate;
                        inpFrom.value = converted === 0 ? "" : this.formatCrypto(converted);
                    }
                },

                formatCrypto: function(num) {
                    if (num >= 1000) return num.toLocaleString('en-US', {maximumFractionDigits: 2});
                    if (num >= 1) return num.toLocaleString('en-US', {maximumFractionDigits: 4});
                    return num.toPrecision(5); 
                },

                swapCurrencies: function() {
                    let temp = this.fromId;
                    this.fromId = this.toId;
                    this.toId = temp;
                    
                    this.updateUIBoxes();
                    
                    let inpFrom = document.getElementById('inp-from');
                    let inpTo = document.getElementById('inp-to');
                    
                    if(inpFrom && inpTo) {
                        let tempVal = inpFrom.value;
                        inpFrom.value = inpTo.value;
                        inpTo.value = tempVal;
                    }

                    this.calc('from');
                    if(window.doHaptic) window.doHaptic();
                },

                openSelector: function(mode) {
                    this.targetMode = mode;
                    let searchInp = document.getElementById('cm-search-inp');
                    if(searchInp) searchInp.value = "";
                    this.filterList(); 
                    
                    const modal = document.getElementById('crp-modal');
                    if(modal) {
                        modal.style.display = 'flex';
                        setTimeout(() => { modal.classList.add('cm-open'); }, 10);
                        setTimeout(() => { if(searchInp) searchInp.focus(); }, 300);
                    }
                    if(window.doHaptic) window.doHaptic();
                },

                closeSelector: function() {
                    const modal = document.getElementById('crp-modal');
                    if(modal) {
                        modal.classList.remove('cm-open');
                        setTimeout(() => { modal.style.display = 'none'; }, 300);
                    }
                    if(window.doHaptic) window.doHaptic();
                },

                filterList: function() {
                    const searchInp = document.getElementById('cm-search-inp');
                    const q = searchInp ? searchInp.value.toLowerCase() : "";
                    const listObj = document.getElementById('cm-list-box');
                    if(!listObj) return;
                    
                    listObj.innerHTML = '';

                    let filtered = this.combinedList.filter(c => 
                        c.name.toLowerCase().includes(q) || c.symbol.toLowerCase().includes(q)
                    );

                    if(filtered.length === 0) {
                        listObj.innerHTML = `<div style="text-align:center; color:#64748b; padding:20px;">No asset found.</div>`;
                        return;
                    }

                    filtered.forEach(c => {
                        let div = document.createElement('div');
                        div.className = "cl-item";
                        div.onclick = () => this.selectCurrency(c.id);
                        
                        let priceUSD = c.id.length <= 3 ? "" : `$${c.current_price < 1 ? c.current_price.toPrecision(4) : c.current_price.toLocaleString('en-US')}`;
                        let changeStr = "";
                        
                        // Bulletproof check for missing 24h change data
                        if (c.price_change_percentage_24h !== undefined && c.price_change_percentage_24h !== null) {
                            let change = c.price_change_percentage_24h;
                            let cColor = change >= 0 ? "#10b981" : "#ef4444";
                            let cSign = change >= 0 ? "+" : "";
                            changeStr = `<span style="color:${cColor}; font-size:0.65rem;">${cSign}${change.toFixed(2)}%</span>`;
                        }

                        div.innerHTML = `
                            <img src="${c.image}" class="cl-img" alt="logo" onerror="this.src='https://assets.coingecko.com/coins/images/1/large/bitcoin.png'">
                            <div class="cl-details">
                                <span class="cl-code">${c.symbol}</span>
                                <span class="cl-name">${c.name}</span>
                            </div>
                            <div class="cl-price">
                                <span class="cl-usd">${priceUSD}</span>
                                ${changeStr}
                            </div>
                        `;
                        listObj.appendChild(div);
                    });
                },

                selectCurrency: function(id) {
                    if(this.targetMode === 'from') {
                        if (this.toId === id) this.swapCurrencies(); 
                        else this.fromId = id;
                    } else {
                        if (this.fromId === id) this.swapCurrencies();
                        else this.toId = id;
                    }

                    this.updateUIBoxes();
                    this.calc('from');
                    this.closeSelector();
                },

                // --- THE "WHY" VISUALIZER ---
                showSteps: function() {
                    const contentBox = document.getElementById('crp-steps-content');
                    if(!contentBox) return;
                    
                    let html = `
                        <div style="margin-bottom:15px; border-left:3px solid #f59e0b; padding-left:10px;">
                            <span style="color:#f59e0b; font-weight:bold;">The Beginner's Mistake:</span><br>
                            "Wow, Dogecoin is only $0.0001! If it reaches $100 like Bitcoin, I'll be a billionaire!"
                        </div>
                        
                        <div style="background:#020617; border:1px solid #334155; border-radius:8px; padding:15px; margin-top:10px;">
                            <span style="color:#10b981; font-weight:bold; font-size:0.8rem; text-transform:uppercase;">Market Cap = Price × Supply</span>
                            
                            <p style="margin-top:8px; font-size:0.8rem; color:#f8fafc;">
                                A coin's real size is its <b>Market Capitalization</b>.
                            </p>
                            
                            <div style="margin-top:10px; border-top:1px dashed #334155; padding-top:10px;">
                                <span style="color:#94a3b8; font-size:0.7rem; font-weight:bold;">Coin A:</span><br>
                                Price: <span style="color:#f59e0b; font-weight:bold;">$100</span><br>
                                Supply: 1 Million coins<br>
                                Market Cap = <span style="color:#10b981; font-weight:bold;">$100 Million</span>
                            </div>

                            <div style="margin-top:10px; border-top:1px dashed #334155; padding-top:10px;">
                                <span style="color:#94a3b8; font-size:0.7rem; font-weight:bold;">Meme Coin B:</span><br>
                                Price: <span style="color:#ef4444; font-weight:bold;">$0.01</span><br>
                                Supply: 10 Billion coins<br>
                                Market Cap = <span style="color:#10b981; font-weight:bold;">$100 Million</span>
                            </div>
                        </div>

                        <div style="margin-top:15px; font-size:0.75rem; color:#38bdf8; text-align:center; font-weight:bold; background:rgba(56,189,248,0.1); padding:10px; border-radius:6px;">
                            <b>Reality Check:</b> Both coins are worth the EXACT SAME amount of money! Coin B is not "cheaper", it just divided its pizza into billions of tiny slices.
                        </div>
                    `;
                    
                    contentBox.innerHTML = html;

                    const modal = document.getElementById('crp-steps-modal');
                    const box = document.getElementById('crp-steps-box');
                    if(modal && box) {
                        modal.style.display = 'flex';
                        setTimeout(() => { modal.style.opacity = '1'; box.style.transform = 'translateY(0)'; }, 10);
                    }
                    if(window.doHaptic) window.doHaptic();
                },

                hideSteps: function() {
                    const modal = document.getElementById('crp-steps-modal');
                    const box = document.getElementById('crp-steps-box');
                    if(modal && box) {
                        modal.style.opacity = '0';
                        box.style.transform = 'translateY(20px)';
                        setTimeout(() => { modal.style.display = 'none'; }, 300);
                    }
                    if(window.doHaptic) window.doHaptic();
                }
            };

            window.QS_Crypto.initListener();
        })();
    </script>
</body>
