                    {c:"MUR", n:"Mauritian Rupee", f:"🇲🇺"}, {c:"MGA", n:"Malagasy Ariary", f:"🇲🇬"}, {c:"MWK", n:"Malawian Kwacha", f:"🇲🇼"},
                    {c:"NAD", n:"Namibian Dollar", f:"🇳🇦"}, {c:"BWP", n:"Botswana Pula", f:"🇧🇼"}, {c:"SZL", n:"Swazi Lilangeni", f:"🇸🇿"},
                    {c:"LSL", n:"Lesotho Loti", f:"🇱🇸"}, {c:"ANG", n:"Neth. Antillean Guilder", f:"🇨🇼"}, {c:"AWG", n:"Aruban Florin", f:"🇦🇼"},
                    {c:"BSD", n:"Bahamian Dollar", f:"🇧🇸"}, {c:"BMD", n:"Bermudian Dollar", f:"🇧🇲"}, {c:"BZD", n:"Belize Dollar", f:"🇧🇿"},
                    {c:"KYD", n:"Cayman Islands Dollar", f:"🇰🇾"}, {c:"CUP", n:"Cuban Peso", f:"🇨🇺"}, {c:"HTG", n:"Haitian Gourde", f:"🇭🇹"},
                    {c:"GYD", n:"Guyanese Dollar", f:"🇬🇾"}, {c:"SRD", n:"Surinamese Dollar", f:"🇸🇷"}, {c:"FKP", n:"Falkland Islands £", f:"🇫🇰"},
                    {c:"GIP", n:"Gibraltar Pound", f:"🇬🇮"}, {c:"SHP", n:"Saint Helena Pound", f:"🇸🇭"}, {c:"IMP", n:"Isle of Man Pound", f:"🇮🇲"},
                    {c:"JEP", n:"Jersey Pound", f:"🇯🇪"}, {c:"GGP", n:"Guernsey Pound", f:"🇬🇬"}, {c:"SOS", n:"Somali Shilling", f:"🇸🇴"},
                    {c:"DJF", n:"Djiboutian Franc", f:"🇩🇯"}, {c:"KMF", n:"Comorian Franc", f:"🇰🇲"}, {c:"ERN", n:"Eritrean Nakfa", f:"🇪🇷"},
                    {c:"SDG", n:"Sudanese Pound", f:"🇸🇩"}, {c:"SSP", n:"South Sudanese £", f:"🇸🇸"}, {c:"BIF", n:"Burundian Franc", f:"🇧🇮"},
                    {c:"CDF", n:"Congolese Franc", f:"🇨🇩"}, {c:"CVE", n:"Cape Verdean Escudo", f:"🇨🇻"}, {c:"GMD", n:"Gambian Dalasi", f:"🇬🇲"},
                    {c:"GNF", n:"Guinean Franc", f:"🇬🇳"}, {c:"LRD", n:"Liberian Dollar", f:"🇱🇷"}, {c:"SLL", n:"Sierra Leonean Leone", f:"🇸🇱"},
                    {c:"STN", n:"São Tomé and Príncipe", f:"🇸🇹"}, {c:"TJS", n:"Tajikistani Somoni", f:"🇹🇯"}, {c:"KGS", n:"Kyrgyzstani Som", f:"🇰🇬"}
                ],

                initListener: function() {
                    // Global input handler for Enter key
                    const inputs = [document.getElementById('inp-from'), document.getElementById('inp-to')];
                    inputs.forEach(inp => {
                        if(inp) inp.addEventListener('keypress', (e) => {
                            if(e.key === 'Enter') {
                                e.preventDefault();
                                inp.blur(); // Blur triggers the input evaluation naturally
                            }
                        });
                    });

                    window.addEventListener('qs-tool-opened', (e) => {
                        if(e.detail && e.detail.tool === 'currency_suites/fiat_converter.js') {
                            this.updateUIBoxes();
                            this.fetchLiveRates();
                        }
                    });
                    
                    // Standalone Boot
                    if(document.readyState === 'complete' || document.readyState === 'interactive'){
                         setTimeout(() => this.bootStandalone(), 100);
                    } else {
                         document.addEventListener('DOMContentLoaded', () => this.bootStandalone());
                    }
                },

                bootStandalone: function() {
                    if(document.getElementById('inp-from')) {
                        this.updateUIBoxes();
                        this.fetchLiveRates();
                    }
                },

                // --- PLATINUM FEATURE: Live Open Exchange API ---
                fetchLiveRates: async function() {
                    const updText = document.getElementById('live-upd-text');
                    if(updText) {
                        updText.innerText = "Fetching live market rates...";
                        updText.style.color = "#f59e0b";
                    }

                    try {
                        // Free, no API key required, reliable for 161 currencies
                        const res = await fetch(`https://open.er-api.com/v6/latest/${this.fromCode}`);
                        const data = await res.json();

                        if(data.result === "success") {
                            this.ratesCache = data.rates;
                            this.lastUpdate = new Date(data.time_last_update_unix * 1000);
                            
                            if(updText) {
                                const timeStr = this.lastUpdate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                                updText.innerText = `Last Updated: Today, ${timeStr}`;
                                updText.style.color = "#10b981";
                            }
                            
                            this.calc('from'); // Recalculate with new rates
                        } else {
                            throw "API Error";
                        }
                    } catch(e) {
                        if(updText) {
                            updText.innerText = "Offline Mode - Using cached rates (if available)";
                            updText.style.color = "#ef4444";
                        }
                        console.error("Forex API Error: ", e);
                    }
                },

                calc: function(source) {
                    const inpFrom = document.getElementById('inp-from');
                    const inpTo = document.getElementById('inp-to');
                    const rateText = document.getElementById('live-rate-text');

                    // If API hasn't loaded yet
                    if(!this.ratesCache[this.toCode]) return;

                    const rate = this.ratesCache[this.toCode]; // Rate is relative to 'fromCode' since we fetched base=fromCode
                    
                    // Format exchange rate for info bar
                    let dispRate = rate < 1 ? rate.toFixed(4) : rate.toFixed(2);
                    if(rateText) rateText.innerHTML = `1 ${this.fromCode} = <span class="rate-hl">${dispRate} ${this.toCode}</span>`;

                    if(source === 'from') {
                        let val = parseFloat(inpFrom.value) || 0;
                        let converted = val * rate;
                        if(inpTo) inpTo.value = converted === 0 ? "" : (converted % 1 === 0 ? converted : converted.toFixed(2));
                    } else {
                        let val = parseFloat(inpTo.value) || 0;
                        let converted = val / rate;
                        if(inpFrom) inpFrom.value = converted === 0 ? "" : (converted % 1 === 0 ? converted : converted.toFixed(2));
                    }
                },

                swapCurrencies: function() {
                    let temp = this.fromCode;
                    this.fromCode = this.toCode;
                    this.toCode = temp;
                    
                    this.updateUIBoxes();
                    
                    // Swap inputs
                    let inpFrom = document.getElementById('inp-from');
                    let inpTo = document.getElementById('inp-to');
                    if(inpFrom && inpTo) {
                        let tempVal = inpFrom.value;
                        inpFrom.value = inpTo.value;
                        inpTo.value = tempVal;
                    }

                    if(window.doHaptic) window.doHaptic();

                    // We must re-fetch rates because the base currency changed
                    this.fetchLiveRates();
                },

                updateUIBoxes: function() {
                    let fromObj = this.currencies.find(c => c.c === this.fromCode) || this.currencies[0];
                    let toObj = this.currencies.find(c => c.c === this.toCode) || this.currencies[3]; // INR default

                    let flagFrom = document.getElementById('flag-from');
                    let codeFrom = document.getElementById('code-from');
                    let nameFrom = document.getElementById('name-from');
                    if(flagFrom) flagFrom.innerText = fromObj.f;
                    if(codeFrom) codeFrom.innerText = fromObj.c;
                    if(nameFrom) nameFrom.innerText = fromObj.n;

                    let flagTo = document.getElementById('flag-to');
                    let codeTo = document.getElementById('code-to');
                    let nameTo = document.getElementById('name-to');
                    if(flagTo) flagTo.innerText = toObj.f;
                    if(codeTo) codeTo.innerText = toObj.c;
                    if(nameTo) nameTo.innerText = toObj.n;
                },

                // --- PLATINUM FEATURE: Bottom Sheet Searchable Modal ---
                openSelector: function(mode) {
                    this.targetMode = mode;
                    let searchInp = document.getElementById('cm-search-inp');
                    if(searchInp) searchInp.value = "";
                    this.filterList(); // Renders full list initially
                    
                    const modal = document.getElementById('curr-modal');
                    if(modal) {
                        modal.style.display = 'flex';
                        // Slight delay to allow display:flex to apply before adding class for transform animation
                        setTimeout(() => { modal.classList.add('cm-open'); }, 10);
                        
                        // Focus search box automatically for quick typing
                        setTimeout(() => { if(searchInp) searchInp.focus(); }, 300);
                    }
                    if(window.doHaptic) window.doHaptic();
                },

                closeSelector: function() {
                    const modal = document.getElementById('curr-modal');
                    if(modal) {
                        modal.classList.remove('cm-open');
                        setTimeout(() => { modal.style.display = 'none'; }, 300);
                    }
                    if(window.doHaptic) window.doHaptic();
                },

                filterList: function() {
                    const searchInp = document.getElementById('cm-search-inp');
                    const q = searchInp ? searchInp.value.toLowerCase() : "";
                    const listObj = document.getElementById('cm-list-box');
                    if(!listObj) return;
                    
                    listObj.innerHTML = '';

                    let filtered = this.currencies.filter(c => 
                        c.n.toLowerCase().includes(q) || c.c.toLowerCase().includes(q)
                    );

                    if(filtered.length === 0) {
                        listObj.innerHTML = `<div style="text-align:center; color:#64748b; padding:20px;">No currency found.</div>`;
                        return;
                    }

                    filtered.forEach(c => {
                        let div = document.createElement('div');
                        div.className = "cl-item";
                        div.setAttribute('role', 'option');
                        div.setAttribute('tabindex', '0');
                        div.onclick = () => this.selectCurrency(c.c);
                        div.onkeydown = (e) => {
                            if(e.key === 'Enter' || e.key === ' ') {
                                e.preventDefault();
                                this.selectCurrency(c.c);
                            }
                        };
                        div.innerHTML = `
                            <span class="cl-flag">${c.f}</span>
                            <div class="cl-details">
                                <span class="cl-code">${c.c}</span>
                                <span class="cl-name">${c.n}</span>
                            </div>
                        `;
                        listObj.appendChild(div);
                    });
                },

                selectCurrency: function(code) {
                    if(this.targetMode === 'from') {
                        if (this.toCode === code) this.swapCurrencies(); // Prevent same currency
                        else this.fromCode = code;
                    } else {
                        if (this.fromCode === code) this.swapCurrencies();
                        else this.toCode = code;
                    }

                    this.updateUIBoxes();
                    this.closeSelector();
                    
                    // Re-fetch rates if base ('from') changed, else just calc
                    if(this.targetMode === 'from') this.fetchLiveRates();
                    else this.calc('from');
                },

                // --- THE "WHY" FEATURE: Forex Mechanics ---
                showSteps: function() {
                    const contentBox = document.getElementById('fc-steps-content');
                    if(!contentBox) return;
                    
                    let html = `
                        <div style="margin-bottom:15px; border-left:3px solid #3b82f6; padding-left:10px;">
                            <span style="color:#3b82f6; font-weight:bold;">The Mid-Market Rate:</span><br>
                            The rate you see here is the <b>Interbank Rate</b>. This is the real, wholesale price that banks use to trade with each other.
                        </div>
                        
                        <div style="background:#020617; border:1px solid #334155; border-radius:8px; padding:15px; margin-top:10px;">
                            <span style="color:#f59e0b; font-weight:bold;"><i class="fas fa-user-secret"></i> The Bank's Dirty Secret:</span><br>
                            <p style="margin-top:5px; font-size:0.8rem; color:#94a3b8;">When you send money abroad or use a credit card internationally, banks <b>NEVER</b> give you this rate. They add a hidden "Spread" (markup) of 2% to 5%.</p>
                            
                            <div style="background:rgba(239,68,68,0.1); border-left:2px solid #ef4444; padding:8px; margin-top:10px; color:#f8fafc; font-size:0.75rem;">
                                <b>Example:</b> If real rate is 1 USD = 83 INR.<br>
                                The bank will charge you 85 INR per USD, pocketing 2 INR on every single dollar you spend!
                            </div>
                        </div>

                        <div style="margin-top:15px; font-size:0.75rem; color:#10b981; text-align:center; font-weight:bold;">
                            *Use the "Hidden Bank Fees" tool on the dashboard to calculate exactly how much your bank is looting!
                        </div>
                    `;
                    
                    contentBox.innerHTML = html;

                    const modal = document.getElementById('fc-steps-modal');
                    const box = document.getElementById('fc-steps-box');
                    if(modal && box) {
                        modal.style.display = 'flex';
                        setTimeout(() => {
                            modal.style.opacity = '1';
                            box.style.transform = 'translateY(0)';
                        }, 10);
                    }
                    if(window.doHaptic) window.doHaptic();
                },

                hideSteps: function() {
                    const modal = document.getElementById('fc-steps-modal');
                    const box = document.getElementById('fc-steps-box');
                    if(modal && box) {
                        modal.style.opacity = '0';
                        box.style.transform = 'translateY(20px)';
                        setTimeout(() => { modal.style.display = 'none'; }, 300);
                    }
                    if(window.doHaptic) window.doHaptic();
                }
            };

            window.QS_Fiat.initListener();
        })();
    </script>
