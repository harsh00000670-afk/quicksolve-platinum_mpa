                    {c:"TOP", n:"Tongan Paʻanga", f:"🇹🇴"}, {c:"VUV", n:"Vanuatu Vatu", f:"🇻🇺"}, {c:"SBD", n:"Solomon Islands $", f:"🇸🇧"},
                    {c:"MOP", n:"Macanese Pataca", f:"🇲🇴"}, {c:"TWD", n:"Taiwan Dollar", f:"🇹🇼"}, {c:"MNT", n:"Mongolian Tögrög", f:"🇲🇳"},
                    {c:"SYP", n:"Syrian Pound", f:"🇸🇾"}, {c:"YER", n:"Yemeni Rial", f:"🇾🇪"}, {c:"SCR", n:"Seychellois Rupee", f:"🇸🇨"},
                    {c:"MUR", n:"Mauritian Rupee", f:"🇲🇺"}, {c:"MGA", n:"Malagasy Ariary", f:"🇲🇬"}, {c:"MWK", n:"Malawian Kwacha", f:"🇲🇼"},
                    {c:"NAD", n:"Namibian Dollar", f:"🇳🇦"}, {c:"BWP", n:"Botswana Pula", f:"🇧🇼"}, {c:"SZL", n:"Swazi Lilangeni", f:"🇸🇿"},
                    {c:"LSL", n:"Lesotho Loti", f:"🇱🇸"}, {c:"ANG", n:"Neth. Antillean Guilder", f:"🇨🇼"}, {c:"AWG", n:"Aruban Florin", f:"🇦🇼"},
                    {c:"BSD", n:"Bahamian Dollar", f:"🇧🇸"}, {c:"BMD", n:"Bermudian Dollar", f:"🇧🇲"}, {c:"BZD", n:"Belize Dollar", f:"🇧🇿"},
                    {c:"KYD", n:"Cayman Islands Dollar", f:"🇰🇾"}, {c:"CUP", n:"Cuban Peso", f:"🇨🇺"}, {c:"HTG", n:"Haitian Gourde", f:"🇭🇹"},
                    {c:"GYD", n:"Guyanese Dollar", f:"🇬🇾"}, {c:"SRD", n:"Surinamese Dollar", f:"🇸🇷"}, {c:"FKP", n:"Falkland Islands £", f:"🇫🇰"},
                    {c:"GIP", n:"Gibraltar Pound", f:"🇬🇮"}, {c:"SHP", n:"Saint Helena Pound", f:"🇸🇭"}, {c:"IMP", n:"Isle of Man Pound", f:"🇮🇲"},
                    {c:"JEP", n:"Jersey Pound", f:"🇯🇪"}, {c:"GGP", n:"Guernsey Pound", f:"🇬🇬"}, {c:"SOS", n:"Somali Shilling", f:"🇸🇴"},
                    {c:"DJF", n:"Djiboutian Franc", f:"🇩🇯"}, {c:"KMF", n:"Comorian Franc", f:"🇰🇲"}, {c:"ERN", n:"Eritrean Nakfa", f:"🇪🇷"},
                    {c:"SDG", n:"Sudanese Pound", f:"🇸🇩"}, {c:"SSP", n:"South Sudanese £", f:"🇸🇸"}, {c:"BIF", n:"Burundian Franc", f:"🇧🇮"},
                    {c:"CDF", n:"Congolese Franc", f:"🇨🇩"}, {c:"CVE", n:"Cape Verdean Escudo", f:"🇨🇻"}, {c:"GMD", n:"Gambian Dalasi", f:"🇬🇲"},
                    {c:"GNF", n:"Guinean Franc", f:"🇬🇳"}, {c:"LRD", n:"Liberian Dollar", f:"🇱🇷"}, {c:"SLL", n:"Sierra Leonean Leone", f:"🇸🇱"},
                    {c:"STN", n:"São Tomé and Príncipe", f:"🇸🇹"}, {c:"TJS", n:"Tajikistani Somoni", f:"🇹🇯"}, {c:"KGS", n:"Kyrgyzstani Som", f:"🇰🇬"}
                ],

                initListener: function() {
                    // Laptop Keyboard 'Enter' Binding
                    const amtInput = document.getElementById("base-amt");
                    if(amtInput) {
                        amtInput.addEventListener("keypress", function(event) {
                            if (event.key === "Enter") { 
                                event.preventDefault(); 
                                window.QS_Watchlist.calcAll(); 
                                amtInput.blur();
                            }
                        });
                    }

                    window.addEventListener('qs-tool-opened', (e) => {
                        if(e.detail && e.detail.tool === 'currency_suites/watchlist.js') {
                            this.loadMemory();
                            this.updateBaseUI();
                            this.fetchLiveRates();
                        }
                    });

                    // Standalone Boot for direct access
                    if(document.readyState === 'complete' || document.readyState === 'interactive'){
                         setTimeout(() => { this.loadMemory(); this.updateBaseUI(); this.fetchLiveRates(); }, 100);
                    } else {
                         document.addEventListener('DOMContentLoaded', () => { this.loadMemory(); this.updateBaseUI(); this.fetchLiveRates(); });
                    }
                },

                // --- PLATINUM FEATURE: LocalStorage Memory ---
                loadMemory: function() {
                    try {
                        const savedList = localStorage.getItem('qs_watchlist');
                        const savedBase = localStorage.getItem('qs_wl_base');
                        
                        if (savedList) this.myList = JSON.parse(savedList);
                        if (savedBase) this.baseCode = savedBase;
                    } catch(e) {
                        console.error("Watchlist Memory Error: ", e);
                    }
                },

                saveMemory: function() {
                    try {
                        localStorage.setItem('qs_watchlist', JSON.stringify(this.myList));
                        localStorage.setItem('qs_wl_base', this.baseCode);
                    } catch(e) {
                        console.warn("Could not save to LocalStorage");
                    }
                },

                updateBaseUI: function() {
                    let bObj = this.currencies.find(c => c.c === this.baseCode) || this.currencies[0];
                    if(document.getElementById('base-flag')) document.getElementById('base-flag').innerText = bObj.f;
                    if(document.getElementById('base-code')) document.getElementById('base-code').innerText = bObj.c;
                },

                // --- PLATINUM FEATURE: 1-to-N Live Fetch ---
                fetchLiveRates: async function() {
                    const syncIcon = document.getElementById('sync-icon');
                    const updText = document.getElementById('wl-upd-time');
                    
                    if(syncIcon) syncIcon.classList.add('fa-spin');
                    if(updText) updText.innerText = "Syncing with global markets...";

                    try {
                        const res = await fetch(`https://open.er-api.com/v6/latest/${this.baseCode}`);
                        const data = await res.json();

                        if(data.result === "success") {
                            this.ratesCache = data.rates;
                            const date = new Date(data.time_last_update_unix * 1000);
                            if(updText) updText.innerText = `Live Rates • ${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                            this.calcAll(); // Render the board
                        }
                    } catch(e) {
                        if(updText) updText.innerText = "Offline. Connect to internet.";
                    } finally {
                        if(syncIcon) syncIcon.classList.remove('fa-spin');
                    }
                },

                // Calculates all cards simultaneously
                calcAll: function() {
                    const amtEl = document.getElementById('base-amt');
                    if(!amtEl) return;
                    const amt = parseFloat(amtEl.value) || 0;
                    
                    const grid = document.getElementById('wl-grid');
                    if(!grid) return;
                    grid.innerHTML = '';

                    if (Object.keys(this.ratesCache).length === 0) return;

                    this.myList.forEach(code => {
                        // Don't show base code in watchlist
                        if (code === this.baseCode) return;

                        let cObj = this.currencies.find(c => c.c === code);
                        if (!cObj) return;

                        let rate = this.ratesCache[code] || 0;
                        let finalVal = (amt * rate);
                        
                        // Smart formatting
                        let dispVal = finalVal === 0 ? "0.00" : (finalVal % 1 === 0 ? finalVal.toLocaleString('en-US') : finalVal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}));
                        let dispRate = rate < 1 ? rate.toFixed(4) : rate.toFixed(2);

                        let card = document.createElement('div');
                        card.className = 'wl-card';
                        card.innerHTML = `
                            <div class="wl-left">
                                <span class="wl-flag" aria-hidden="true">${cObj.f}</span>
                                <div class="wl-info">
                                    <span class="wl-code">${cObj.c}</span>
                                    <span class="wl-name">${cObj.n}</span>
                                </div>
                            </div>
                            <div class="wl-right">
                                <span class="wl-val">${dispVal}</span>
                                <span class="wl-rate">1 ${this.baseCode} = ${dispRate}</span>
                            </div>
                            <button class="wl-delete" onclick="QS_Watchlist.removeCurrency('${cObj.c}')" aria-label="Remove ${cObj.c} from Watchlist">
                                <i class="fas fa-trash" aria-hidden="true"></i>
                            </button>
                        `;
                        
                        grid.appendChild(card);
                    });
                },

                removeCurrency: function(code) {
                    this.myList = this.myList.filter(c => c !== code);
                    this.saveMemory();
                    this.calcAll(); // Re-render
                    if(window.doHaptic) window.doHaptic();
                },

                // --- PLATINUM FEATURE: Bottom Sheet Modal ---
                openSelector: function(mode) {
                    this.targetMode = mode; // 'base' or 'add'
                    let searchInp = document.getElementById('cm-search-inp');
                    if(searchInp) searchInp.value = "";
                    this.filterList(); 
                    
                    const modal = document.getElementById('wl-modal');
                    if(modal) {
                        modal.style.display = 'flex';
                        setTimeout(() => { modal.classList.add('cm-open'); }, 10);
                        setTimeout(() => { if(searchInp) searchInp.focus(); }, 300);
                    }
                    if(window.doHaptic) window.doHaptic();
                },

                closeSelector: function() {
                    const modal = document.getElementById('wl-modal');
                    if(modal) {
                        modal.classList.remove('cm-open');
                        setTimeout(() => { modal.style.display = 'none'; }, 300);
                    }
                    if(window.doHaptic) window.doHaptic();
                },

                filterList: function() {
                    const searchInp = document.getElementById('cm-search-inp');
                    const q = searchInp ? searchInp.value.toLowerCase() : "";
                    const listObj = document.getElementById('cm-list-box');
                    if(!listObj) return;
                    listObj.innerHTML = '';

                    let filtered = this.currencies.filter(c => 
                        c.n.toLowerCase().includes(q) || c.c.toLowerCase().includes(q)
                    );

                    // If in "add" mode, filter out already added ones AND base currency
                    if (this.targetMode === 'add') {
                        filtered = filtered.filter(c => !this.myList.includes(c.c) && c.c !== this.baseCode);
                    }

                    if(filtered.length === 0) {
                        listObj.innerHTML = `<div style="text-align:center; color:#64748b; padding:20px;">No options available.</div>`;
                        return;
                    }

                    filtered.forEach(c => {
                        let div = document.createElement('div');
                        div.className = "cl-item";
                        div.setAttribute('role', 'option');
                        div.setAttribute('tabindex', '0');
                        div.onclick = () => this.selectCurrency(c.c);
                        div.onkeydown = (event) => {
                            if(event.key === 'Enter' || event.key === ' ') {
                                event.preventDefault();
                                this.selectCurrency(c.c);
                            }
                        };
                        div.innerHTML = `
                            <span class="cl-flag">${c.f}</span>
                            <div class="cl-details">
                                <span class="cl-code">${c.c}</span>
                                <span class="cl-name">${c.n}</span>
                            </div>
                        `;
                        listObj.appendChild(div);
                    });
                },

                selectCurrency: function(code) {
                    if(this.targetMode === 'base') {
                        this.baseCode = code;
                        this.updateBaseUI();
                        this.saveMemory();
                        this.fetchLiveRates(); // Must fetch new base API
                    } else if (this.targetMode === 'add') {
                        this.myList.push(code);
                        this.saveMemory();
                        this.calcAll(); // Just re-render
                    }
                    this.closeSelector();
                },

                // --- THE "WHY" VISUALIZER ---
                showSteps: function() {
                    const contentBox = document.getElementById('wl-steps-content');
                    if(!contentBox) return;

                    let html = `
                        <div style="margin-bottom:15px; border-left:3px solid #f59e0b; padding-left:10px;">
                            <span style="color:#f59e0b; font-weight:bold;">The Global Currency Market:</span><br>
                            Foreign Exchange (Forex) operates as a decentralized global market where the relative values of currencies are continuously established.
                        </div>
                        
                        <div style="background:#020617; border:1px solid #334155; border-radius:8px; padding:15px; margin-top:10px;">
                            <span style="color:#10b981; font-weight:bold; font-size:0.8rem; text-transform:uppercase;">Currency Pair Classifications</span>
                            
                            <p style="margin-top:8px; font-size:0.8rem; color:#f8fafc;">
                                <b>Major Pairs:</b> Consist of globally dominant currencies paired with the USD (e.g., EUR/USD, GBP/USD, USD/JPY). Characterized by high liquidity and narrow spreads.
                            </p>
                            
                            <p style="margin-top:8px; font-size:0.8rem; color:#94a3b8;">
                                <b>Exotic Pairs:</b> Formed by pairing a major currency with that of a developing or emerging economy (e.g., USD/INR, USD/TRY). Characterized by higher volatility, lower liquidity, and wider institutional spreads.
                            </p>
                        </div>
                        <div style="margin-top:15px; font-size:0.75rem; color:var(--text-muted); text-align:center;">
                            *Exchange rates are subject to continuous fluctuation influenced by macroeconomic indicators, central bank policies, and geopolitical events.
                        </div>
                    `;
                    
                    contentBox.innerHTML = html;

                    const modal = document.getElementById('wl-steps-modal');
                    const box = document.getElementById('wl-steps-box');
                    if(modal && box) {
                        modal.style.display = 'flex';
                        setTimeout(() => {
                            modal.style.opacity = '1';
                            box.style.transform = 'translateY(0)';
                        }, 10);
                    }
                    if(window.doHaptic) window.doHaptic();
                },

                hideSteps: function() {
                    const modal = document.getElementById('wl-steps-modal');
                    const box = document.getElementById('wl-steps-box');
                    if(modal && box) {
                        modal.style.opacity = '0';
                        box.style.transform = 'translateY(20px)';
                        setTimeout(() => { modal.style.display = 'none'; }, 300);
                    }
                    if(window.doHaptic) window.doHaptic();
                }
            };

            window.QS_Watchlist.initListener();
        })();
    </script>
</body>
</html>
