<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    


    
    <meta http-equiv="Cache-Control" content="max-age=3600, must-revalidate">
    
    <title>Loan Prepayment Calculator | Save Interest & Reduce Tenure | QuickSolve Platinum</title>
    <meta name="description" content="Calculate exactly how much interest and time you save by prepaying your loan. Simulate one-time, monthly, or yearly prepayment strategies effortlessly. 100% Private, Secure, and Offline.">
    <meta name="keywords" content="loan prepayment calculator, EMI prepayment, reduce loan tenure, save loan interest, foreclosure calculator, smart EMI prepay, home loan savings, QuickSolve Platinum">
    <meta name="author" content="Harsh - QuickSolve Team">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://quicksolve-platinum.netlify.app/loan_suite/prepay.html">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0f172a">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="QuickSolve Platinum">
    <meta property="og:title" content="Loan Prepayment Engine - Save Years of Debt">
    <meta property="og:description" content="Discover how small prepayments can save you lakhs in interest and reduce your loan tenure by years.">
    <meta property="og:image" content="../logo.png">
    
    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="../assets/css/all.min.css">
    <link rel="stylesheet" href="../style.css">

    <style>
        /* MANTRA: NO PADDING/MARGIN CHANGES - DESIGN RETAINED EXACTLY */
        /* =========================================
           PREPAY MASTER ENGINE - SSJ4 Independent
           Theme: Deep Slate / Neon Green (Savings) Fusion
           ========================================= */
        body { 
            margin: 0; 
            background-color: var(--bg-body, #0f172a); 
            /* Using your new Local JetBrains Mono font */
            font-family: var(--font-main, sans-serif);
        }

        #mod-prepay-overlay {
            width: 100vw; min-height: 100vh; 
            background-color: var(--bg-body, #0f172a); 
            display: flex; flex-direction: column;
            font-family: var(--font-main, sans-serif);
            overflow: hidden; animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 1. HEADER */
        .s-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 15px; background: var(--surface, #1e293b); border-bottom: 1px solid var(--border, #334155);
            flex-shrink: 0; position: sticky; top: 0; z-index: 10;
        }
        .s-head .qs-back-btn { background: none; border: none; color: var(--text-main, #f1f5f9); font-size: 1.2rem; cursor: pointer; padding: 5px; text-decoration: none; }
        .s-head .s-tit { 
            color: #10b981; /* Green for Prepay/Savings */
            font-weight: 800; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px;
        }

        /* 2. BODY */
        .s-body {
            flex: 1; overflow-y: auto; padding: 15px;
            padding-bottom: 80px; 
            display: flex; flex-direction: column; gap: 12px;
        }

        /* 3. INPUT COMPONENTS (Matched with Standard EMI) */
        .lbl { color: var(--text-muted, #94a3b8); font-size: 0.7rem; font-weight: 700; margin-bottom: 5px; display: block; text-transform: uppercase; }
        
        .inp-box {
            background: var(--surface, #1e293b); border: 1px solid var(--border, #334155); border-radius: 8px;
            padding: 10px 12px; transition: border-color 0.2s;
        }
        .inp-box:focus-within { border-color: #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.1); }
        
        .inp-flex { display: flex; align-items: center; gap: 8px; }
        .inp-unit { color: #10b981; font-weight: 800; font-size: 1rem; }
        .inp-main {
            flex: 1; background: transparent; border: none; color: var(--text-main, #fff); 
            font-size: 1.15rem; font-family: var(--font-main); outline: none; width: 100%; min-width: 0;
        }
        .inp-main:focus { color: #10b981; }
        .inp-main::placeholder { color: #475569; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* Custom Dropdown */
        .cust-select {
            background: rgba(2, 6, 23, 0.5); color: #10b981; border: 1px solid var(--border);
            border-radius: 6px; padding: 6px 24px 6px 10px; font-weight: 700; font-size: 0.8rem;
            appearance: none; -webkit-appearance: none; cursor: pointer; outline: none;
            min-width: 80px; text-align: left;
        }
        
        /* Strategy Dropdown (Bigger Text) */
        .strat-select {
            color: #f59e0b; width: 100%; text-align: center; padding: 8px;
        }

        /* 4. RESULTS CARD (Focus on Savings) */
        .res-card {
            background: rgba(15, 23, 42, 0.5); 
            border: 2px solid; border-image: linear-gradient(45deg, #10b981, #38bdf8) 1; 
            border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 12px;
            margin-top: 5px; text-align: center;
        }
        
        .save-box { background: var(--surface); border: 1px dashed #10b981; border-radius: 8px; padding: 15px; }
        .save-lbl { font-size: 0.75rem; text-transform: uppercase; color: #10b981; font-weight: 800; letter-spacing: 1px; }
        .save-val { font-size: 2rem; font-weight: 800; color: #10b981; margin-top: 5px; }
        
        .impact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; }
        .imp-item { background: rgba(2, 6, 23, 0.5); padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
        .imp-lbl { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }
        .imp-val { font-size: 1.1rem; font-weight: 800; color: #38bdf8; margin-top: 3px; }

        /* 5. STICKY BOTTOM */
        .sticky-bottom {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: var(--surface); border-top: 1px solid #10b981;
            padding: 10px 15px; display: flex; gap: 10px; z-index: 20;
            box-sizing: border-box;
        }
        .btn-sch {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px; background: rgba(16, 185, 129, 0.1); color: #10b981; 
            border: none; border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 0.95rem;
        }
        .btn-sch:active { transform: scale(0.98); background: rgba(16, 185, 129, 0.2); }

        /* SCHEDULE MODAL CSS COMBINED HERE FOR CLEANLINESS */
        #sch-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-body); z-index:50; flex-direction:column; animation:slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        #sch-body td { padding:12px 4px; border-bottom:1px solid var(--border); color: var(--text-main); }
        #sch-body tr:nth-child(even) { background: rgba(30, 41, 59, 0.4); }
    </style>
</head>

<body>

<main id="mod-prepay-overlay" role="main">
    
    <header class="s-head" role="banner">
        <a href="../loan.html" class="qs-back-btn" aria-label="Go back to Loan Dashboard">
            <i class="fas fa-arrow-left" aria-hidden="true"></i>
        </a>
        <h1 class="s-tit"><i class="fas fa-rocket" aria-hidden="true"></i> PREPAY MASTER</h1>
        <div style="width:24px;"></div> 
    </header>

    <div class="s-body">

        <section aria-labelledby="existing-loan-heading">
            <h2 id="existing-loan-heading" class="sr-only" style="display:none;">Existing Loan Details</h2>
            <div class="grid-2">
                <div class="inp-box">
                    <label for="pre-emi" class="lbl">Existing EMI</label>
                    <div class="inp-flex">
                        <span class="inp-unit" aria-hidden="true">₹</span>
                        <input type="number" id="pre-emi" class="inp-main" placeholder="25,000" aria-label="Enter existing EMI amount" oninput="QS_Prepay.calc()">
                    </div>
                </div>
                <div class="inp-box">
                    <label for="pre-rate" class="lbl">Interest Rate (R)</label>
                    <div class="inp-flex">
                        <span class="inp-unit" aria-hidden="true">%</span>
                        <input type="number" id="pre-rate" class="inp-main" placeholder="8.5" step="0.1" aria-label="Enter annual interest rate" oninput="QS_Prepay.calc()">
                    </div>
                </div>
            </div>

            <div class="inp-box">
                <label for="pre-tenure" class="lbl">Remaining Tenure</label>
                <div class="inp-flex">
                    <input type="number" id="pre-tenure" class="inp-main" placeholder="120" aria-label="Enter remaining loan tenure" oninput="QS_Prepay.calc()">
                    <div style="position:relative;">
                        <select id="pre-tenure-type" class="cust-select" aria-label="Select tenure format" onchange="QS_Prepay.calc()">
                            <option value="M" selected>Months</option>
                            <option value="Y">Years</option>
                            <option value="W">Weeks</option>
                        </select>
                        <i class="fas fa-chevron-down" style="position:absolute; right:8px; top:50%; transform:translateY(-50%); color:#10b981; font-size:0.6rem; pointer-events:none;" aria-hidden="true"></i>
                    </div>
                </div>
            </div>
        </section>

        <section aria-labelledby="prepayment-strategy-heading">
            <h2 id="prepayment-strategy-heading" class="sr-only" style="display:none;">Prepayment Strategy</h2>
            <div class="inp-box" style="border-color: #38bdf8;">
                <label for="pre-amt" class="lbl" style="color: #38bdf8;">Prepayment Amount</label>
                <div class="inp-flex">
                    <span class="inp-unit" style="color: #38bdf8;" aria-hidden="true">₹</span>
                    <input type="number" id="pre-amt" class="inp-main" placeholder="50,000" aria-label="Enter prepayment amount" oninput="QS_Prepay.calc()">
                </div>
            </div>

            <div class="grid-2">
                <div class="inp-box">
                    <label for="pre-type" class="lbl">Frequency</label>
                    <div style="position:relative; margin-top: 5px;">
                        <select id="pre-type" class="cust-select strat-select" aria-label="Select prepayment frequency" onchange="QS_Prepay.calc()">
                            <option value="once" selected>One-Time</option>
                            <option value="monthly">Monthly</option>
                            <option value="yearly">Yearly</option>
                            <option value="weekly">Weekly</option>
                        </select>
                        <i class="fas fa-chevron-down" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); color:#10b981; font-size:0.6rem; pointer-events:none;" aria-hidden="true"></i>
                    </div>
                </div>

                <div class="inp-box">
                    <label for="pre-strat" class="lbl">Strategy</label>
                    <div style="position:relative; margin-top: 5px;">
                        <select id="pre-strat" class="cust-select strat-select" style="color: #f59e0b;" aria-label="Select loan adjustment strategy" onchange="QS_Prepay.calc()">
                            <option value="tenure" selected>Reduce Tenure</option>
                            <option value="emi">Reduce EMI</option>
                        </select>
                        <i class="fas fa-chevron-down" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); color:#f59e0b; font-size:0.6rem; pointer-events:none;" aria-hidden="true"></i>
                    </div>
                </div>
            </div>
        </section>

        <section class="res-card" aria-labelledby="savings-results-heading" aria-live="polite">
            <h2 id="savings-results-heading" class="sr-only" style="display:none;">Savings Impact</h2>
            
            <div class="save-box">
                <div class="save-lbl" id="save-int-lbl">Total Interest Saved</div>
                <div id="res-save-int" class="save-val" aria-labelledby="save-int-lbl">₹ --</div>
            </div>

            <div class="impact-grid">
                <div class="imp-item">
                    <div id="lbl-dyn-1" class="imp-lbl">New Tenure</div>
                    <div id="res-dyn-1" class="imp-val">-- Months</div>
                </div>
                <div class="imp-item">
                    <div id="lbl-dyn-2" class="imp-lbl">Time Saved</div>
                    <div id="res-dyn-2" class="imp-val" style="color:#f59e0b;">-- Months</div>
                </div>
            </div>

        </section>

    </div> 
    
    <div class="sticky-bottom">
        <button class="btn-sch" aria-label="View Revised Amortization Schedule" onclick="QS_Prepay.openSchedule()">
            <i class="fas fa-chart-line" aria-hidden="true"></i> View Revised Schedule
        </button>
    </div>
    
    <div id="sch-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <header class="s-head">
            <button class="qs-back-btn" aria-label="Close Schedule" onclick="QS_Prepay.closeSchedule()">
                <i class="fas fa-times" aria-hidden="true"></i>
            </button>
            <h2 id="modal-title" class="s-tit" style="margin:0;"><i class="fas fa-chart-line" aria-hidden="true"></i> REVISED SCHEDULE</h2>
            <div style="width:24px;"></div>
        </header>
        <div style="flex:1; overflow-y:auto; padding:10px; padding-bottom:50px;">
            <table style="width:100%; text-align:right; border-collapse:collapse; font-size:0.75rem; font-family:var(--font-mono, monospace);">
                <caption class="sr-only">Detailed Repayment Schedule after Prepayment</caption>
                <thead style="position:sticky; top:0; background:var(--surface); color:var(--text-muted); box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
                    <tr>
                        <th scope="col" style="padding:10px 4px; text-align:center;">Mo.</th>
                        <th scope="col" style="padding:10px 4px;">EMI</th>
                        <th scope="col" style="padding:10px 4px; color:#10b981;">Extra</th>
                        <th scope="col" style="padding:10px 4px; color:#f59e0b;">Int.</th>
                        <th scope="col" style="padding:10px 4px; color:#38bdf8;">Prin.</th>
                        <th scope="col" style="padding:10px 4px;">Bal.</th>
                    </tr>
                </thead>
                <tbody id="sch-body">
                </tbody>
            </table>
        </div>
    </div>

</main>

<script>
    /* QUICKSOLVE PLATINUM - PREPAY MASTER ENGINE (MPA STANDALONE)
       Edge-Case Hardened Version
    */
    const QS_Prepay = {
        
        init: function() {
            console.log("Prepay Master: Engine Ready 🚀");
            this.clearResults('tenure');
        },

        calc: function() {
            try {
                const emi = parseFloat(document.getElementById('pre-emi').value);
                const rInp = parseFloat(document.getElementById('pre-rate').value);
                const tInp = parseFloat(document.getElementById('pre-tenure').value);
                const tType = document.getElementById('pre-tenure-type').value;
                const preAmt = parseFloat(document.getElementById('pre-amt').value) || 0;
                const freq = document.getElementById('pre-type').value;   
                const strat = document.getElementById('pre-strat').value; 

                if (!emi || !rInp || !tInp || emi <= 0 || rInp <= 0 || tInp <= 0) {
                    this.clearResults(strat);
                    return;
                }

                const r = (rInp / 12) / 100; 
                let n = (tType === 'Y') ? tInp * 12 : (tType === 'W' ? tInp / 4.33 : tInp);
                n = Math.max(1, Math.round(n));

                // 1. REVERSE PRINCIPAL (P = E * (1 - (1+r)^-n) / r)
                const P = emi * (1 - Math.pow(1 + r, -n)) / r;

                // EDGE CASE: Negative Amortization (EMI must cover at least interest)
                if (emi <= (P * r) + 0.1) {
                    document.getElementById('res-save-int').innerText = "EMI TOO LOW";
                    document.getElementById('res-save-int').style.color = "#ef4444";
                    return;
                } else {
                    document.getElementById('res-save-int').style.color = "#10b981";
                }

                const baseTotalInt = (emi * n) - P;

                // 2. SIMULATION
                let balance = P;
                let actualMonths = 0;
                let totalIntWithPrepay = 0;
                let currentEmi = emi;
                let finalEmi = emi;

                // Safety Loop (Max 50 years to prevent browser freeze)
                for (let i = 1; i <= 600; i++) {
                    if (balance <= 0.5 || actualMonths >= n) break;

                    let interest = balance * r;
                    let extra = 0;
                    
                    // Frequency Logic
                    if (freq === 'once' && i === 1) extra = preAmt;
                    else if (freq === 'monthly') extra = preAmt;
                    else if (freq === 'yearly' && i % 12 === 0) extra = preAmt;
                    else if (freq === 'weekly') extra = preAmt * 4.33;

                    // Apply Strategy
                    if (strat === 'emi' && extra > 0) {
                        balance -= extra;
                        if (balance > 0) {
                            let remMonths = n - i + 1;
                            let x = Math.pow(1 + r, remMonths);
                            currentEmi = (balance * r * x) / (x - 1);
                        } else {
                            currentEmi = 0;
                        }
                    }

                    let principal = currentEmi - interest;
                    if (strat === 'tenure') principal += extra;

                    // Final month adjustment
                    if (principal > balance) principal = balance;

                    balance -= principal;
                    totalIntWithPrepay += interest;
                    actualMonths++;
                    finalEmi = currentEmi;
                    
                    if (balance <= 0) break;
                }

                // 3. RESULTS MATH
                let intSaved = Math.max(0, baseTotalInt - totalIntWithPrepay);
                let timeSaved = Math.max(0, n - actualMonths);

                // Update UI
                const lbl1 = document.getElementById('lbl-dyn-1');
                const lbl2 = document.getElementById('lbl-dyn-2');
                const res1 = document.getElementById('res-dyn-1');
                const res2 = document.getElementById('res-dyn-2');

                document.getElementById('res-save-int').innerText = this.fmt(intSaved);

                if (strat === 'emi') {
                    lbl1.innerText = "MINIMUM EMI";
                    res1.innerText = this.fmt(finalEmi);
                    lbl2.innerText = "EMI REDUCED BY";
                    res2.innerText = this.fmt(emi - finalEmi);
                    res2.style.color = "#10b981";
                } else {
                    lbl1.innerText = "NEW TENURE";
                    res1.innerText = this.yrs(actualMonths);
                    lbl2.innerText = "TIME SAVED";
                    res2.innerText = this.yrs(timeSaved);
                    res2.style.color = "#f59e0b";
                }

            } catch (e) {
                console.error("Prepay Engine Error: ", e);
            }
        },

        fmt: function(n) { 
            if(isNaN(n) || !isFinite(n) || n < 0) return "₹ 0";
            return "₹ " + Math.round(n).toLocaleString('en-IN'); 
        },

        yrs: function(m) {
            if(isNaN(m) || !isFinite(m) || m <= 0) return "0 Months";
            const y = Math.floor(m/12);
            const r = Math.round(m%12);
            if (y === 0) return r + " Months";
            return r > 0 ? `${y}y ${r}m` : `${y} Years`;
        },

        clearResults: function(strat) {
            document.getElementById('res-save-int').innerText = "₹ --";
            document.getElementById('res-dyn-1').innerText = "--";
            document.getElementById('res-dyn-2').innerText = "--";
        },

        triggerHaptic: function() {
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(5);
            }
        },

        openSchedule: function() {
            this.triggerHaptic();
            
            // Refresh values first
            this.calc(); 
            
            const emi = parseFloat(document.getElementById('pre-emi').value);
            const rInp = parseFloat(document.getElementById('pre-rate').value);
            const tInp = parseFloat(document.getElementById('pre-tenure').value);
            const tType = document.getElementById('pre-tenure-type').value;
            const preAmt = parseFloat(document.getElementById('pre-amt').value) || 0;
            const freq = document.getElementById('pre-type').value;
            const strat = document.getElementById('pre-strat').value;

            // Validate before opening
            if (!emi || !rInp || !tInp) return;

            const r = (rInp / 12) / 100;
            let n = (tType === 'Y') ? tInp * 12 : (tType === 'W' ? tInp / 4.33 : tInp);
            n = Math.max(1, Math.round(n));
            let balance = emi * (1 - Math.pow(1 + r, -n)) / r;
            
            let html = "";
            let currentEmi = emi;

            for (let i = 1; i <= 600; i++) {
                if (balance <= 0.5 || i > (n + 12)) break;

                let interest = balance * r;
                let extra = 0;
                if (freq === 'once' && i === 1) extra = preAmt;
                else if (freq === 'monthly') extra = preAmt;
                else if (freq === 'yearly' && i % 12 === 0) extra = preAmt;
                else if (freq === 'weekly') extra = preAmt * 4.33;

                if (strat === 'emi' && extra > 0) {
                    balance -= extra;
                    let remMonths = n - i + 1;
                    if (balance > 0 && remMonths > 0) {
                        let x = Math.pow(1 + r, remMonths);
                        currentEmi = (balance * r * x) / (x - 1);
                    } else { currentEmi = 0; }
                }

                let principal = currentEmi - interest;
                if (strat === 'tenure') principal += extra;
                
                if (principal > balance) {
                    principal = balance;
                    currentEmi = balance + interest;
                    if(strat === 'tenure') extra = 0;
                }

                balance -= principal;
                html += `<tr>
                    <td style="text-align:center;">${i}</td>
                    <td>${this.fmt(currentEmi).replace('₹ ','')}</td>
                    <td style="color:#10b981; font-weight:800;">${extra > 0 ? this.fmt(extra).replace('₹ ','') : '-'}</td>
                    <td style="color:#f59e0b;">${this.fmt(interest).replace('₹ ','')}</td>
                    <td style="color:#38bdf8;">${this.fmt(principal).replace('₹ ','')}</td>
                    <td>${this.fmt(Math.max(0, balance)).replace('₹ ','')}</td>
                </tr>`;
                if (balance <= 0) break;
            }
            document.getElementById('sch-body').innerHTML = html;
            document.getElementById('sch-modal').style.display = 'flex';
        },

        closeSchedule: function() {
            this.triggerHaptic();
            document.getElementById('sch-modal').style.display = 'none';
        }
    };

    // Auto-Init on Load
    window.onload = function() {
        QS_Prepay.init();
    };
</script>
</body>
</html>
