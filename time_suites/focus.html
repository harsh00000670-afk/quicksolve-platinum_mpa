<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta http-equiv="Cache-Control" content="max-age=3600, must-revalidate">

    <title>Focus Engine | Pomodoro Hustler | QuickSolve Platinum</title>
    <meta name="theme-color" content="#0d0a15">

    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="../assets/css/all.min.css">
    <link rel="stylesheet" href="../style.css">

    <style>
        /* =========================================
           FOCUS ENGINE - PLATINUM POMODORO (SSJ5)
           ========================================= */
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800;900&display=swap');

        :root {
            --bg-deep: #05060f;
            --card-bg: #111424;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --text-dim: #475569;
            --accent-cyan: #00d1e0;
            --accent-cyan-glow: rgba(0, 209, 224, 0.4);
            --accent-gold: #fbbd23;
            --accent-gold-glow: rgba(251, 189, 35, 0.4);
            --accent-red: #ef4444;
        }

        body { 
            margin: 0; background-color: var(--bg-deep); color: var(--text-main); 
            font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden; position: relative;
        }

        /* Ambient Glowing Background Orbs */
        .bg-glow { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.25; z-index: -1; pointer-events: none;}
        .glow-1 { top: 20%; right: -10%; width: 300px; height: 300px; background: var(--accent-cyan); }
        .glow-2 { bottom: 5%; left: -10%; width: 300px; height: 300px; background: var(--accent-gold); }

        /* HEADER - FIXED TO CENTER */
        .app-header {
            position: sticky; top: 0; z-index: 100; background: rgba(5, 6, 15, 0.9); backdrop-filter: blur(15px); 
            border-bottom: 1px solid rgba(255,255,255,0.02); padding: 15px 20px; display: flex; align-items: center; justify-content: center;
        }
        .qs-back-btn { 
            position: absolute; left: 15px; background: #1a1e36; border: none; color: var(--text-sub); width: 36px; height: 36px; 
            border-radius: 10px; display: flex; align-items: center; justify-content: center; 
            font-size: 1.1rem; cursor: pointer; transition: 0.2s; 
        }
        .qs-back-btn:active { transform: scale(0.9); color: var(--text-main); }
        .brand { color: var(--accent-cyan); font-weight: 900; font-size: 1.05rem; text-transform: uppercase; letter-spacing: 1.5px; display: flex; align-items: center; gap: 8px;}

        /* HERO */
        .hero { text-align: center; margin-bottom: 30px; padding-top: 15px;}
        .hero h1 { margin: 0; font-size: 2.2rem; color: #e2e8f0; font-weight: 900; letter-spacing: -0.5px;}
        .hero h1 span { color: #d4d4d8; }
        .hero p { color: var(--accent-cyan); font-size: 0.85rem; margin-top: 5px; font-family: 'JetBrains Mono', monospace; font-weight: 600; letter-spacing: 1px;}

        /* THE WARP CORE TIMER (EXACT SCREENSHOT MATCH) */
        .timer-display {
            position: relative; width: 280px; height: 280px; margin: 0 auto; margin-bottom: 40px;
            display: flex; align-items: center; justify-content: center;
        }
        
        .timer-svg { width: 100%; height: 100%; transform: rotate(-90deg); position: absolute; top:0; left:0;}
        .p-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 16; }
        .p-fill {
            fill: none; stroke-width: 16; stroke-linecap: round;
            stroke-dasharray: 754; /* 2*PI*R (R=120) */
            stroke-dashoffset: 754; 
            transition: stroke-dashoffset 1s linear, stroke 0.4s ease;
        }
        /* State Colors */
        .p-fill.work { stroke: var(--accent-cyan); filter: drop-shadow(0 0 12px var(--accent-cyan-glow)); }
        .p-fill.break { stroke: var(--accent-gold); filter: drop-shadow(0 0 12px var(--accent-gold-glow)); }

        .time-text {
            position: relative; font-family: 'JetBrains Mono', monospace;
            display: flex; flex-direction: column; align-items: center; z-index: 2;
        }
        .time-state-lbl { font-size: 0.9rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: var(--text-sub); margin-bottom: 2px;}
        .display-time { font-size: 4rem; font-weight: 900; color: var(--text-main); line-height: 1;}

        /* CONTROLS */
        .controls { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; }
        .ctrl-btn { 
            background: rgba(255,255,255,0.03); border: 2px solid rgba(255,255,255,0.1); color: var(--text-sub);
            width: 60px; height: 60px; border-radius: 50%; font-size: 1.4rem; cursor: pointer;
            transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .ctrl-btn:active { transform: scale(0.9); }
        .ctrl-btn.play-btn { color: var(--accent-cyan); border-color: var(--accent-cyan); box-shadow: 0 0 20px var(--accent-cyan-glow); background: rgba(0, 209, 224, 0.05);}
        .ctrl-btn.break-active { color: var(--accent-gold); border-color: var(--accent-gold); box-shadow: 0 0 20px var(--accent-gold-glow); background: rgba(251, 189, 35, 0.05);}
        
        .reset-btn:active { border-color: var(--text-main); color: var(--text-main); }

        /* CONFIG & STATS ROWS */
        .setting-row {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px;
            padding: 18px 20px; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; margin-bottom: 15px; transition: 0.2s; box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .setting-row:active { transform: scale(0.98); background: #1a1e36; }
        .sr-title { font-size: 0.9rem; font-weight: 800; color: var(--text-main); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 10px;}
        .sr-title i { color: var(--accent-cyan); font-size: 1.1rem;}
        .sr-val { font-family: 'JetBrains Mono', monospace; color: var(--text-sub); font-size: 0.95rem; font-weight: 600;}

        .stats-card {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px;
            padding: 20px; text-align: center; margin-top: 10px;
        }
        .stats-lbl { font-size: 0.8rem; color: var(--text-sub); font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 15px; display: block; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .sb-num { font-family: 'JetBrains Mono', monospace; font-size: 2.2rem; font-weight: 900; color: var(--accent-gold); margin-bottom: 5px;}
        .sb-lbl { font-size: 0.7rem; color: var(--text-dim); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;}

        /* =========================================
           CUSTOM BOTTOM SHEETS (CONFIG & MUSIC)
           ========================================= */
        .sheet-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 1000; display: none; opacity: 0; transition: 0.3s; backdrop-filter: blur(10px); }
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; background: #0c0e1a; border-top: 1px solid var(--accent-cyan); border-radius: 24px 24px 0 0; z-index: 1001; padding: 25px 20px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; box-shadow: 0 -10px 50px rgba(0, 209, 224, 0.15);}
        .sheet-overlay.show { display: block; opacity: 1; }
        .bottom-sheet.show { bottom: 0; }

        .ds-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .ds-title { color: var(--text-main); font-weight: 900; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }

        /* Timer Drum Specifics */
        .drum-grid-col2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 20px 0; position: relative; }
        .drum-column-unit { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2;}
        .ds-unit-lbl { color: var(--text-sub); font-size: 0.8rem; font-weight: 800; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1px;}
        .ds-unit-sub { color: var(--text-dim); font-size: 0.8rem; font-weight: 800; text-transform: uppercase; margin-top: 15px; font-family: 'JetBrains Mono', monospace;}
        
        .drum-column-box { display: flex; flex-direction: column; align-items: center; width: 80px; }
        .drum-btn { background: transparent; border: none; color: var(--accent-cyan); font-size: 1.8rem; padding: 5px 0; cursor: pointer; transition: 0.2s;}
        .drum-btn:active { transform: scale(0.8); }
        
        .d-list { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; margin: 10px 0; }
        .d-item { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 600; color: var(--text-dim); transition: 0.3s; }
        .d-item.active { font-size: 1.8rem; font-weight: 900; color: var(--text-main); }

        /* EXACT MATCH: Connecting Outline Box */
        .drum-highlight-box { 
            position: absolute; top: 50%; left: 5%; width: 90%; height: 60px; transform: translateY(-50%); 
            border: 2px solid var(--accent-cyan); border-radius: 16px; background: transparent; z-index: 1; pointer-events: none;
        }

        /* Music List Specifics */
        .music-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; max-height: 40vh; overflow-y: auto;}
        .m-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 16px 20px; border-radius: 12px; font-weight: 700; color: var(--text-sub); display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s;}
        .m-item:active { transform: scale(0.98); }
        .m-item.active { border-color: var(--accent-cyan); background: rgba(0, 209, 224, 0.05); color: var(--text-main); box-shadow: 0 0 15px rgba(0, 209, 224, 0.1);}
        .m-item.active i { color: var(--accent-cyan); }
        .m-item i { font-size: 1.2rem; width: 25px; text-align: center;}

        /* Sheet Buttons */
        .ds-actions { display: flex; gap: 15px; margin-top: 10px; }
        .ds-btn { flex: 1; padding: 16px; border-radius: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border: none; transition: 0.2s;}
        .ds-cancel { background: transparent; border: 1px solid var(--text-dim); color: var(--text-sub); }
        .ds-cancel:active { background: rgba(255,255,255,0.05); }
        .ds-set { background: var(--accent-cyan); color: #000; box-shadow: 0 0 20px var(--accent-cyan-glow);}
        .ds-set:active { transform: scale(0.98); }

        /* CUSTOM TOAST */
        .toast {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            border-radius: 30px; padding: 14px 28px; font-size: 0.9rem; font-weight: 900;
            text-transform: uppercase; letter-spacing: 1.5px; z-index: 9999;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; gap: 10px;
        }
        .toast.show { bottom: 40px; }
        .toast.work-toast { background: var(--accent-cyan); color: #000; box-shadow: 0 10px 30px var(--accent-cyan-glow); }
        .toast.break-toast { background: var(--accent-gold); color: #000; box-shadow: 0 10px 30px var(--accent-gold-glow); }

        /* ANIMATIONS */
        .anim-up { animation: slideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; opacity: 0; transform: translateY(30px); }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    
    <div class="toast work-toast" id="custom-toast"><i id="toast-icon" class="fas fa-hammer"></i> <span id="toast-msg">Work Done</span></div>

    <audio id="ambient-audio" loop preload="none"></audio>

    <header class="app-header">
        <button onclick="window.history.back()" class="qs-back-btn"><i class="fas fa-arrow-left"></i></button>
        <div class="brand"><i class="fas fa-fire"></i> FOCUS ENGINE</div>
    </header>

    <main style="padding: 15px; max-width: 600px; margin: 0 auto; padding-bottom: 80px;">
        
        <div class="hero anim-up" style="animation-delay: 0.1s;">
            <h1>The <span>Hustler</span></h1>
            <p>> deep_work --hustle</p>
        </div>

        <div class="timer-display anim-up" style="animation-delay: 0.15s;">
            <svg class="timer-svg" viewBox="0 0 250 250">
                <circle class="p-bg" cx="125" cy="125" r="120"></circle>
                <circle class="p-fill work" id="progress-circle" cx="125" cy="125" r="120"></circle>
            </svg>
            <div class="time-text">
                <span class="time-state-lbl" id="state-lbl">Work</span>
                <span class="display-time" id="display-time">25:00</span>
            </div>
        </div>

        <div class="controls anim-up" style="animation-delay: 0.2s;">
            <button class="ctrl-btn reset-btn" id="reset-btn" onclick="SSJ4_Focus.reset()">
                <i class="fas fa-undo"></i>
            </button>
            <button class="ctrl-btn play-btn" id="start-btn" onclick="SSJ4_Focus.togglePlay()">
                <i class="fas fa-pause" id="play-icon" style="display:none;"></i>
                <i class="fas fa-play" id="play-icon-init"></i>
            </button>
            <button class="ctrl-btn" id="skip-btn" onclick="SSJ4_Focus.skipBreak()" style="display:none; color: var(--accent-gold); border-color: var(--accent-gold);">
                <i class="fas fa-forward"></i>
            </button>
        </div>

        <div class="setting-row anim-up" style="animation-delay: 0.25s;" onclick="SSJ4_ConfigSheet.open()">
            <div class="sr-title">CUSTOMIZE CYCLES</div>
            <div style="display:flex; align-items:center; gap:15px;">
                <span class="sr-val" id="fs-cycle-val">25 / 5 Mins</span>
                <i class="fas fa-cog" style="color:var(--accent-cyan); font-size: 1.2rem;"></i>
            </div>
        </div>

        <div class="setting-row anim-up" style="animation-delay: 0.3s;" onclick="SSJ4_MusicSheet.open()">
            <div class="sr-title">FOCUS SOUND</div>
            <div style="display:flex; align-items:center; gap:15px;">
                <span class="sr-val" id="fs-music-val">None</span>
                <i class="fas fa-headphones" style="color:var(--accent-purple); font-size: 1.2rem;"></i>
            </div>
        </div>

        <div class="stats-card anim-up" style="animation-delay: 0.35s;">
            <span class="stats-lbl">HustLE REPORT (TODAY)</span>
            <div class="stats-grid">
                <div>
                    <div class="sb-num" id="stat-sessions">0</div>
                    <div class="sb-lbl">Sessions</div>
                </div>
                <div>
                    <div class="sb-num" style="color:var(--accent-cyan);" id="stat-time">0.0<small>h</small></div>
                    <div class="sb-lbl">Deep Work Time</div>
                </div>
            </div>
        </div>

    </main>

    <div class="sheet-overlay" id="cfg-overlay" onclick="SSJ4_ConfigSheet.close()"></div>
    <div class="bottom-sheet" id="cfg-sheet">
        <div class="ds-header">
            <span class="ds-title">TIMER CONFIG</span>
            <i class="fas fa-times" style="color:var(--text-sub); cursor:pointer; font-size: 1.2rem;" onclick="SSJ4_ConfigSheet.close()"></i>
        </div>

        <div class="drum-grid-col2">
            <div class="drum-highlight-box"></div>
            
            <div class="drum-column-unit">
                <div class="ds-unit-lbl">WORK TIME</div>
                <div class="drum-column-box">
                    <button class="drum-btn" onclick="SSJ4_ConfigSheet.move('w', -1)"><i class="fas fa-chevron-up"></i></button>
                    <div class="d-list" id="drum-work"></div>
                    <button class="drum-btn" onclick="SSJ4_ConfigSheet.move('w', 1)"><i class="fas fa-chevron-down"></i></button>
                </div>
                <div class="ds-unit-sub">(MINS)</div>
            </div>

            <div class="drum-column-unit">
                <div class="ds-unit-lbl">BREAK TIME</div>
                <div class="drum-column-box">
                    <button class="drum-btn" onclick="SSJ4_ConfigSheet.move('b', -1)"><i class="fas fa-chevron-up"></i></button>
                    <div class="d-list" id="drum-break"></div>
                    <button class="drum-btn" onclick="SSJ4_ConfigSheet.move('b', 1)"><i class="fas fa-chevron-down"></i></button>
                </div>
                <div class="ds-unit-sub">(MINS)</div>
            </div>
        </div>

        <div class="ds-actions">
            <button class="ds-btn ds-cancel" onclick="SSJ4_ConfigSheet.close()">CANCEL</button>
            <button class="ds-btn ds-set" onclick="SSJ4_ConfigSheet.set()">SET CONFIG</button>
        </div>
    </div>

    <div class="sheet-overlay" id="mus-overlay" onclick="SSJ4_MusicSheet.close()"></div>
    <div class="bottom-sheet" id="mus-sheet">
        <div class="ds-header">
            <span class="ds-title">SELECT FOCUS SOUND</span>
            <i class="fas fa-times" style="color:var(--text-sub); cursor:pointer; font-size: 1.2rem;" onclick="SSJ4_MusicSheet.close()"></i>
        </div>

        <div class="music-list">
            <div class="m-item active" id="m-0" onclick="SSJ4_MusicSheet.select(0, '', 'None')">
                <i class="fas fa-ban"></i> None (Silent)
            </div>
            <div class="m-item" id="m-1" onclick="SSJ4_MusicSheet.select(1, '../assets/audio/lofi.mp3', 'Lo-Fi Chill')">
                <i class="fas fa-compact-disc"></i> Lo-Fi Chill
            </div>
            <div class="m-item" id="m-2" onclick="SSJ4_MusicSheet.select(2, '../assets/audio/rain.mp3', 'Heavy Rain')">
                <i class="fas fa-cloud-rain"></i> Heavy Rain
            </div>
            <div class="m-item" id="m-3" onclick="SSJ4_MusicSheet.select(3, '../assets/audio/space.mp3', 'Deep Space')">
                <i class="fas fa-meteor"></i> Deep Space
            </div>
            <div class="m-item" id="m-4" onclick="SSJ4_MusicSheet.select(4, '../assets/audio/nature.mp3', 'Nature Flow')">
                <i class="fas fa-leaf"></i> Nature Flow
            </div>
        </div>

        <div class="ds-actions">
            <button class="ds-btn ds-cancel" onclick="SSJ4_MusicSheet.close()">CLOSE</button>
        </div>
    </div>

    <script>
        /* QUICKSOLVE PLATINUM - FOCUS & AMBIENCE ENGINE */
        
        function showToast(mode) {
            const toast = document.getElementById('custom-toast');
            const icon = document.getElementById('toast-icon');
            const msg = document.getElementById('toast-msg');

            if(navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 100]); 

            if (mode === 'workDone') {
                toast.className = "toast work-toast show";
                icon.className = "fas fa-bed";
                msg.innerText = "Work Done. Take a Break!";
            } else if (mode === 'breakDone') {
                toast.className = "toast break-toast show";
                icon.className = "fas fa-hammer";
                msg.innerText = "Break Over. Back to Hustle!";
            }
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // --- GLOBAL STATE ---
        let WORK_TIME = 25 * 60; 
        let BREAK_TIME = 5 * 60;  
        const SVG_CIR = 754;      

        // --- AUDIO ENGINE ---
        window.SSJ4_Audio = {
            el: document.getElementById('ambient-audio'),
            isPlaying: false,
            currentPath: '',
            
            play: function() {
                if(this.currentPath && this.currentPath !== '') {
                    this.el.play().catch(e => console.log("Audio play blocked by browser", e));
                    this.isPlaying = true;
                }
            },
            pause: function() {
                this.el.pause();
                this.isPlaying = false;
            },
            setTrack: function(path) {
                this.currentPath = path;
                this.el.src = path;
                if(!SSJ4_Focus.isPaused && SSJ4_Focus.currentMode === 'work') {
                    this.play();
                } else {
                    this.pause();
                }
            }
        };

        // --- TIMER ENGINE ---
        window.SSJ4_Focus = {
            timerInterval: null,
            timeRemaining: WORK_TIME,
            isPaused: true,
            currentMode: 'work', 

            init: function() {
                this.loadConfig();
                this.timeRemaining = WORK_TIME;
                this.updateDisplay(this.timeRemaining);
                this.resetProgress();
                SSJ4_Stats.init();
            },

            loadConfig: function() {
                const w = localStorage.getItem('qs_pom_work') || 25;
                const b = localStorage.getItem('qs_pom_break') || 5;
                WORK_TIME = w * 60;
                BREAK_TIME = b * 60;
                document.getElementById('fs-cycle-val').innerText = `${w} / ${b} Mins`;
            },

            haptic: function(v=20) { if(navigator.vibrate) navigator.vibrate(v); },

            togglePlay: function() {
                this.haptic(30);
                const playIconInit = document.getElementById('play-icon-init');
                const playIconPause = document.getElementById('play-icon');
                const startBtn = document.getElementById('start-btn');
                
                if (this.isPaused) {
                    // Start Timer
                    this.isPaused = false;
                    playIconInit.style.display = "none";
                    playIconPause.style.display = "inline-block";
                    
                    startBtn.className = this.currentMode === 'work' ? "ctrl-btn play-btn" : "ctrl-btn break-active";
                    
                    if(this.currentMode === 'work') SSJ4_Audio.play(); // Play music if in work mode

                    this.startCountdown();
                } else {
                    // Pause Timer
                    this.isPaused = true;
                    playIconPause.style.display = "none";
                    playIconInit.style.display = "inline-block";
                    startBtn.className = "ctrl-btn"; // reset style
                    
                    SSJ4_Audio.pause(); // Pause music
                    clearInterval(this.timerInterval);
                }
            },

            startCountdown: function() {
                clearInterval(this.timerInterval);
                this.timerInterval = setInterval(() => {
                    if (!this.isPaused) {
                        this.timeRemaining--;
                        this.updateDisplay(this.timeRemaining);
                        this.updateProgress();

                        if (this.timeRemaining <= 0) {
                            clearInterval(this.timerInterval);
                            this.handleModeCompletion();
                        }
                    }
                }, 1000);
            },

            handleModeCompletion: function() {
                this.isPaused = true; 
                document.getElementById('play-icon').style.display = "none";
                document.getElementById('play-icon-init').style.display = "inline-block";
                document.getElementById('start-btn').className = "ctrl-btn";
                SSJ4_Audio.pause();

                if (this.currentMode === 'work') {
                    showToast('workDone');
                    SSJ4_Stats.addSession(); 
                    this.currentMode = 'break';
                    this.timeRemaining = BREAK_TIME;
                    document.getElementById('state-lbl').innerText = "Break";
                    document.getElementById('state-lbl').style.color = "var(--accent-gold)";
                    document.getElementById('display-time').style.color = "var(--accent-gold)";
                    
                    document.getElementById('progress-circle').className = "p-fill break"; 
                    document.getElementById('skip-btn').style.display = 'flex'; 
                } else {
                    showToast('breakDone');
                    this.currentMode = 'work';
                    this.timeRemaining = WORK_TIME;
                    document.getElementById('state-lbl').innerText = "Work";
                    document.getElementById('state-lbl').style.color = "var(--accent-cyan)";
                    document.getElementById('display-time').style.color = "var(--text-main)";
                    
                    document.getElementById('progress-circle').className = "p-fill work";
                    document.getElementById('skip-btn').style.display = 'none'; 
                }

                this.updateDisplay(this.timeRemaining);
                this.resetProgress(); 
            },

            skipBreak: function() {
                if(this.currentMode === 'break') {
                    this.haptic(30);
                    clearInterval(this.timerInterval);
                    this.handleModeCompletion(); 
                }
            },

            reset: function() {
                this.haptic(40);
                clearInterval(this.timerInterval);
                this.isPaused = true;
                this.currentMode = 'work';
                
                SSJ4_Audio.pause();
                this.loadConfig();
                this.timeRemaining = WORK_TIME;

                document.getElementById('play-icon').style.display = "none";
                document.getElementById('play-icon-init').style.display = "inline-block";
                document.getElementById('start-btn').className = "ctrl-btn"; 

                document.getElementById('state-lbl').innerText = "Work";
                document.getElementById('state-lbl').style.color = "var(--text-sub)";
                document.getElementById('display-time').style.color = "var(--text-main)";
                
                document.getElementById('progress-circle').className = "p-fill work";
                document.getElementById('skip-btn').style.display = 'none';

                this.updateDisplay(this.timeRemaining);
                this.resetProgress();
            },

            updateDisplay: function(secs) {
                const m = Math.floor(secs / 60).toString().padStart(2, '0');
                const s = (secs % 60).toString().padStart(2, '0');
                document.getElementById('display-time').innerText = `${m}:${s}`;
            },

            updateProgress: function() {
                const circle = document.getElementById('progress-circle');
                const total = this.currentMode === 'work' ? WORK_TIME : BREAK_TIME;
                const offset = SVG_CIR * (1 - this.timeRemaining / total);
                circle.style.strokeDashoffset = offset;
            },
            resetProgress: function() {
                document.getElementById('progress-circle').style.strokeDashoffset = 0;
            }
        };

        // --- STATS ENGINE ---
        window.SSJ4_Stats = {
            todayKey: new Date().toISOString().split('T')[0],

            init: function() {
                this.checkDateReset();
                this.render();
            },

            checkDateReset: function() {
                const savedDate = localStorage.getItem('qs_pom_date');
                if (savedDate !== this.todayKey) {
                    localStorage.setItem('qs_pom_date', this.todayKey);
                    localStorage.setItem('qs_pom_stats_sess', 0);
                    localStorage.setItem('qs_pom_stats_time', 0); 
                }
            },

            addSession: function() {
                const currentWorkMins = WORK_TIME / 60;
                let sess = parseInt(localStorage.getItem('qs_pom_stats_sess') || 0);
                let time = parseFloat(localStorage.getItem('qs_pom_stats_time') || 0);
                
                localStorage.setItem('qs_pom_stats_sess', sess + 1);
                localStorage.setItem('qs_pom_stats_time', time + currentWorkMins);
                this.render();
            },

            render: function() {
                const sess = localStorage.getItem('qs_pom_stats_sess') || 0;
                const timeMins = parseFloat(localStorage.getItem('qs_pom_stats_time') || 0);
                const decHours = (timeMins / 60).toFixed(1);

                document.getElementById('stat-sessions').innerText = sess;
                document.getElementById('stat-time').innerHTML = `${decHours}<small>h</small>`;
            }
        };

        // --- CONFIG DRUM ENGINE ---
        window.SSJ4_ConfigSheet = {
            wArr: Array.from({length: 16}, (_, i) => (i + 3) * 5), 
            bArr: Array.from({length: 6}, (_, i) => (i + 1) * 5),   
            wIdx: 2, bIdx: 0,

            open: function() {
                SSJ4_Focus.haptic();
                const currW = WORK_TIME / 60;
                const currB = BREAK_TIME / 60;
                
                this.wIdx = this.wArr.indexOf(currW) !== -1 ? this.wArr.indexOf(currW) : 2;
                this.bIdx = this.bArr.indexOf(currB) !== -1 ? this.bArr.indexOf(currB) : 0;

                this.renderDrum();
                document.getElementById('cfg-overlay').classList.add('show');
                setTimeout(() => document.getElementById('cfg-sheet').classList.add('show'), 10);
            },
            close: function() {
                SSJ4_Focus.haptic();
                document.getElementById('cfg-sheet').classList.remove('show');
                setTimeout(() => document.getElementById('cfg-overlay').classList.remove('show'), 300);
            },
            move: function(type, dir) {
                SSJ4_Focus.haptic(15);
                if (type === 'w') this.wIdx = (this.wIdx + dir + this.wArr.length) % this.wArr.length;
                else this.bIdx = (this.bIdx + dir + this.bArr.length) % this.bArr.length;
                this.renderDrum();
            },
            renderCol: function(arr, centerIdx, elId) {
                const el = document.getElementById(elId);
                let html = '';
                for(let i = -1; i <= 1; i++) {
                    let idx = (centerIdx + i + arr.length) % arr.length;
                    let cls = i === 0 ? 'd-item active' : 'd-item near';
                    html += `<div class="${cls}">${String(arr[idx]).padStart(2,'0')}</div>`;
                }
                el.innerHTML = html;
            },
            renderDrum: function() {
                this.renderCol(this.wArr, this.wIdx, 'drum-work');
                this.renderCol(this.bArr, this.bIdx, 'drum-break');
            },
            set: function() {
                SSJ4_Focus.haptic(40);
                localStorage.setItem('qs_pom_work', this.wArr[this.wIdx]);
                localStorage.setItem('qs_pom_break', this.bArr[this.bIdx]);
                this.close();
                SSJ4_Focus.reset();
            }
        };

        // --- MUSIC LIST ENGINE ---
        window.SSJ4_MusicSheet = {
            open: function() {
                SSJ4_Focus.haptic();
                document.getElementById('mus-overlay').classList.add('show');
                setTimeout(() => document.getElementById('mus-sheet').classList.add('show'), 10);
            },
            close: function() {
                SSJ4_Focus.haptic();
                document.getElementById('mus-sheet').classList.remove('show');
                setTimeout(() => document.getElementById('mus-overlay').classList.remove('show'), 300);
            },
            select: function(idx, path, name) {
                SSJ4_Focus.haptic(25);
                // Update UI
                document.querySelectorAll('.m-item').forEach(el => el.classList.remove('active'));
                document.getElementById(`m-${idx}`).classList.add('active');
                document.getElementById('fs-music-val').innerText = name;
                
                // Set Audio
                SSJ4_Audio.setTrack(path);
                
                setTimeout(() => this.close(), 200);
            }
        };

        document.addEventListener('DOMContentLoaded', () => { SSJ4_Focus.init(); });
    </script>
</body>
</html>
