<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="Cache-Control" content="max-age=3600, must-revalidate">

    <title>Visual BMI Calculator V2 | Dynamic Body Silhouette | QuickSolve Platinum</title>
    
    <meta name="description" content="Calculate your BMI visually. See your dynamic body silhouette, track ideal weight, and view your exact position on the health gauge. 100% Offline.">
    <meta name="keywords" content="visual bmi calculator, bmi silhouette, ideal weight tracker, body mass index, QuickSolve Platinum">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://quicksolve-platinum.netlify.app/health_suites/visual_bmi.html">

    <meta property="og:title" content="Visual BMI Calculator V2 | QuickSolve Platinum">
    <meta property="og:description" content="Calculate your BMI visually. See your dynamic body silhouette, track ideal weight, and view your exact position on the health gauge.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://quicksolve-platinum.netlify.app/health_suites/visual_bmi.html">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">

    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="../assets/css/all.min.css">
    <link rel="stylesheet" href="../style.css">

    <style>
        /* =========================================
           VISUAL BMI V2 (PLATINUM GOD MODE)
           Theme: Obsidian / Emerald Health
           Fixes: Silhouette Upgrade, Bottom Clipping
           ========================================= */
        #mod-bmi-overlay {
            position: fixed !important; top: 0; left: 0; width: 100vw; height: 100dvh;
            background-color: #020617; z-index: 5000 !important;
            display: flex; flex-direction: column; animation: fadeIn 0.3s ease;
            font-family: sans-serif;
        }

        /* Laptop / Desktop Compatibility */
        @media (min-width: 768px) {
            #mod-bmi-overlay {
                max-width: 480px;
                margin: 0 auto;
                left: 50%;
                transform: translateX(-50%);
                border-left: 1px solid #1e293b;
                border-right: 1px solid #1e293b;
                box-shadow: 0 0 30px rgba(0,0,0,0.8);
            }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Header centered modification */
        .vb-head {
            display: flex; align-items: center; justify-content: center; padding: 12px 15px; 
            background: #0f172a; border-bottom: 1px solid #1e293b;
            position: sticky; top: 0; z-index: 100; flex-shrink: 0;
        }
        .vb-head .qs-back-btn { position: absolute; left: 15px; background: none; border: none; color: #f8fafc; font-size: 1.2rem; cursor: pointer; text-decoration: none;}
        .vb-tit { color: #10b981; font-weight: 900; font-size: 1rem; margin-left: 0; text-transform: uppercase; letter-spacing: 2px;}

        .vb-body { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }

        /* Sleek Input Cards */
        .vb-card { 
            background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; 
            padding: 15px; display: flex; flex-direction: column; gap: 10px; position: relative;
        }
        
        .vb-lbl-row { display: flex; justify-content: space-between; align-items: center; }
        .vb-lbl { font-size: 0.75rem; color: #94a3b8; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        
        .unit-badge { background: #1e293b; border: 1px solid #334155; color: #f8fafc; padding: 4px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 900; cursor: pointer; display: flex; align-items: center; gap: 5px; }

        .vb-inp-wrap { display: flex; align-items: center; gap: 10px; background: rgba(2, 6, 23, 0.5); padding: 12px; border-radius: 8px; border: 1px solid #1e293b; }
        .vb-inp-wrap:focus-within { border-color: #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.1); }
        .vb-inp { flex: 1; background: transparent; border: none; color: #fff; font-size: 1.2rem; font-weight: 900; outline: none; width: 100%; font-family: monospace; text-align: center; }

        .inp-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* Visual BMI Display */
        .res-card { background: #020617; border: 1px solid #10b981; border-radius: 12px; padding: 20px 15px; text-align: center; position: relative; overflow: visible; box-shadow: inset 0 0 30px rgba(16, 185, 129, 0.05); }
        .res-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #38bdf8, #10b981, #facc15, #ef4444); }
        
        .bmi-val { font-size: 3.5rem; font-weight: 900; color: #f8fafc; font-family: monospace; letter-spacing: -2px; line-height: 1; margin-bottom: 5px; }
        .bmi-cat { font-size: 0.9rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; padding: 4px 12px; border-radius: 20px; display: inline-block; margin-bottom: 20px; }

        /* Glowing Gauge Track */
        .gauge-container { width: 100%; position: relative; margin-top: 15px; }
        .gauge-track { height: 10px; width: 100%; border-radius: 5px; background: linear-gradient(to right, #38bdf8 0%, #10b981 30%, #facc15 60%, #ef4444 85%); position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .gauge-needle { position: absolute; top: -8px; left: 50%; width: 4px; height: 26px; background: #fff; border-radius: 2px; box-shadow: 0 0 10px rgba(255,255,255,0.8); transform: translateX(-50%); transition: left 0.5s cubic-bezier(0.1, 0.9, 0.2, 1); z-index: 2; }
        .gauge-labels { display: flex; justify-content: space-between; font-size: 0.55rem; color: #64748b; font-weight: 900; margin-top: 8px; font-family: monospace; }

        /* Dynamic Silhouette V2 (Premium Asset) */
        .silhouette-box { display: flex; justify-content: center; align-items: flex-end; height: 160px; margin-top: 15px; position: relative; padding-bottom: 10px; }
        /* Placeholder for new premium vector silhouette */
        .silhouette-premium { width: 80px; height: 100%; background: #1e293b; border-radius: 10px; transition: transform 0.5s cubic-bezier(0.1, 0.9, 0.2, 1), background 0.5s; transform-origin: bottom center; }
        
        /* Weight Goal Insight - Corrected clipping */
        .insight-box { background: rgba(30, 41, 59, 0.5); border: 1px dashed #475569; border-radius: 8px; padding: 12px; margin-top: 25px; display: flex; align-items: center; gap: 12px; text-align: left; }
        .insight-icon { font-size: 1.5rem; color: #38bdf8; }
        .insight-txt { font-size: 0.75rem; color: #cbd5e1; font-weight: bold; line-height: 1.4; }
        .insight-hl { color: #f8fafc; font-weight: 900; }

        .vm-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0, 0, 0, 0.8); z-index: 9999; flex-direction: column; justify-content: flex-end; animation: fadeIn 0.2s; }
        .vm-content { background: #0f172a; border-top-left-radius: 20px; border-top-right-radius: 20px; display: flex; flex-direction: column; overflow: hidden; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .vm-open .vm-content { transform: translateY(0); }
        
        .vm-head { padding: 15px 20px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
        .vm-head span { color: #10b981; font-weight: 900; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; }
        .vm-close { background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; }
        
        .vm-list { padding: 10px 0; }
        .vl-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid rgba(30, 41, 59, 0.5); cursor: pointer; }
        .vl-name { font-weight: 900; color: #f8fafc; font-size: 0.95rem; }
        .vl-check { color: #10b981; display: none; }
        .vl-item.active .vl-check { display: block; }
        .vl-item.active .vl-name { color: #10b981; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <main id="mod-bmi-overlay" role="main" aria-label="Visual BMI Calculator">
        <header class="vb-head">
            <a href="../health.html" class="qs-back-btn" aria-label="Go Back">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
            </a>
            <h1 class="vb-tit"><i class="fas fa-weight" aria-hidden="true"></i> VISUAL BMI V2</h1>
        </header>

        <section class="vb-body">
            
            <div class="vb-card">
                <div class="vb-lbl-row">
                    <div class="vb-lbl" id="lbl-height-title">Your Height</div>
                    <div class="unit-badge" tabindex="0" role="button" aria-haspopup="dialog" onclick="QS_BMI.openUnitModal('h')" onkeypress="if(event.key==='Enter')QS_BMI.openUnitModal('h')" aria-label="Change Height Unit">
                        <span id="lbl-unit-h">Centimeters (cm)</span> <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
                
                <div id="inp-wrap-cm">
                    <div class="vb-inp-wrap">
                        <input type="number" id="inp-h-cm" class="vb-inp" placeholder="e.g. 175" min="0" step="any" aria-labelledby="lbl-height-title lbl-unit-h" oninput="QS_BMI.calculate()">
                        <span style="color:#64748b; font-weight:bold; font-size:0.8rem;">cm</span>
                    </div>
                </div>

                <div id="inp-wrap-ft" class="hidden">
                    <div class="inp-grid-2">
                        <div class="vb-inp-wrap">
                            <input type="number" id="inp-h-ft" class="vb-inp" placeholder="Ft" min="0" step="any" aria-label="Feet" oninput="QS_BMI.calculate()">
                            <span style="color:#64748b; font-weight:bold; font-size:0.8rem;">ft</span>
                        </div>
                        <div class="vb-inp-wrap">
                            <input type="number" id="inp-h-in" class="vb-inp" placeholder="In" min="0" max="11" step="any" aria-label="Inches" oninput="if(this.value>11)this.value=11; QS_BMI.calculate();">
                            <span style="color:#64748b; font-weight:bold; font-size:0.8rem;">in</span>
                        </div>
                    </div>
                </div>

                <div class="vb-lbl-row" style="margin-top: 5px;">
                    <div class="vb-lbl" id="lbl-weight-title">Your Weight</div>
                    <div class="unit-badge" tabindex="0" role="button" aria-haspopup="dialog" onclick="QS_BMI.openUnitModal('w')" onkeypress="if(event.key==='Enter')QS_BMI.openUnitModal('w')" aria-label="Change Weight Unit">
                        <span id="lbl-unit-w">Kilograms (kg)</span> <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
                
                <div class="vb-inp-wrap">
                    <input type="number" id="inp-w" class="vb-inp" placeholder="e.g. 70" min="0" step="any" aria-labelledby="lbl-weight-title lbl-unit-w" oninput="QS_BMI.calculate()">
                    <span id="lbl-inp-w" style="color:#64748b; font-weight:bold; font-size:0.8rem;">kg</span>
                </div>
            </div>

            <div id="empty-state" style="text-align:center; padding: 30px 20px; color:#475569;" aria-hidden="false">
                <i class="fas fa-chart-line fa-3x" style="margin-bottom:12px; opacity:0.5;"></i>
                <div style="font-size:0.85rem; font-weight:bold;">Input your metrics to generate your digital silhouette.</div>
            </div>

            <div id="res-dashboard" class="res-card hidden" aria-live="polite" aria-hidden="true">
                
                <div class="bmi-val" id="res-bmi-val">0.0</div>
                <div class="bmi-cat" id="res-bmi-cat">Enter Details</div>

                <div class="silhouette-box">
                    <div class="silhouette-premium" id="res-silhouette"></div>
                </div>

                <div class="gauge-container">
                    <div class="gauge-track">
                        <div class="gauge-needle" id="res-needle"></div>
                    </div>
                    <div class="gauge-labels">
                        <span>15 (Under)</span>
                        <span>22 (Ideal)</span>
                        <span>30 (Obese)</span>
                        <span>40+ (Extreme)</span>
                    </div>
                </div>

                <div class="insight-box">
                    <i class="fas fa-check-circle insight-icon" id="ins-icon"></i>
                    <div class="insight-txt" id="ins-text">
                        Awaiting data to calculate your ideal weight goal.
                    </div>
                </div>

            </div>

        </section>
    </main>

    <div id="um-modal" class="vm-modal" role="dialog" aria-modal="true" aria-labelledby="um-title">
        <div class="vm-content">
            <div class="vm-head">
                <h2 id="um-title" style="margin:0; font-size:1rem; color:#10b981; font-weight:900; text-transform:uppercase; letter-spacing:1px;">Select Unit</h2>
                <button class="vm-close" onclick="QS_BMI.closeUnitModal()" aria-label="Close Unit Selector"><i class="fas fa-times"></i></button>
            </div>
            <div class="vm-list" id="um-list" role="listbox">
                </div>
        </div>
    </div>

    <script>
        /* QUICKSOLVE PLATINUM - VISUAL BMI ENGINE V2
           Features: Dynamic Silhouette Scaling V2, Gauge Mapping, Clipping Fixes.
           BugFixes: State Parameter Mismatch Fix, Safe Parsing, UI Freeze Fix, Inches Cap.
        */
        (function() {
            window.QS_BMI = {
                units: { h: 'cm', w: 'kg' }, 
                activeModalType: null,

                initListener: function() {
                    window.addEventListener('qs-tool-opened', (e) => {
                        if(e.detail && e.detail.tool === 'health_suites/visual_bmi.js') {
                            this.calculate();
                        }
                    });

                    if(document.readyState === 'complete' || document.readyState === 'interactive'){
                         setTimeout(() => this.calculate(), 100);
                    } else {
                         document.addEventListener('DOMContentLoaded', () => this.calculate());
                    }
                },

                // --- MODAL LOGIC ---
                // Fixed modal to accept 'h' and 'w' directly to match the state object
                openUnitModal: function(type) {
                    this.activeModalType = type;
                    const title = type === 'h' ? 'Height Format' : 'Weight Format';
                    document.getElementById('um-title').innerText = title;
                    
                    const listObj = document.getElementById('um-list');
                    listObj.innerHTML = '';

                    let options = [];
                    if (type === 'h') {
                        options = [
                            { val: 'cm', name: 'Centimeters (cm)' },
                            { val: 'ft', name: 'Feet & Inches (ft/in)' }
                        ];
                    } else {
                        options = [
                            { val: 'kg', name: 'Kilograms (kg)' },
                            { val: 'lbs', name: 'Pounds (lbs)' }
                        ];
                    }

                    options.forEach(opt => {
                        let isActive = this.units[type] === opt.val;
                        let div = document.createElement('div');
                        div.className = `vl-item ${isActive ? 'active' : ''}`;
                        div.setAttribute('role', 'option');
                        div.setAttribute('aria-selected', isActive);
                        div.tabIndex = 0;
                        div.onclick = () => this.setUnit(type, opt.val);
                        div.onkeypress = (e) => { if(e.key === 'Enter') this.setUnit(type, opt.val); };
                        div.innerHTML = `
                            <span class="vl-name">${opt.name}</span>
                            <i class="fas fa-check vl-check"></i>
                        `;
                        listObj.appendChild(div);
                    });

                    const modal = document.getElementById('um-modal');
                    modal.style.display = 'flex';
                    setTimeout(() => { modal.classList.add('vm-open'); }, 10);
                    if(window.doHaptic) window.doHaptic();
                },

                closeUnitModal: function() {
                    const modal = document.getElementById('um-modal');
                    if(modal) {
                        modal.classList.remove('vm-open');
                        setTimeout(() => { modal.style.display = 'none'; }, 300);
                    }
                    if(window.doHaptic) window.doHaptic();
                },

                setUnit: function(type, val) {
                    this.units[type] = val; // Now perfectly maps to 'h' or 'w'
                    
                    if (type === 'h') {
                        document.getElementById('lbl-unit-h').innerText = val === 'cm' ? 'Centimeters (cm)' : 'Feet & Inches';
                        if (val === 'cm') {
                            document.getElementById('inp-wrap-cm').classList.remove('hidden');
                            document.getElementById('inp-wrap-ft').classList.add('hidden');
                        } else {
                            document.getElementById('inp-wrap-cm').classList.add('hidden');
                            document.getElementById('inp-wrap-ft').classList.remove('hidden');
                        }
                    } else {
                        document.getElementById('lbl-unit-w').innerText = val === 'kg' ? 'Kilograms (kg)' : 'Pounds (lbs)';
                        document.getElementById('lbl-inp-w').innerText = val;
                    }
                    
                    this.closeUnitModal();
                    this.calculate(); 
                },

                // --- MATH & RENDER LOGIC ---
                calculate: function() {
                    let heightM = 0;
                    let weightKg = 0;

                    try {
                        if (this.units.h === 'cm') {
                            const cm = parseFloat(document.getElementById('inp-h-cm').value);
                            if (!isNaN(cm) && cm > 0) heightM = cm / 100;
                        } else {
                            let ft = parseFloat(document.getElementById('inp-h-ft').value) || 0;
                            let inc = parseFloat(document.getElementById('inp-h-in').value) || 0;
                            
                            // JS Fallback cap for inches just in case
                            if(inc > 11) {
                                inc = 11;
                                document.getElementById('inp-h-in').value = 11;
                            }
                            
                            const totalInches = (ft * 12) + inc;
                            if (totalInches > 0) heightM = totalInches * 0.0254;
                        }

                        const rawW = parseFloat(document.getElementById('inp-w').value);
                        if (!isNaN(rawW) && rawW > 0) {
                            weightKg = this.units.w === 'kg' ? rawW : rawW * 0.453592;
                        }
                    } catch(e) {
                        console.error('BMI Calculation Parsing Error:', e);
                    }

                    // Robustly handle state change (Fixes the freeze bug)
                    if (heightM <= 0 || weightKg <= 0) {
                        document.getElementById('empty-state').classList.remove('hidden');
                        document.getElementById('empty-state').setAttribute('aria-hidden', 'false');
                        document.getElementById('res-dashboard').classList.add('hidden');
                        document.getElementById('res-dashboard').setAttribute('aria-hidden', 'true');
                        return;
                    }

                    document.getElementById('empty-state').classList.add('hidden');
                    document.getElementById('empty-state').setAttribute('aria-hidden', 'true');
                    document.getElementById('res-dashboard').classList.remove('hidden');
                    document.getElementById('res-dashboard').setAttribute('aria-hidden', 'false');

                    const bmi = weightKg / (heightM * heightM);
                    const idealWeightKg = 22 * (heightM * heightM);
                    
                    this.renderUI(bmi, weightKg, idealWeightKg);
                },

                renderUI: function(bmi, actualKg, idealKg) {
                    const valEl = document.getElementById('res-bmi-val');
                    const catEl = document.getElementById('res-bmi-cat');
                    const silEl = document.getElementById('res-silhouette');
                    const needleEl = document.getElementById('res-needle');
                    
                    valEl.innerText = bmi.toFixed(1);
                    
                    let cat = "";
                    let color = "";
                    let targetScaleX = 1; 

                    if (bmi < 18.5) {
                        cat = "Underweight"; color = "#38bdf8"; targetScaleX = 0.65;
                    } else if (bmi >= 18.5 && bmi < 25) {
                        cat = "Normal Weight"; color = "#10b981"; targetScaleX = 1.0;
                    } else if (bmi >= 25 && bmi < 30) {
                        cat = "Overweight"; color = "#facc15"; targetScaleX = 1.4;
                    } else if (bmi >= 30 && bmi < 35) {
                        cat = "Obese Class I"; color = "#ef4444"; targetScaleX = 1.7;
                    } else {
                        cat = "Extreme Obesity"; color = "#991b1b"; targetScaleX = 2.1;
                    }

                    catEl.innerText = cat;
                    catEl.style.backgroundColor = `rgba(${this.hexToRgb(color)}, 0.15)`;
                    catEl.style.color = color;
                    catEl.style.border = `1px solid ${color}`;
                    valEl.style.color = color;

                    // 2. Dynamic Silhouette V2 (Premium Scaling)
                    silEl.style.transform = `scaleX(${targetScaleX})`;
                    silEl.style.background = color;

                    // 3. Gauge Needle Position
                    let pct = ((bmi - 15) / (40 - 15)) * 100;
                    if (pct < 0) pct = 0;
                    if (pct > 100) pct = 100;
                    needleEl.style.left = `${pct}%`;

                    // 4. Weight Goal Insight (Dynamically tracking active unit)
                    const diffKg = actualKg - idealKg;
                    const diffLbs = diffKg * 2.20462;
                    const wUnit = this.units.w;
                    const showDiff = wUnit === 'kg' ? Math.abs(diffKg).toFixed(1) : Math.abs(diffLbs).toFixed(1);
                    const idealShow = wUnit === 'kg' ? idealKg.toFixed(1) : (idealKg * 2.20462).toFixed(1);

                    const insTxt = document.getElementById('ins-text');
                    const insIcon = document.getElementById('ins-icon');

                    if (bmi < 18.5) {
                        insIcon.className = "fas fa-arrow-up insight-icon";
                        insIcon.style.color = "#38bdf8";
                        insTxt.innerHTML = `You need to <span class="insight-hl" style="color:#38bdf8;">GAIN ~${showDiff} ${wUnit}</span> to reach your ideal weight of ${idealShow} ${wUnit}.`;
                    } else if (bmi >= 25) {
                        insIcon.className = "fas fa-arrow-down insight-icon";
                        insIcon.style.color = "#ef4444";
                        insTxt.innerHTML = `You need to <span class="insight-hl" style="color:#ef4444;">LOSE ~${showDiff} ${wUnit}</span> to reach your ideal weight of ${idealShow} ${wUnit}.`;
                    } else {
                        insIcon.className = "fas fa-check-circle insight-icon";
                        insIcon.style.color = "#10b981";
                        insTxt.innerHTML = `You are exactly where you need to be! Your ideal weight is ~${idealShow} ${wUnit}. <span class="insight-hl" style="color:#10b981;">Keep it up!</span>`;
                    }
                },

                hexToRgb: function(hex) {
                    let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                    return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : null;
                }
            };
            window.QS_BMI.initListener();
        })();
    </script>
</body>
</html>
