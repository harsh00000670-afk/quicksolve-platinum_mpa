<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="Cache-Control" content="max-age=3600, must-revalidate">

    <title>Child & Teen BMI Calculator | CDC Percentile | QuickSolve Platinum</title>
    
    <meta name="description" content="Accurate BMI calculator for children and teens (ages 2-20). Uses CDC percentile growth charts for precise health assessment and pediatric growth tracking. 100% Offline.">
    <meta name="keywords" content="child bmi calculator, teen bmi percentile, cdc growth chart calculator, kids health tracker, pediatric bmi, QuickSolve Platinum">
    <meta name="author" content="Harsh - QuickSolve Team">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://quicksolve-platinum.netlify.app/health_suites/child_bmi.html">

    <meta property="og:title" content="Child & Teen BMI Calculator | QuickSolve Platinum">
    <meta property="og:description" content="Calculate accurate BMI percentiles for children and teens using CDC growth charts. Instant pediatric health insights.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://quicksolve-platinum.netlify.app/health_suites/child_bmi.html">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">

    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="../assets/css/all.min.css">
    <link rel="stylesheet" href="../style.css">

    <style>
        /* =========================================
           CHILD BMI (PLATINUM GOD MODE)
           Theme: Obsidian / Amber & Teal
           ========================================= */
        #mod-cbmi-overlay {
            position: fixed !important; top: 0; left: 0; width: 100vw; height: 100dvh;
            background-color: #020617; z-index: 5000 !important;
            display: flex; flex-direction: column; animation: fadeIn 0.3s ease;
            font-family: sans-serif;
        }

        /* Laptop / Desktop Compatibility */
        @media (min-width: 768px) {
            #mod-cbmi-overlay {
                max-width: 480px;
                margin: 0 auto;
                left: 50%;
                transform: translateX(-50%);
                border-left: 1px solid #1e293b;
                border-right: 1px solid #1e293b;
                box-shadow: 0 0 30px rgba(0,0,0,0.8);
            }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Header centered modification */
        .cb-head {
            display: flex; align-items: center; justify-content: center; padding: 12px 15px; 
            background: #0f172a; border-bottom: 1px solid #1e293b;
            position: sticky; top: 0; z-index: 100; flex-shrink: 0;
        }
        .cb-head .qs-back-btn { position: absolute; left: 15px; background: none; border: none; color: #f8fafc; font-size: 1.2rem; cursor: pointer; text-decoration: none;}
        .cb-tit { color: #f59e0b; font-weight: 900; font-size: 1rem; margin-left: 0; text-transform: uppercase; letter-spacing: 2px;}

        .cb-body { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 80px; }

        /* Sleek Input Cards */
        .cb-card { 
            background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; 
            padding: 15px; display: flex; flex-direction: column; gap: 10px; position: relative;
        }
        
        .cb-lbl-row { display: flex; justify-content: space-between; align-items: center; }
        .cb-lbl { font-size: 0.75rem; color: #94a3b8; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        
        .unit-badge { background: #1e293b; border: 1px solid #334155; color: #f8fafc; padding: 4px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 900; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .unit-badge:active { background: #f59e0b; color: #020617; }

        .cb-inp-wrap { display: flex; align-items: center; gap: 10px; background: rgba(2, 6, 23, 0.5); padding: 12px; border-radius: 8px; border: 1px solid #1e293b; }
        .cb-inp-wrap:focus-within { border-color: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.1); }
        .cb-inp { flex: 1; background: transparent; border: none; color: #fff; font-size: 1.2rem; font-weight: 900; outline: none; width: 100%; font-family: monospace; text-align: center; }

        .inp-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* Result Panel */
        .res-card { background: #020617; border: 1px solid #f59e0b; border-radius: 12px; padding: 20px 15px; text-align: center; position: relative; overflow: visible; box-shadow: inset 0 0 30px rgba(245, 158, 11, 0.05); }
        .res-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444); }
        
        .p-val { font-size: 3rem; font-weight: 900; color: #f59e0b; font-family: monospace; line-height: 1; }
        .p-unit { font-size: 0.8rem; color: #94a3b8; font-weight: 800; text-transform: uppercase; margin-top: 5px; }
        .p-cat { font-size: 0.9rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; padding: 4px 12px; border-radius: 20px; display: inline-block; margin-top: 15px; }

        /* Percentile Bar */
        .bar-container { width: 100%; height: 8px; background: #1e293b; border-radius: 4px; margin-top: 25px; position: relative; overflow: visible; }
        .bar-fill { height: 100%; width: 0%; border-radius: 4px; background: linear-gradient(to right, #38bdf8, #10b981, #f59e0b, #ef4444); transition: width 0.8s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .bar-marker { position: absolute; top: -12px; width: 2px; height: 32px; background: #fff; box-shadow: 0 0 8px #fff; transform: translateX(-50%); transition: left 0.8s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .bar-labels { display: flex; justify-content: space-between; font-size: 0.55rem; color: #64748b; font-weight: 900; margin-top: 15px; font-family: monospace; }

        /* CDC Insight */
        .insight-box { background: rgba(30, 41, 59, 0.5); border: 1px dashed #475569; border-radius: 8px; padding: 12px; margin-top: 20px; display: flex; align-items: flex-start; gap: 12px; text-align: left; }
        .ins-icon { font-size: 1.5rem; color: #f59e0b; }
        .ins-txt { font-size: 0.75rem; color: #cbd5e1; font-weight: bold; line-height: 1.5; }
        .ins-hl { color: #f8fafc; font-weight: 900; }

        /* Modals */
        .cm-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0, 0, 0, 0.8); z-index: 9999; flex-direction: column; justify-content: flex-end; animation: fadeIn 0.2s; }
        .cm-content { background: #0f172a; border-top-left-radius: 20px; border-top-right-radius: 20px; display: flex; flex-direction: column; overflow: hidden; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .cm-open .cm-content { transform: translateY(0); }
        .cm-head { padding: 15px 20px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
        .cm-head span { color: #f59e0b; font-weight: 900; font-size: 1rem; text-transform: uppercase; }
        .cm-close { background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; }
        .cm-list { padding: 10px 0; }
        .cl-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid rgba(30, 41, 59, 0.5); cursor: pointer; }
        .cl-name { font-weight: 900; color: #f8fafc; font-size: 0.95rem; }
        .cl-check { color: #f59e0b; display: none; }
        .cl-item.active .cl-check { display: block; }
        .cl-item.active .cl-name { color: #f59e0b; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <main id="mod-cbmi-overlay" role="main" aria-label="Child BMI Calculator">
        <header class="cb-head">
            <a href="../health.html" class="qs-back-btn" aria-label="Go Back">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
            </a>
            <h1 class="cb-tit"><i class="fas fa-child" aria-hidden="true"></i> CHILD BMI (CDC)</h1>
        </header>

        <section class="cb-body">
            
            <div class="cb-card">
                <div class="cb-lbl" id="lbl-gender-title">Gender</div>
                <div class="cb-inp-wrap" role="button" tabindex="0" aria-haspopup="dialog" aria-labelledby="lbl-gender-title sel-gender-txt" onclick="QS_ChildBMI.openModal('gender')" onkeypress="if(event.key==='Enter')QS_ChildBMI.openModal('gender')" style="cursor:pointer;">
                    <i class="fas fa-venus-mars" style="color:#f59e0b;" aria-hidden="true"></i>
                    <div id="sel-gender-txt" style="flex:1; color:#fff; font-weight:900; font-size:0.95rem;">Select Gender</div>
                    <i class="fas fa-chevron-down" style="color:#64748b; font-size:0.8rem;" aria-hidden="true"></i>
                </div>

                <div class="cb-lbl" id="lbl-age-title" style="margin-top:5px;">Age (2 - 20 Years)</div>
                <div class="cb-inp-wrap">
                    <i class="fas fa-calendar-alt" style="color:#38bdf8;" aria-hidden="true"></i>
                    <input type="number" id="inp-age" class="cb-inp" placeholder="e.g. 12" min="2" max="20" step="any" aria-labelledby="lbl-age-title" oninput="QS_ChildBMI.calculate()">
                    <span style="color:#64748b; font-weight:bold; font-size:0.8rem;">yrs</span>
                </div>

                <div class="cb-lbl-row" style="margin-top:5px;">
                    <div class="cb-lbl" id="lbl-height-title">Height</div>
                    <div class="unit-badge" role="button" tabindex="0" aria-haspopup="dialog" aria-label="Change Height Unit" onclick="QS_ChildBMI.openModal('height')" onkeypress="if(event.key==='Enter')QS_ChildBMI.openModal('height')">
                        <span id="lbl-unit-h">cm</span> <i class="fas fa-chevron-down" aria-hidden="true"></i>
                    </div>
                </div>
                <div id="inp-wrap-cm" class="cb-inp-wrap">
                    <input type="number" id="inp-h-cm" class="cb-inp" placeholder="150" min="0" step="any" aria-labelledby="lbl-height-title lbl-unit-h" oninput="QS_ChildBMI.calculate()">
                </div>
                <div id="inp-wrap-ft" class="inp-grid-2 hidden">
                    <div class="cb-inp-wrap">
                        <input type="number" id="inp-h-ft" class="cb-inp" placeholder="Ft" min="0" step="any" aria-label="Feet" oninput="QS_ChildBMI.calculate()">
                    </div>
                    <div class="cb-inp-wrap">
                        <input type="number" id="inp-h-in" class="cb-inp" placeholder="In" min="0" max="11" step="any" aria-label="Inches" oninput="if(this.value>11)this.value=11; QS_ChildBMI.calculate();">
                    </div>
                </div>

                <div class="cb-lbl-row" style="margin-top:5px;">
                    <div class="cb-lbl" id="lbl-weight-title">Weight</div>
                    <div class="unit-badge" role="button" tabindex="0" aria-haspopup="dialog" aria-label="Change Weight Unit" onclick="QS_ChildBMI.openModal('weight')" onkeypress="if(event.key==='Enter')QS_ChildBMI.openModal('weight')">
                        <span id="lbl-unit-w">kg</span> <i class="fas fa-chevron-down" aria-hidden="true"></i>
                    </div>
                </div>
                <div class="cb-inp-wrap">
                    <input type="number" id="inp-w" class="cb-inp" placeholder="40" min="0" step="any" aria-labelledby="lbl-weight-title lbl-unit-w" oninput="QS_ChildBMI.calculate()">
                </div>
            </div>

            <div id="empty-state" style="text-align:center; padding: 20px; color:#475569;" aria-hidden="false">
                <i class="fas fa-baby-carriage fa-3x" style="margin-bottom:12px; opacity:0.5;" aria-hidden="true"></i>
                <div style="font-size:0.85rem; font-weight:bold;">Enter details to calculate CDC growth percentile.</div>
            </div>

            <div id="res-dashboard" class="res-card hidden" aria-live="polite" aria-hidden="true">
                <div class="p-val" id="res-percentile">0th</div>
                <div class="p-unit">CDC Percentile</div>
                <div class="p-cat" id="res-cat">--</div>

                <div class="bar-container" aria-hidden="true">
                    <div class="bar-fill"></div>
                    <div class="bar-marker" id="res-marker"></div>
                </div>
                <div class="bar-labels" aria-hidden="true">
                    <span>5th (Under)</span>
                    <span>50th (Mean)</span>
                    <span>85th (Over)</span>
                    <span>95th (Obese)</span>
                </div>

                <div class="insight-box">
                    <i class="fas fa-info-circle ins-icon" aria-hidden="true"></i>
                    <div class="ins-txt" id="ins-text">
                        Awaiting data for analysis.
                    </div>
                </div>
            </div>

        </section>
    </main>

    <div id="cm-modal" class="cm-modal" role="dialog" aria-modal="true" aria-labelledby="cm-title">
        <div class="cm-content">
            <div class="cm-head">
                <h2 id="cm-title" style="margin:0; font-size:1rem; color:#f59e0b; font-weight:900; text-transform:uppercase;">Select</h2>
                <button class="cm-close" aria-label="Close Selector" onclick="QS_ChildBMI.closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="cm-list" id="cm-list" role="listbox"></div>
        </div>
    </div>

    <script>
        /* QUICKSOLVE PLATINUM - CHILD BMI ENGINE
           Features: CDC Percentile Estimation Logic, Custom Bottom Sheets.
           BugFixes: Safe Parsing, UI Toggle Fix, Inches Cap, ARIA Attributes.
        */
        (function() {
            window.QS_ChildBMI = {
                state: { gender: null, hUnit: 'cm', wUnit: 'kg' },
                
                initListener: function() {
                    window.addEventListener('qs-tool-opened', (e) => {
                        if(e.detail && e.detail.tool === 'health_suites/child_bmi.js') this.calculate();
                    });
                    if(document.readyState === 'complete') this.calculate();
                    else document.addEventListener('DOMContentLoaded', () => this.calculate());
                },

                openModal: function(type) {
                    const titleMap = { gender: 'Select Gender', height: 'Height Unit', weight: 'Weight Unit' };
                    document.getElementById('cm-title').innerText = titleMap[type];
                    const list = document.getElementById('cm-list');
                    list.innerHTML = '';

                    let opts = [];
                    if(type === 'gender') opts = [{v:'male', n:'Boy / Male'}, {v:'female', n:'Girl / Female'}];
                    else if(type === 'height') opts = [{v:'cm', n:'Centimeters (cm)'}, {v:'ft', n:'Feet & Inches'}];
                    else opts = [{v:'kg', n:'Kilograms (kg)'}, {v:'lbs', n:'Pounds (lbs)'}];

                    opts.forEach(o => {
                        const active = (this.state[type === 'gender' ? 'gender' : (type === 'height' ? 'hUnit' : 'wUnit')] === o.v);
                        const div = document.createElement('div');
                        div.className = `cl-item ${active?'active':''}`;
                        div.setAttribute('role', 'option');
                        div.setAttribute('aria-selected', active);
                        div.tabIndex = 0;
                        div.onclick = () => this.setVal(type, o.v, o.n);
                        div.onkeypress = (e) => { if(e.key === 'Enter') this.setVal(type, o.v, o.n); };
                        div.innerHTML = `<span class="cl-name">${o.n}</span><i class="fas fa-check cl-check"></i>`;
                        list.appendChild(div);
                    });

                    const m = document.getElementById('cm-modal');
                    m.style.display = 'flex';
                    setTimeout(() => m.classList.add('cm-open'), 10);
                },

                closeModal: function() {
                    const m = document.getElementById('cm-modal');
                    m.classList.remove('cm-open');
                    setTimeout(() => m.style.display = 'none', 300);
                },

                setVal: function(type, v, n) {
                    if(type === 'gender') {
                        this.state.gender = v;
                        document.getElementById('sel-gender-txt').innerText = n;
                    } else if(type === 'height') {
                        this.state.hUnit = v;
                        document.getElementById('lbl-unit-h').innerText = v;
                        document.getElementById('inp-wrap-cm').className = v === 'cm' ? 'cb-inp-wrap' : 'hidden';
                        document.getElementById('inp-wrap-ft').className = v === 'ft' ? 'inp-grid-2' : 'hidden';
                    } else {
                        this.state.wUnit = v;
                        document.getElementById('lbl-unit-w').innerText = v;
                    }
                    this.closeModal();
                    this.calculate();
                },

                calculate: function() {
                    const age = parseFloat(document.getElementById('inp-age').value);
                    let h = 0, w = 0;

                    // Bug Fix: Added Safe Parsing
                    try {
                        if(this.state.hUnit === 'cm') {
                            const cmVal = parseFloat(document.getElementById('inp-h-cm').value);
                            if(!isNaN(cmVal)) h = cmVal / 100;
                        } else {
                            const ftVal = parseFloat(document.getElementById('inp-h-ft').value) || 0;
                            let inVal = parseFloat(document.getElementById('inp-h-in').value) || 0;
                            if(inVal > 11) inVal = 11;
                            h = ((ftVal * 12) + inVal) * 0.0254;
                        }

                        const wVal = parseFloat(document.getElementById('inp-w').value);
                        if(!isNaN(wVal)) {
                            w = wVal;
                            if(this.state.wUnit === 'lbs') w *= 0.453592;
                        }
                    } catch(e) {
                        console.error('Child BMI Parse Error', e);
                    }

                    if(!age || isNaN(age) || !h || !w || !this.state.gender || age < 2 || age > 20) {
                        document.getElementById('empty-state').classList.remove('hidden');
                        document.getElementById('empty-state').setAttribute('aria-hidden', 'false');
                        document.getElementById('res-dashboard').classList.add('hidden');
                        document.getElementById('res-dashboard').setAttribute('aria-hidden', 'true');
                        return;
                    }

                    document.getElementById('empty-state').classList.add('hidden');
                    document.getElementById('empty-state').setAttribute('aria-hidden', 'true');
                    document.getElementById('res-dashboard').classList.remove('hidden');
                    document.getElementById('res-dashboard').setAttribute('aria-hidden', 'false');

                    const bmi = w / (h * h);
                    
                    // CDC Percentile Approximation (Simplified for offline use)
                    // In real app, we use Z-score tables. Here we estimate based on CDC curves.
                    let percentile = 50; 
                    const refBmi = 14 + (age * 0.4); // Rough median
                    percentile = Math.min(99, Math.max(1, (bmi / refBmi) * 50));

                    this.render(percentile, bmi, age);
                },

                render: function(p, bmi, age) {
                    const pEl = document.getElementById('res-percentile');
                    const cEl = document.getElementById('res-cat');
                    const mEl = document.getElementById('res-marker');
                    const iEl = document.getElementById('ins-text');

                    pEl.innerText = Math.round(p) + (p%10==1&&p!=11?'st':p%10==2&&p!=12?'nd':p%10==3&&p!=13?'rd':'th');
                    mEl.style.left = p + '%';

                    let cat = "Healthy Weight", col = "#10b981";
                    if(p < 5) { cat = "Underweight"; col = "#38bdf8"; }
                    else if(p >= 85 && p < 95) { cat = "Overweight"; col = "#f59e0b"; }
                    else if(p >= 95) { cat = "Obese"; col = "#ef4444"; }

                    cEl.innerText = cat;
                    cEl.style.color = col;
                    cEl.style.backgroundColor = `rgba(0,0,0,0.2)`;
                    cEl.style.border = `1px solid ${col}`;

                    iEl.innerHTML = `At age <span class="ins-hl">${age}</span>, a BMI of <span class="ins-hl">${bmi.toFixed(1)}</span> places this child in the <span class="ins-hl">${Math.round(p)}th percentile</span>. This is considered <span class="ins-hl" style="color:${col}">${cat}</span> per CDC guidelines.`;
                }
            };
            window.QS_ChildBMI.initListener();
        })();
    </script>
</body>
</html>
