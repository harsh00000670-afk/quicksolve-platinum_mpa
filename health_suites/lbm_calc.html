<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Made Zoomable by removing maximum-scale and user-scalable=no -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="Cache-Control" content="max-age=3600, must-revalidate">

    <title>Lean Body Mass (LBM) Calculator | Muscle Mass Tracker | QuickSolve Platinum</title>
    
    <!-- Enhanced SEO & Meta Tags -->
    <meta name="description" content="Calculate your precise Lean Body Mass (LBM) using Boer, James, and Hume formulas. Professional muscle mass tracking for athletes. 100% Offline.">
    <meta name="keywords" content="lean body mass calculator, lbm formula, muscle mass tracker, calculate muscle weight, fitness analytics, QuickSolve Platinum">
    <meta name="author" content="Harsh - QuickSolve Team">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://quicksolve-platinum.netlify.app/health_suites/lbm_calc.html">

    <meta property="og:title" content="Lean Body Mass (LBM) Calculator | QuickSolve Platinum">
    <meta property="og:description" content="Calculate your precise Lean Body Mass (LBM) using Boer, James, and Hume formulas. Professional muscle mass tracking.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://quicksolve-platinum.netlify.app/health_suites/lbm_calc.html">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">

    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="../assets/css/all.min.css">
    <link rel="stylesheet" href="../style.css">

    <style>
        /* =========================================
           LEAN BODY MASS (PLATINUM GOD MODE)
           Theme: Obsidian / Muscle Purple
           ========================================= */
        #mod-lbm-overlay {
            position: fixed !important; top: 0; left: 0; width: 100vw; height: 100dvh;
            background-color: #020617; z-index: 5000 !important;
            display: flex; flex-direction: column; animation: fadeIn 0.3s ease;
            font-family: sans-serif;
        }

        /* Laptop / Desktop Compatibility */
        @media (min-width: 768px) {
            #mod-lbm-overlay {
                max-width: 480px;
                margin: 0 auto;
                left: 50%;
                transform: translateX(-50%);
                border-left: 1px solid #1e293b;
                border-right: 1px solid #1e293b;
                box-shadow: 0 0 30px rgba(0,0,0,0.8);
            }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Header centered modification */
        .lbm-head {
            display: flex; align-items: center; justify-content: center; padding: 12px 15px; 
            background: #0f172a; border-bottom: 1px solid #1e293b;
            position: sticky; top: 0; z-index: 100; flex-shrink: 0;
        }
        .lbm-head .qs-back-btn { position: absolute; left: 15px; background: none; border: none; color: #f8fafc; font-size: 1.2rem; cursor: pointer; text-decoration: none;}
        .lbm-tit { color: #a78bfa; font-weight: 900; font-size: 1rem; margin-left: 0; text-transform: uppercase; letter-spacing: 2px;}

        .lbm-body { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 80px; }

        /* Sleek Cards */
        .lbm-card { 
            background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; 
            padding: 15px; display: flex; flex-direction: column; gap: 10px;
        }
        
        .lbm-lbl { font-size: 0.7rem; color: #94a3b8; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        
        .lbm-inp-wrap { display: flex; align-items: center; gap: 10px; background: rgba(2, 6, 23, 0.5); padding: 12px; border-radius: 8px; border: 1px solid #1e293b; cursor: pointer; transition: 0.2s; }
        .lbm-inp-wrap:focus-within { border-color: #a78bfa; box-shadow: 0 0 10px rgba(167, 139, 250, 0.1); }
        .lbm-inp { flex: 1; background: transparent; border: none; color: #fff; font-size: 1.1rem; font-weight: 900; outline: none; width: 100%; text-align: center; font-family: monospace; }
        .lbm-unit { color: #475569; font-weight: bold; font-size: 0.75rem; }

        .inp-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* Custom Select Trigger */
        .lbm-select-text { flex: 1; color: #fff; font-size: 0.95rem; font-weight: 900; display: flex; align-items: center; gap: 10px; }

        /* Result Panel */
        .res-panel { background: #020617; border: 1px solid #a78bfa; border-radius: 12px; padding: 25px 15px; text-align: center; position: relative; box-shadow: inset 0 0 30px rgba(167, 139, 250, 0.05); }
        .res-panel::before { content: 'COMPOSITION ANALYTICS'; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #a78bfa; color: #020617; font-size: 0.6rem; font-weight: 900; padding: 2px 10px; border-radius: 4px; letter-spacing: 1px; }
        
        .lbm-val { font-size: 3.5rem; font-weight: 900; color: #a78bfa; font-family: monospace; line-height: 1; }
        .lbm-pct { font-size: 1rem; font-weight: 900; color: #f8fafc; margin-top: 5px; }

        .formula-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 20px; border-top: 1px solid #1e293b; padding-top: 15px; }
        .f-box { text-align: center; }
        .f-lbl { font-size: 0.55rem; color: #64748b; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
        .f-val { font-size: 0.9rem; color: #f8fafc; font-weight: 900; font-family: monospace; }

        /* Custom Bottom Sheet Modal (Platinum) */
        .lm-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0, 0, 0, 0.8); z-index: 9999; flex-direction: column; justify-content: flex-end; animation: fadeIn 0.2s; }
        .lm-content { background: #0f172a; border-top-left-radius: 20px; border-top-right-radius: 20px; display: flex; flex-direction: column; overflow: hidden; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .lm-open .lm-content { transform: translateY(0); }
        
        .lm-head { padding: 15px 20px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
        .lm-head span { color: #a78bfa; font-weight: 900; font-size: 1rem; text-transform: uppercase; }
        .lm-close { background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; }
        
        .lm-list { padding: 10px 0; }
        .ll-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid rgba(30, 41, 59, 0.5); cursor: pointer; }
        .ll-name { font-weight: 900; color: #f8fafc; font-size: 0.95rem; }
        .ll-check { color: #a78bfa; display: none; }
        .ll-item.active .ll-check { display: block; }
        .ll-item.active .ll-name { color: #a78bfa; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <main id="mod-lbm-overlay" role="main" aria-label="Lean Body Mass Calculator">
        <header class="lbm-head">
            <a href="../health.html" class="qs-back-btn" aria-label="Go Back"><i class="fas fa-arrow-left" aria-hidden="true"></i></a>
            <!-- Converted to H1 for SEO -->
            <h1 class="lbm-tit"><i class="fas fa-dumbbell" aria-hidden="true"></i> LEAN BODY MASS</h1>
        </header>

        <section class="lbm-body">
            
            <div class="lbm-card">
                <div class="lbm-lbl" id="lbl-gender-title">Biological Gender</div>
                <div class="lbm-inp-wrap" role="button" tabindex="0" aria-haspopup="dialog" aria-labelledby="lbl-gender-title sel-gender-text" onclick="QS_LBM.openModal('gender')" onkeypress="if(event.key==='Enter')QS_LBM.openModal('gender')" aria-label="Select Gender">
                    <div id="sel-gender-text" class="lbm-select-text">
                        <i class="fas fa-venus-mars" style="color:#a78bfa;" aria-hidden="true"></i> Select Gender
                    </div>
                    <i class="fas fa-chevron-down" style="color:#64748b; font-size:0.8rem;" aria-hidden="true"></i>
                </div>

                <div class="lbm-lbl" id="lbl-weight-title">Weight</div>
                <div class="lbm-inp-wrap" role="button" tabindex="0" aria-haspopup="dialog" aria-labelledby="lbl-weight-title sel-w-text" onclick="QS_LBM.openModal('weight')" onkeypress="if(event.key==='Enter')QS_LBM.openModal('weight')">
                    <div id="sel-w-text" class="lbm-select-text">
                        <i class="fas fa-weight-hanging" style="color:#38bdf8;" aria-hidden="true"></i> kg / lbs
                    </div>
                    <i class="fas fa-chevron-down" style="color:#64748b; font-size:0.8rem;" aria-hidden="true"></i>
                </div>
                <div class="lbm-inp-wrap" style="cursor: text;">
                    <input type="number" id="inp-w" class="lbm-inp" placeholder="Enter Weight" min="0" step="any" aria-labelledby="lbl-weight-title" oninput="QS_LBM.calculate()">
                    <span id="lbl-w-unit" class="lbm-unit">KG</span>
                </div>

                <div class="lbm-lbl" id="lbl-height-title">Height</div>
                <div class="lbm-inp-wrap" role="button" tabindex="0" aria-haspopup="dialog" aria-labelledby="lbl-height-title sel-h-text" onclick="QS_LBM.openModal('height')" onkeypress="if(event.key==='Enter')QS_LBM.openModal('height')">
                    <div id="sel-h-text" class="lbm-select-text">
                        <i class="fas fa-ruler-vertical" style="color:#10b981;" aria-hidden="true"></i> cm / ft
                    </div>
                    <i class="fas fa-chevron-down" style="color:#64748b; font-size:0.8rem;" aria-hidden="true"></i>
                </div>
                
                <div id="inp-wrap-cm">
                    <div class="lbm-inp-wrap" style="cursor: text;">
                        <input type="number" id="inp-h-cm" class="lbm-inp" placeholder="Height in cm" min="0" step="any" aria-labelledby="lbl-height-title" oninput="QS_LBM.calculate()">
                        <span class="lbm-unit">CM</span>
                    </div>
                </div>

                <div id="inp-wrap-ft" class="hidden">
                    <div class="inp-grid-2">
                        <div class="lbm-inp-wrap" style="cursor: text;">
                            <input type="number" id="inp-h-ft" class="lbm-inp" placeholder="Ft" min="0" step="any" aria-label="Feet" oninput="QS_LBM.calculate()">
                        </div>
                        <div class="lbm-inp-wrap" style="cursor: text;">
                            <!-- Bug Fix: Inches capped safely at 11 -->
                            <input type="number" id="inp-h-in" class="lbm-inp" placeholder="In" min="0" max="11" step="any" aria-label="Inches" oninput="if(this.value>11)this.value=11; QS_LBM.calculate();">
                        </div>
                    </div>
                </div>
            </div>

            <div id="empty-state" style="text-align:center; padding:30px 20px; color:#475569;" aria-hidden="false">
                <i class="fas fa-user-shield fa-3x" style="opacity:0.3; margin-bottom:15px;" aria-hidden="true"></i>
                <div style="font-size:0.85rem; font-weight:bold;">Enter metrics to isolate your true lean mass.</div>
            </div>

            <div id="res-dashboard" class="res-panel hidden" aria-live="polite" aria-hidden="true">
                <div class="lbm-val" id="res-val">0.0</div>
                <div id="res-unit-label" style="color:#a78bfa; font-weight:900; font-family:monospace;">KG</div>
                <div class="lbm-pct" id="res-pct">0.0% Lean Mass</div>

                <div class="formula-grid">
                    <div class="f-box">
                        <div class="f-lbl">Boer</div>
                        <div class="f-val" id="res-boer">0.0</div>
                    </div>
                    <div class="f-box">
                        <div class="f-lbl">James</div>
                        <div class="f-val" id="res-james">0.0</div>
                    </div>
                    <div class="f-box">
                        <div class="f-lbl">Hume</div>
                        <div class="f-val" id="res-hume">0.0</div>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <!-- ARIA Modal Enhancements -->
    <div id="cm-modal" class="lm-modal" role="dialog" aria-modal="true" aria-labelledby="cm-title">
        <div class="lm-content">
            <div class="lm-head">
                <h2 id="cm-title" style="margin:0; font-size:1rem; color:#a78bfa; font-weight:900; text-transform:uppercase;">Select</h2>
                <button class="lm-close" aria-label="Close Selector" onclick="QS_LBM.closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="lm-list" id="cm-list" role="listbox"></div>
        </div>
    </div>

    <script>
        /* QUICKSOLVE PLATINUM - LBM ENGINE
           Features: Boer, James, and Hume Multi-formula math, Custom Bottom Sheets.
           BugFixes: ARIA Updates, Safe Parsing, Inches Cap Limit.
        */
        (function() {
            window.QS_LBM = {
                state: { gender: 'male', hUnit: 'cm', wUnit: 'kg' },
                
                initListener: function() {
                    this.updateSelectionText();
                    window.addEventListener('qs-tool-opened', (e) => {
                        if(e.detail && e.detail.tool === 'health_suites/lbm_calc.js') this.calculate();
                    });
                    if(document.readyState === 'complete') this.calculate();
                    else document.addEventListener('DOMContentLoaded', () => this.calculate());
                },

                openModal: function(type) {
                    const titleMap = { gender: 'Select Gender', height: 'Height Unit', weight: 'Weight Unit' };
                    document.getElementById('cm-title').innerText = titleMap[type];
                    const list = document.getElementById('cm-list');
                    list.innerHTML = '';

                    let opts = [];
                    if(type === 'gender') opts = [{v:'male', n:'Male', i:'fa-mars'}, {v:'female', n:'Female', i:'fa-venus'}];
                    else if(type === 'height') opts = [{v:'cm', n:'Centimeters (cm)'}, {v:'ft', n:'Feet & Inches'}];
                    else opts = [{v:'kg', n:'Kilograms (kg)'}, {v:'lbs', n:'Pounds (lbs)'}];

                    opts.forEach(o => {
                        const currentVal = (type === 'gender' ? this.state.gender : (type === 'height' ? this.state.hUnit : this.state.wUnit));
                        const active = currentVal === o.v;
                        const div = document.createElement('div');
                        div.className = `ll-item ${active ? 'active' : ''}`;
                        div.setAttribute('role', 'option');
                        div.setAttribute('aria-selected', active);
                        div.tabIndex = 0;
                        div.onclick = () => this.setVal(type, o.v, o.n);
                        div.onkeypress = (e) => { if(e.key === 'Enter') this.setVal(type, o.v, o.n); };
                        div.innerHTML = `<span class="ll-name">${o.n}</span><i class="fas fa-check ll-check"></i>`;
                        list.appendChild(div);
                    });

                    const m = document.getElementById('cm-modal');
                    m.style.display = 'flex';
                    setTimeout(() => m.classList.add('lm-open'), 10);
                },

                closeModal: function() {
                    const m = document.getElementById('cm-modal');
                    m.classList.remove('lm-open');
                    setTimeout(() => m.style.display = 'none', 300);
                },

                setVal: function(type, v, n) {
                    if(type === 'gender') this.state.gender = v;
                    else if(type === 'height') this.state.hUnit = v;
                    else this.state.wUnit = v;
                    
                    this.updateSelectionText();
                    this.closeModal();
                    this.calculate();
                },

                updateSelectionText: function() {
                    document.getElementById('sel-gender-text').innerHTML = `<i class="fas ${this.state.gender === 'male' ? 'fa-mars' : 'fa-venus'}" style="color:#a78bfa;" aria-hidden="true"></i> ${this.state.gender.toUpperCase()}`;
                    document.getElementById('sel-w-text').innerHTML = `<i class="fas fa-weight-hanging" style="color:#38bdf8;" aria-hidden="true"></i> ${this.state.wUnit.toUpperCase()}`;
                    document.getElementById('lbl-w-unit').innerText = this.state.wUnit.toUpperCase();
                    document.getElementById('sel-h-text').innerHTML = `<i class="fas fa-ruler-vertical" style="color:#10b981;" aria-hidden="true"></i> ${this.state.hUnit.toUpperCase()}`;
                    
                    document.getElementById('inp-wrap-cm').className = this.state.hUnit === 'cm' ? '' : 'hidden';
                    document.getElementById('inp-wrap-ft').className = this.state.hUnit === 'ft' ? '' : 'hidden';
                    document.getElementById('res-unit-label').innerText = this.state.wUnit.toUpperCase();
                },

                calculate: function() {
                    let h = 0, w = 0;
                    
                    // Bug Fix: Added Safe Parsing
                    try {
                        const rawW = parseFloat(document.getElementById('inp-w').value);
                        if(!rawW || isNaN(rawW) || rawW <= 0) return this.hide();
                        
                        w = this.state.wUnit === 'lbs' ? rawW * 0.453592 : rawW;

                        if(this.state.hUnit === 'cm') {
                            const cmVal = parseFloat(document.getElementById('inp-h-cm').value);
                            if(!isNaN(cmVal) && cmVal > 0) h = cmVal;
                        } else {
                            const ftVal = parseFloat(document.getElementById('inp-h-ft').value) || 0;
                            let inVal = parseFloat(document.getElementById('inp-h-in').value) || 0;
                            if(inVal > 11) inVal = 11;
                            h = ((ftVal * 12) + inVal) * 2.54;
                        }
                    } catch (e) {
                        console.error('LBM Parse Error', e);
                    }

                    if(!h || !w || h <= 0) return this.hide();

                    document.getElementById('empty-state').classList.add('hidden');
                    document.getElementById('empty-state').setAttribute('aria-hidden', 'true');
                    document.getElementById('res-dashboard').classList.remove('hidden');
                    document.getElementById('res-dashboard').setAttribute('aria-hidden', 'false');

                    const isMale = this.state.gender === 'male';
                    
                    // 1. Boer Formula
                    let boer = isMale ? (0.407 * w + 0.267 * h - 19.2) : (0.252 * w + 0.473 * h - 48.3);
                    // 2. James Formula
                    let james = isMale ? (1.1 * w - 128 * Math.pow(w/h, 2)) : (1.07 * w - 148 * Math.pow(w/h, 2));
                    // 3. Hume Formula
                    let hume = isMale ? (0.32810 * w + 0.33929 * h - 29.5336) : (0.29569 * w + 0.41813 * h - 43.2933);

                    // Average for main result
                    let avgKg = (boer + james + hume) / 3;
                    
                    // Fallback to prevent negatives if user puts completely impossible specs
                    if(avgKg < 0) avgKg = 0;

                    let displayLBM = this.state.wUnit === 'lbs' ? avgKg * 2.20462 : avgKg;
                    
                    document.getElementById('res-val').innerText = displayLBM.toFixed(1);
                    document.getElementById('res-pct').innerText = ((avgKg/w)*100).toFixed(1) + "% Lean Mass";
                    
                    const unitConv = (val) => {
                        let safeVal = val < 0 ? 0 : val;
                        return this.state.wUnit === 'lbs' ? (safeVal * 2.20462).toFixed(1) : safeVal.toFixed(1);
                    };
                    
                    document.getElementById('res-boer').innerText = unitConv(boer);
                    document.getElementById('res-james').innerText = unitConv(james);
                    document.getElementById('res-hume').innerText = unitConv(hume);
                },

                hide: function() {
                    document.getElementById('empty-state').classList.remove('hidden');
                    document.getElementById('empty-state').setAttribute('aria-hidden', 'false');
                    document.getElementById('res-dashboard').classList.add('hidden');
                    document.getElementById('res-dashboard').setAttribute('aria-hidden', 'true');
                }
            };
            window.QS_LBM.initListener();
        })();
    </script>
</body>
</html>
