<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="Cache-Control" content="max-age=3600, must-revalidate">

    <title>US Navy Body Fat Calculator | Precision Analytics | QuickSolve Platinum</title>
    
    <meta name="description" content="Professional US Navy Body Fat Calculator. Calculate body fat percentage and lean mass using weight, neck, waist, and hip measurements. 100% Offline.">
    <meta name="keywords" content="body fat mass calculator, lean body mass, us navy body fat formula, fitness calculator, QuickSolve Platinum">

    <meta property="og:title" content="US Navy Body Fat Calculator | QuickSolve Platinum">
    <meta property="og:description" content="Calculate body fat percentage and lean mass using weight, neck, waist, and hip measurements. 100% Offline.">

    <meta property="og:url" content="https://quicksolve-platinum.netlify.app/health_suites/body_fat.html">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">

    <link rel="icon" type="image/png" href="../logo.png">

    <link rel="stylesheet" href="../style.css">

    <style>
        /* =========================================
           BODY FAT V2 (PLATINUM GOD MODE)
           Theme: Military Slate / Neon Orange
           ========================================= */
        #mod-bf-overlay {
            position: fixed !important; top: 0; left: 0; width: 100vw; height: 100dvh;
            background-color: #020617; z-index: 5000 !important;
            display: flex; flex-direction: column; animation: fadeIn 0.3s ease;
            font-family: sans-serif;
        }

        /* Laptop / Desktop Compatibility */
        @media (min-width: 768px) {
            #mod-bf-overlay {
                max-width: 480px;
                margin: 0 auto;
                left: 50%;
                transform: translateX(-50%);
                border-left: 1px solid #1e293b;
                border-right: 1px solid #1e293b;
                box-shadow: 0 0 30px rgba(0,0,0,0.8);
            }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Header centered modification */
        .bf-head {
            display: flex; align-items: center; justify-content: center; padding: 12px 15px; 
            background: #0f172a; border-bottom: 1px solid #1e293b;
            position: sticky; top: 0; z-index: 100; flex-shrink: 0;
        }
        .bf-head .qs-back-btn { position: absolute; left: 15px; background: none; border: none; color: #f8fafc; font-size: 1.2rem; cursor: pointer; text-decoration: none;}
        .bf-tit { color: #f97316; font-weight: 900; font-size: 1rem; margin-left: 0; text-transform: uppercase; letter-spacing: 2px;}

        .bf-body { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; padding-bottom: 80px; }

        .bf-card { 
            background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; 
            padding: 15px; display: flex; flex-direction: column; gap: 10px;
        }
        
        .bf-lbl { font-size: 0.7rem; color: #94a3b8; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        /* Gender Switcher */
        .gen-toggle { display: grid; grid-template-columns: 1fr 1fr; background: rgba(2, 6, 23, 0.5); border-radius: 8px; border: 1px solid #1e293b; padding: 4px; margin-bottom: 5px; }
        .gen-btn { padding: 10px; text-align: center; border-radius: 6px; font-weight: 900; font-size: 0.8rem; cursor: pointer; color: #64748b; transition: 0.2s; }
        .gen-btn.active { background: #f97316; color: #020617; }

        .bf-inp-wrap { display: flex; align-items: center; gap: 10px; background: rgba(2, 6, 23, 0.5); padding: 10px 12px; border-radius: 8px; border: 1px solid #1e293b; }
        .bf-inp-wrap:focus-within { border-color: #f97316; box-shadow: 0 0 10px rgba(249, 115, 22, 0.1); }
        .bf-inp { flex: 1; background: transparent; border: none; color: #fff; font-size: 1.1rem; font-weight: 900; outline: none; width: 100%; text-align: center; font-family: monospace; }
        .bf-unit { color: #475569; font-weight: bold; font-size: 0.75rem; }

        /* Result Panel */
        .res-panel { background: #020617; border: 1px solid #f97316; border-radius: 12px; padding: 25px 15px; text-align: center; position: relative; box-shadow: inset 0 0 20px rgba(249, 115, 22, 0.05); }
        .res-panel::before { content: 'US NAVY ANALYTICS'; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #f97316; color: #020617; font-size: 0.6rem; font-weight: 900; padding: 2px 10px; border-radius: 4px; letter-spacing: 1px; }
        
        .fat-val { font-size: 3.5rem; font-weight: 900; color: #f97316; font-family: monospace; line-height: 1; transition: color 0.3s; }
        .fat-cat { font-size: 0.85rem; font-weight: 900; text-transform: uppercase; color: #f8fafc; margin-top: 10px; letter-spacing: 2px; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; border-top: 1px solid #1e293b; padding-top: 15px; }
        .stat-box { text-align: left; }
        .s-lbl { font-size: 0.6rem; color: #64748b; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; display: block; }
        .s-val { font-size: 1.1rem; color: #f8fafc; font-weight: 900; font-family: monospace; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <main id="mod-bf-overlay" role="main" aria-label="Body Fat Calculator">
        <header class="bf-head">
            <a href="../health.html" class="qs-back-btn" aria-label="Go Back"><i class="fas fa-arrow-left"></i></a>
            <h1 class="bf-tit"><i class="fas fa-bullseye"></i> BODY FAT %</h1>
        </header>

        <section class="bf-body">
            
            <div class="bf-card">
                <div class="bf-lbl" id="lbl-gender">Biological Gender</div>
                <div class="gen-toggle" role="radiogroup" aria-labelledby="lbl-gender">
                    <div id="btn-male" class="gen-btn active" role="radio" aria-checked="true" tabindex="0" onclick="QS_BodyFat.setGender('male')">MALE</div>
                    <div id="btn-female" class="gen-btn" role="radio" aria-checked="false" tabindex="0" onclick="QS_BodyFat.setGender('female')">FEMALE</div>
                </div>

                <div class="bf-lbl" id="lbl-weight">Total Body Weight</div>
                <div class="bf-inp-wrap">
                    <i class="fas fa-weight-hanging" style="color:#f97316;"></i>
                    <input type="number" id="inp-weight-total" class="bf-inp" placeholder="e.g. 80" min="0" step="any" aria-labelledby="lbl-weight" oninput="QS_BodyFat.calculate()">
                    <span class="bf-unit">KG</span>
                </div>

                <div class="bf-lbl" id="lbl-height">Height (cm)</div>
                <div class="bf-inp-wrap">
                    <i class="fas fa-ruler-vertical" style="color:#38bdf8;"></i>
                    <input type="number" id="inp-h" class="bf-inp" placeholder="e.g. 186" min="0" step="any" aria-labelledby="lbl-height" oninput="QS_BodyFat.calculate()">
                    <span class="bf-unit">CM</span>
                </div>

                <div class="bf-lbl" id="lbl-neck">Neck (cm)</div>
                <div class="bf-inp-wrap">
                    <i class="fas fa-user-tie" style="color:#a78bfa;"></i>
                    <input type="number" id="inp-n" class="bf-inp" placeholder="e.g. 39" min="0" step="any" aria-labelledby="lbl-neck" oninput="QS_BodyFat.calculate()">
                    <span class="bf-unit">CM</span>
                </div>

                <div class="bf-lbl" id="lbl-waist">Waist (cm)</div>
                <div class="bf-inp-wrap">
                    <i class="fas fa-tape" style="color:#10b981;"></i>
                    <input type="number" id="inp-w" class="bf-inp" placeholder="e.g. 89" min="0" step="any" aria-labelledby="lbl-waist" oninput="QS_BodyFat.calculate()">
                    <span class="bf-unit">CM</span>
                </div>

                <div id="hip-field" class="hidden">
                    <div class="bf-lbl" id="lbl-hips">Hips (cm)</div>
                    <div class="bf-inp-wrap">
                        <i class="fas fa-arrows-alt-h" style="color:#ec4899;"></i>
                        <input type="number" id="inp-hip" class="bf-inp" placeholder="e.g. 95" min="0" step="any" aria-labelledby="lbl-hips" oninput="QS_BodyFat.calculate()">
                        <span class="bf-unit">CM</span>
                    </div>
                </div>
            </div>

            <div id="empty-state" style="text-align:center; padding:30px 20px; color:#475569;" aria-hidden="false">
                <i class="fas fa-id-card-alt fa-3x" style="opacity:0.3; margin-bottom:15px;"></i>
                <div style="font-size:0.85rem; font-weight:bold;">Enter all measurements for precision body-composition mapping.</div>
            </div>

            <div id="res-dashboard" class="res-panel hidden" aria-live="polite" aria-hidden="true">
                <div class="fat-val" id="res-val">0.0%</div>
                <div class="fat-cat" id="res-cat">--</div>

                <div class="stat-grid">
                    <div class="stat-box">
                        <span class="s-lbl">Body Fat Mass</span>
                        <span class="s-val" id="res-mass">0.0 kg</span>
                    </div>
                    <div class="stat-box">
                        <span class="s-lbl">Lean Body Mass</span>
                        <span class="s-val" id="res-lean">0.0 kg</span>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <script>
        /* QUICKSOLVE PLATINUM - BODY FAT ENGINE V2
           Features: US Navy Formula (Logarithmic), Mass & Lean composition.
        */
        (function() {
            window.QS_BodyFat = {
                gender: 'male',

                initListener: function() {
                    window.addEventListener('qs-tool-opened', (e) => {
                        if(e.detail && e.detail.tool === 'health_suites/body_fat.js') this.calculate();
                    });
                    
                    // Standalone Boot
                    if(document.readyState === 'complete'){
                         this.calculate();
                    } else {
                         document.addEventListener('DOMContentLoaded', () => this.calculate());
                    }
                },

                setGender: function(g) {
                    this.gender = g;
                    
                    // Update active classes
                    document.getElementById('btn-male').classList.toggle('active', g === 'male');
                    document.getElementById('btn-female').classList.toggle('active', g === 'female');
                    
                    // Update ARIA attributes for accessibility
                    document.getElementById('btn-male').setAttribute('aria-checked', g === 'male');
                    document.getElementById('btn-female').setAttribute('aria-checked', g === 'female');

                    document.getElementById('hip-field').classList.toggle('hidden', g === 'male');
                    
                    this.calculate();
                    if(window.doHaptic) window.doHaptic();
                },

                calculate: function() {
                    const totalWeight = parseFloat(document.getElementById('inp-weight-total').value);
                    const h = parseFloat(document.getElementById('inp-h').value);
                    const n = parseFloat(document.getElementById('inp-n').value);
                    const w = parseFloat(document.getElementById('inp-w').value);
                    const hip = parseFloat(document.getElementById('inp-hip').value) || 0;

                    // Basic Validation
                    if(!totalWeight || !h || !n || !w || (this.gender === 'female' && !hip)) {
                        document.getElementById('empty-state').classList.remove('hidden');
                        document.getElementById('empty-state').setAttribute('aria-hidden', 'false');
                        document.getElementById('res-dashboard').classList.add('hidden');
                        document.getElementById('res-dashboard').setAttribute('aria-hidden', 'true');
                        return;
                    }

                    document.getElementById('empty-state').classList.add('hidden');
                    document.getElementById('empty-state').setAttribute('aria-hidden', 'true');
                    document.getElementById('res-dashboard').classList.remove('hidden');
                    document.getElementById('res-dashboard').setAttribute('aria-hidden', 'false');

                    let fatPct = 0;
                    
                    // --- US Navy Formula (Metric Implementation) ---
                    // Formulas:
                    // Male: 495 / (1.0324 - 0.19077 * log10(waist - neck) + 0.15456 * log10(height)) - 450
                    // Female: 495 / (1.29579 - 0.35004 * log10(waist + hip - neck) + 0.22100 * log10(height)) - 450
                    
                    try {
                        if(this.gender === 'male') {
                            fatPct = 495 / (1.0324 - 0.19077 * Math.log10(w - n) + 0.15456 * Math.log10(h)) - 450;
                        } else {
                            fatPct = 495 / (1.29579 - 0.35004 * Math.log10(w + hip - n) + 0.22100 * Math.log10(h)) - 450;
                        }
                    } catch(e) {
                        fatPct = 0;
                    }

                    if(isNaN(fatPct) || fatPct < 0) fatPct = 0;

                    this.render(fatPct, totalWeight);
                },

                render: function(pct, totalW) {
                    const valEl = document.getElementById('res-val');
                    const catEl = document.getElementById('res-cat');
                    const massEl = document.getElementById('res-mass');
                    const leanEl = document.getElementById('res-lean');

                    valEl.innerText = pct.toFixed(1) + '%';

                    // Calculate actual masses
                    const fatMass = totalW * (pct / 100);
                    const leanMass = totalW - fatMass;

                    massEl.innerText = fatMass.toFixed(1) + ' kg';
                    leanEl.innerText = leanMass.toFixed(1) + ' kg';

                    let cat = "";
                    if(this.gender === 'male') {
                        if(pct < 6) cat = "Essential Fat";
                        else if(pct < 14) cat = "Athlete";
                        else if(pct < 18) cat = "Fitness";
                        else if(pct < 25) cat = "Average";
                        else cat = "Obese";
                    } else {
                        if(pct < 14) cat = "Essential Fat";
                        else if(pct < 21) cat = "Athlete";
                        else if(pct < 25) cat = "Fitness";
                        else if(pct < 32) cat = "Average";
                        else cat = "Obese";
                    }
                    catEl.innerText = cat;
                }
            };
            window.QS_BodyFat.initListener();
        })();
    </script>
</body>
</html>
