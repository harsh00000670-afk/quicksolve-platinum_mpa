<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Made Zoomable by removing maximum-scale and user-scalable=no -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="Cache-Control" content="max-age=3600, must-revalidate">

    <title>WHtR Calculator | Waist-to-Height Ratio | QuickSolve Platinum</title>
    
    <!-- Enhanced SEO & Meta Tags -->
    <meta name="description" content="Calculate your Waist-to-Height Ratio (WHtR) for accurate belly fat and heart health analysis. Follow the 0.5 rule for cardiovascular fitness. 100% Offline.">
    <meta name="keywords" content="whtr calculator, waist to height ratio, belly fat tracker, heart risk calculator, 0.5 waist rule, fitness analytics, QuickSolve Platinum">
    <meta name="author" content="Harsh - QuickSolve Team">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://quicksolve-platinum.netlify.app/health_suites/whtr.html">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="QuickSolve Platinum">
    <meta property="og:title" content="WHtR Calculator | Waist-to-Height Ratio">
    <meta property="og:description" content="Calculate your Waist-to-Height Ratio (WHtR) for accurate belly fat and heart health analysis. Follow the 0.5 rule.">
    <meta property="og:url" content="https://quicksolve-platinum.netlify.app/health_suites/whtr.html">
    <meta property="og:image" content="../logo.png">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">

    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="../assets/css/all.min.css">
    <link rel="stylesheet" href="../style.css">

    <style>
        /* =========================================
           WHtR CALCULATOR (PLATINUM GOD MODE)
           Theme: Obsidian / Teal & Lime
           ========================================= */
        #mod-whtr-overlay {
            position: fixed !important; top: 0; left: 0; width: 100vw; height: 100dvh;
            background-color: #020617; z-index: 5000 !important;
            display: flex; flex-direction: column; animation: fadeIn 0.3s ease;
            font-family: sans-serif;
        }

        /* Laptop / Desktop Compatibility */
        @media (min-width: 768px) {
            #mod-whtr-overlay {
                max-width: 480px;
                margin: 0 auto;
                left: 50%;
                transform: translateX(-50%);
                border-left: 1px solid #1e293b;
                border-right: 1px solid #1e293b;
                box-shadow: 0 0 30px rgba(0,0,0,0.8);
            }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Header centered modification */
        .wt-head {
            display: flex; align-items: center; justify-content: center; padding: 12px 15px; 
            background: #0f172a; border-bottom: 1px solid #1e293b;
            position: sticky; top: 0; z-index: 100; flex-shrink: 0;
        }
        .wt-head .qs-back-btn { position: absolute; left: 15px; background: none; border: none; color: #f8fafc; font-size: 1.2rem; cursor: pointer; text-decoration: none;}
        .wt-tit { color: #22d3ee; font-weight: 900; font-size: 1rem; margin-left: 0; text-transform: uppercase; letter-spacing: 2px;}

        .wt-body { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 80px; }

        .wt-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        .wt-lbl { font-size: 0.7rem; color: #94a3b8; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        .wt-inp-wrap { display: flex; align-items: center; gap: 10px; background: rgba(2, 6, 23, 0.5); padding: 12px; border-radius: 8px; border: 1px solid #1e293b; cursor: pointer; transition: 0.2s; }
        .wt-inp-wrap:focus-within { border-color: #22d3ee; }
        .wt-inp { flex: 1; background: transparent; border: none; color: #fff; font-size: 1.1rem; font-weight: 900; outline: none; width: 100%; text-align: center; font-family: monospace; }
        .wt-unit { color: #475569; font-weight: bold; font-size: 0.75rem; }

        /* Results Display */
        .res-hero { background: #020617; border: 1px solid #22d3ee; border-radius: 12px; padding: 25px 15px; text-align: center; position: relative; box-shadow: inset 0 0 30px rgba(34, 211, 238, 0.05); }
        .res-hero::before { content: 'WHtR 0.5 RULE'; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #22d3ee; color: #020617; font-size: 0.6rem; font-weight: 900; padding: 2px 10px; border-radius: 4px; letter-spacing: 1px; }
        
        .whtr-val { font-size: 3.5rem; font-weight: 900; color: #22d3ee; font-family: monospace; line-height: 1; }
        .whtr-cat { font-size: 0.9rem; font-weight: 900; text-transform: uppercase; color: #f8fafc; margin-top: 10px; letter-spacing: 2px; }

        /* Ratio Gauge */
        .gauge-wrap { width: 100%; height: 8px; background: #1e293b; border-radius: 4px; margin-top: 25px; position: relative; }
        .gauge-fill { height: 100%; width: 0%; border-radius: 4px; background: linear-gradient(to right, #38bdf8, #10b981, #facc15, #ef4444); transition: width 0.8s; }
        .gauge-marker { position: absolute; top: -12px; width: 2px; height: 32px; background: #fff; box-shadow: 0 0 8px #fff; transform: translateX(-50%); transition: left 0.8s; }
        .gauge-labels { display: flex; justify-content: space-between; font-size: 0.55rem; color: #64748b; font-weight: 900; margin-top: 15px; font-family: monospace; }

        /* Insight Box */
        .ins-box { background: rgba(30, 41, 59, 0.5); border: 1px dashed #475569; border-radius: 8px; padding: 12px; margin-top: 20px; display: flex; align-items: center; gap: 12px; text-align: left; }
        .ins-icon { font-size: 1.5rem; color: #22d3ee; }
        .ins-txt { font-size: 0.75rem; color: #cbd5e1; font-weight: bold; line-height: 1.4; }

        /* Modals */
        .tm-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0, 0, 0, 0.8); z-index: 9999; flex-direction: column; justify-content: flex-end; animation: fadeIn 0.2s; }
        .tm-content { background: #0f172a; border-top-left-radius: 20px; border-top-right-radius: 20px; display: flex; flex-direction: column; overflow: hidden; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .tm-open .tm-content { transform: translateY(0); }
        .tm-head { padding: 15px 20px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
        .tm-head span { color: #22d3ee; font-weight: 900; font-size: 1rem; text-transform: uppercase; }
        .tm-close { background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; }
        .tm-list { padding: 10px 0; }
        .tl-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid rgba(30, 41, 59, 0.5); cursor: pointer; }
        .tl-name { font-weight: 900; color: #f8fafc; font-size: 0.95rem; }
        .tl-check { color: #22d3ee; display: none; }
        .tl-item.active .tl-check { display: block; }
        .tl-item.active .tl-name { color: #22d3ee; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <main id="mod-whtr-overlay" role="main" aria-label="Waist to Height Ratio Calculator">
        <header class="wt-head">
            <a href="../health.html" class="qs-back-btn" aria-label="Go Back"><i class="fas fa-arrow-left" aria-hidden="true"></i></a>
            <!-- Converted to H1 for SEO -->
            <h1 class="wt-tit"><i class="fas fa-ruler-combined" aria-hidden="true"></i> WHtR ANALYTICS</h1>
        </header>

        <section class="wt-body">
            
            <div class="wt-card">
                <div class="wt-lbl" id="lbl-gender-title">Biological Gender</div>
                <div class="wt-inp-wrap" role="button" tabindex="0" aria-haspopup="dialog" aria-labelledby="lbl-gender-title sel-gender-txt" onclick="QS_WHtR.openModal('gender')" onkeypress="if(event.key==='Enter')QS_WHtR.openModal('gender')" style="cursor:pointer;">
                    <i class="fas fa-venus-mars" style="color:#22d3ee;" aria-hidden="true"></i>
                    <div id="sel-gender-txt" style="flex:1; color:#fff; font-weight:900; font-size:0.95rem;">Select Gender</div>
                    <i class="fas fa-chevron-down" style="color:#64748b; font-size:0.8rem;" aria-hidden="true"></i>
                </div>

                <div class="wt-lbl" id="lbl-unit-title">Measurement Unit</div>
                <div class="wt-inp-wrap" role="button" tabindex="0" aria-haspopup="dialog" aria-labelledby="lbl-unit-title sel-unit-txt" onclick="QS_WHtR.openModal('unit')" onkeypress="if(event.key==='Enter')QS_WHtR.openModal('unit')" style="cursor:pointer;">
                    <i class="fas fa-tape" style="color:#10b981;" aria-hidden="true"></i>
                    <div id="sel-unit-txt" style="flex:1; color:#fff; font-weight:900; font-size:0.95rem;">Centimeters (cm)</div>
                    <i class="fas fa-chevron-down" style="color:#64748b; font-size:0.8rem;" aria-hidden="true"></i>
                </div>

                <div class="wt-lbl" id="lbl-height-title">Total Height</div>
                <div id="inp-wrap-cm" class="wt-inp-wrap" style="cursor: text;">
                    <input type="number" id="inp-h-cm" class="wt-inp" placeholder="Standing height" min="0" step="any" aria-labelledby="lbl-height-title" oninput="QS_WHtR.calculate()">
                    <span class="wt-unit">CM</span>
                </div>
                <div id="inp-wrap-ft" class="hidden" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <div class="wt-inp-wrap" style="cursor: text;">
                        <input type="number" id="inp-h-ft" class="wt-inp" placeholder="Ft" min="0" step="any" aria-label="Feet" oninput="QS_WHtR.calculate()">
                        <span class="wt-unit">FT</span>
                    </div>
                    <div class="wt-inp-wrap" style="cursor: text;">
                        <!-- Bug Fix: Inches capped safely at 11 -->
                        <input type="number" id="inp-h-in" class="wt-inp" placeholder="In" min="0" max="11" step="any" aria-label="Inches" oninput="if(this.value>11)this.value=11; QS_WHtR.calculate();">
                        <span class="wt-unit">IN</span>
                    </div>
                </div>

                <div class="wt-lbl" id="lbl-waist-title">Waist Circumference</div>
                <div class="wt-inp-wrap" style="cursor: text;">
                    <input type="number" id="inp-waist" class="wt-inp" placeholder="Belly button level" min="0" step="any" aria-labelledby="lbl-waist-title" oninput="QS_WHtR.calculate()">
                    <span id="lbl-waist-unit" class="wt-unit">CM</span>
                </div>
            </div>

            <!-- Newly Added Empty State for consistency across apps -->
            <div id="empty-state" style="text-align:center; padding:30px 20px; color:#475569;" aria-hidden="false">
                <i class="fas fa-heartbeat fa-3x" style="opacity:0.3; margin-bottom:15px;" aria-hidden="true"></i>
                <div style="font-size:0.85rem; font-weight:bold;">Input metrics to analyze your Waist-to-Height Ratio.</div>
            </div>

            <div id="res-dashboard" class="hidden" aria-live="polite" aria-hidden="true">
                <div class="res-hero">
                    <div class="whtr-val" id="res-val">0.00</div>
                    <div class="whtr-cat" id="res-cat">--</div>

                    <div class="gauge-wrap" aria-hidden="true">
                        <div class="gauge-fill"></div>
                        <div class="gauge-marker" id="res-marker"></div>
                    </div>
                    <div class="gauge-labels" aria-hidden="true">
                        <span>0.4 (Under)</span>
                        <span>0.5 (Ideal)</span>
                        <span>0.6 (High Risk)</span>
                    </div>
                </div>

                <div class="ins-box">
                    <i class="fas fa-info-circle ins-icon" id="res-icon" aria-hidden="true"></i>
                    <div class="ins-txt" id="res-ins">Awaiting data for analysis.</div>
                </div>
            </div>

        </section>
    </main>

    <!-- ARIA Modal Enhancements -->
    <div id="cm-modal" class="tm-modal" role="dialog" aria-modal="true" aria-labelledby="tm-title">
        <div class="tm-content">
            <div class="tm-head">
                <h2 id="tm-title" style="margin:0; font-size:1rem; color:#22d3ee; font-weight:900; text-transform:uppercase;">Select</h2>
                <button class="tm-close" aria-label="Close Selector" onclick="QS_WHtR.closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="tm-list" id="tm-list" role="listbox"></div>
        </div>
    </div>

    <script>
        /* QUICKSOLVE PLATINUM - WHtR ENGINE
           Features: The 0.5 Rule Implementation, Cardiovascular Risk Mapping.
           BugFixes: ARIA Updates, Safe Parsing, Empty State Addition, Inches Cap Limit.
        */
        (function() {
            window.QS_WHtR = {
                state: { gender: null, unit: 'cm' },
                
                initListener: function() {
                    window.addEventListener('qs-tool-opened', (e) => {
                        if(e.detail && e.detail.tool === 'health_suites/whtr.js') this.calculate();
                    });
                },

                openModal: function(type) {
                    document.getElementById('tm-title').innerText = type === 'gender' ? 'Select Gender' : 'Measurement Unit';
                    const list = document.getElementById('tm-list');
                    list.innerHTML = '';
                    let opts = type === 'gender' ? [{v:'male', n:'Male'}, {v:'female', n:'Female'}] : [{v:'cm', n:'Centimeters (cm)'}, {v:'in', n:'Inches (in)'}];

                    opts.forEach(o => {
                        const active = (this.state[type] === o.v);
                        const div = document.createElement('div');
                        div.className = `tl-item ${active ? 'active' : ''}`;
                        div.setAttribute('role', 'option');
                        div.setAttribute('aria-selected', active);
                        div.tabIndex = 0;
                        
                        const performSelect = () => {
                            this.state[type] = o.v;
                            document.getElementById(type === 'gender' ? 'sel-gender-txt' : 'sel-unit-txt').innerText = o.n;
                            if(type === 'unit') {
                                document.getElementById('inp-wrap-cm').className = o.v === 'cm' ? 'wt-inp-wrap' : 'hidden';
                                document.getElementById('inp-wrap-ft').className = o.v === 'in' ? '' : 'hidden';
                                // Specific fix for overriding grid when switching
                                document.getElementById('inp-wrap-ft').style.display = o.v === 'in' ? 'grid' : 'none';
                                document.getElementById('lbl-waist-unit').innerText = o.v.toUpperCase();
                            }
                            this.closeModal();
                            this.calculate();
                        };

                        div.onclick = performSelect;
                        div.onkeypress = (e) => { if(e.key === 'Enter') performSelect(); };
                        
                        div.innerHTML = `<span class="tl-name">${o.n}</span><i class="fas fa-check tl-check"></i>`;
                        list.appendChild(div);
                    });
                    
                    const m = document.getElementById('cm-modal');
                    m.style.display = 'flex';
                    setTimeout(() => m.classList.add('tm-open'), 10);
                    if(window.doHaptic) window.doHaptic();
                },

                closeModal: function() {
                    const m = document.getElementById('cm-modal');
                    if(m) {
                        m.classList.remove('tm-open');
                        setTimeout(() => m.style.display = 'none', 300);
                    }
                    if(window.doHaptic) window.doHaptic();
                },

                calculate: function() {
                    let hM = 0;
                    let w = 0;

                    // Bug Fix: Added Safe Parsing
                    try {
                        if(this.state.unit === 'cm') {
                            const cmVal = parseFloat(document.getElementById('inp-h-cm').value);
                            if(!isNaN(cmVal) && cmVal > 0) hM = cmVal / 100;
                        } else {
                            const ftVal = parseFloat(document.getElementById('inp-h-ft').value) || 0;
                            let inVal = parseFloat(document.getElementById('inp-h-in').value) || 0;
                            if(inVal > 11) inVal = 11;
                            hM = ((ftVal * 12) + inVal) * 0.0254;
                        }

                        const waistVal = parseFloat(document.getElementById('inp-waist').value);
                        if(!isNaN(waistVal) && waistVal > 0) {
                            w = waistVal;
                            if(this.state.unit === 'in') w *= 2.54; // to cm for ratio consistency
                            w /= 100; // to meters
                        }
                    } catch(e) {
                        console.error('WHtR Parse Error', e);
                    }

                    const emptyState = document.getElementById('empty-state');
                    const resDashboard = document.getElementById('res-dashboard');

                    if(!hM || !w || hM <= 0 || w <= 0 || !this.state.gender) {
                        if(emptyState) {
                            emptyState.classList.remove('hidden');
                            emptyState.setAttribute('aria-hidden', 'false');
                        }
                        resDashboard.classList.add('hidden');
                        resDashboard.setAttribute('aria-hidden', 'true');
                        return;
                    }

                    if(emptyState) {
                        emptyState.classList.add('hidden');
                        emptyState.setAttribute('aria-hidden', 'true');
                    }
                    resDashboard.classList.remove('hidden');
                    resDashboard.setAttribute('aria-hidden', 'false');

                    const ratio = w / hM;
                    this.render(ratio);
                },

                render: function(r) {
                    document.getElementById('res-val').innerText = r.toFixed(2);
                    const marker = document.getElementById('res-marker');
                    const catEl = document.getElementById('res-cat');
                    const insEl = document.getElementById('res-ins');

                    // Mapping: 0.3 to 0.7 -> 0% to 100%
                    let pct = ((r - 0.3) / (0.7 - 0.3)) * 100;
                    marker.style.left = Math.min(100, Math.max(0, pct)) + '%';

                    let cat = "", col = "", ins = "";
                    if(r < 0.4) { cat = "Extremely Slim"; col = "#38bdf8"; ins = "Your waist is very small for your height. Ensure you are getting enough nutrition."; }
                    else if(r <= 0.5) { cat = "Healthy / Ideal"; col = "#10b981"; ins = "Perfect! Your waist is less than half your height. Low cardiovascular risk."; }
                    else if(r <= 0.6) { cat = "Overweight"; col = "#facc15"; ins = "Increased belly fat. You are slightly above the healthy 0.5 threshold."; }
                    else { cat = "High Risk"; col = "#ef4444"; ins = "Significant abdominal obesity. High risk of heart disease and diabetes."; }

                    catEl.innerText = cat;
                    catEl.style.color = col;
                    insEl.innerText = ins;
                    document.getElementById('res-icon').style.color = col;
                }
            };
            window.QS_WHtR.initListener();
        })();
    </script>
</body>
</html>
